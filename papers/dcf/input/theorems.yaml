      ##### Lemma C.1 (Appendix C, arXiv:1412.3661v4)
      ###### Definitions and notation
      \(\xi\) is a non-negative random variable, i.e. \(\xi\ge0\) almost surely. \(A\) and \(B\) are positive constants. \(P\) denotes probability, \(E\) denotes expectation, and \(1\{\cdot\}\) denotes the indicator function. The variable \(t\) is a non-negative real number.

      ###### Assumptions
      The random variable \(\xi\) is non-negative. There exist constants \(A>0\) and \(B>0\) such that
      \[
      P(\xi>x)\le A e^{-x/B}
      \]
      for all \(x\ge0\).

      ###### Statement
      Let \(\xi\) be a non-negative random variable such that
      \[
      P(\xi>x)\le A e^{-x/B}
      \]
      for all \(x\ge0\) and for some constants \(A,B>0\). Then for every \(t\ge0\),
      \[
      E[\xi^{3}1\{\xi>t\}]\le 6A(t+B)^{3}e^{-t/B}.
      \]

