theorems:
  - id: entry:selected:7e65aeed-a6b9-4c95-8f8f-a0640eeec71c
    title: Theorem 1 (two-sample Gaussian approximation over rectangles; rho_n_m double-star bound)
    kind: theorem
    latex_statement: |-
      We denote two samples by \(X^n=\{X_1,\ldots,X_n\}\) and \(Y^m=\{Y_1,\ldots,Y_m\}\) respectively, where \(X^n\) is a collection of mutually independent (not necessarily identically distributed) random vectors in \(\mathbb{R}^p\) with \(X_i=(X_{i1},\ldots,X_{ip})'\) and \(E(X_i)=\mu^X=(\mu_1^X,\ldots,\mu_p^X)'\), \(i=1,\ldots,n\), and \(Y^m\) is defined in a similar fashion with \(E(Y_i)=\mu^Y=(\mu_1^Y,\ldots,\mu_p^Y)'\) for all \(i=1,\ldots,m\).

      Denote \(F^n=\{F_1,\ldots,F_n\}\) as a set of mutually independent random vectors in \(\mathbb{R}^p\) such that \(F_i=(F_{i1},\ldots,F_{ip})'\) and
      \[
      F_i\sim N_p(\mu^X,E\{(X_i-\mu^X)(X_i-\mu^X)'\})
      \]
      for all \(i=1,\ldots,n\), which denotes a Gaussian approximation to \(X^n\). Likewise, define a set of mutually independent random vectors \(G^m=\{G_1,\ldots,G_m\}\) in \(\mathbb{R}^p\) such that \(G_i=(G_{i1},\ldots,G_{ip})'\) and
      \[
      G_i\sim N_p(\mu^Y,E\{(Y_i-\mu^Y)(Y_i-\mu^Y)'\})
      \]
      for all \(i=1,\ldots,m\) to approximate \(Y^m\). The sets \(X^n\), \(Y^m\), \(F^n\) and \(G^m\) are assumed to be independent of each other. Here \(\delta_{n,m}\) denotes a sequence of constants depending on both \(n\) and \(m\).

      Denote the normalized sums \(S_n^X\), \(S_n^F\), \(S_m^Y\) and \(S_m^G\) by
      \[
      S_n^X=n^{-1/2}\sum_{i=1}^n X_i=(S_{n1}^X,\ldots,S_{np}^X)',
      \]
      \[
      S_n^F=n^{-1/2}\sum_{i=1}^n F_i=(S_{n1}^F,\ldots,S_{np}^F)',
      \]
      \[
      S_m^Y=m^{-1/2}\sum_{i=1}^m Y_i=(S_{m1}^Y,\ldots,S_{mp}^Y)',
      \]
      \[
      S_m^G=m^{-1/2}\sum_{i=1}^m G_i=(S_{m1}^G,\ldots,S_{mp}^G)',
      \]
      where \(S_n^F\) and \(S_m^G\) serve as the Gaussian approximations for \(S_n^X\) and \(S_m^Y\), respectively.

      Denote
      \[
      L_n^X=\max_{1\leq j\leq p}\sum_{i=1}^n E(|X_{ij}-\mu_j^X|^3)/n,
      \qquad
      L_m^Y=\max_{1\leq j\leq p}\sum_{i=1}^m E(|Y_{ij}-\mu_j^Y|^3)/m.
      \]

      We denote the key quantity \(\rho_{n,m}^{**}\) by
      \[
      \begin{aligned}
      (2)\qquad \rho_{n,m}^{**}={}&\sup_{A\in\mathcal{A}^{Re}}\big|P(S_n^X-n^{1/2}\mu^X+\delta_{n,m}S_m^Y-\delta_{n,m}m^{1/2}\mu^Y\in A)\\
      &-P(S_n^F-n^{1/2}\mu^X+\delta_{n,m}S_m^G-\delta_{n,m}m^{1/2}\mu^Y\in A)\big|,
      \end{aligned}
      \]
      where \(P(S_n^X-n^{1/2}\mu^X+\delta_{n,m}S_m^Y-\delta_{n,m}m^{1/2}\mu^Y\in A)\) represents the unknown probability of interest, and \(P(S_n^F-n^{1/2}\mu^X+\delta_{n,m}S_m^G-\delta_{n,m}m^{1/2}\mu^Y\in A)\) serves as a Gaussian approximation to this probability of interest, and \(\rho_{n,m}^{**}\) measures the error of approximation over all hyperrectangles \(A\in\mathcal{A}^{Re}\). Here \(\mathcal{A}^{Re}\) is the class of all hyperrectangles in \(\mathbb{R}^p\) of the form
      \[
      \{w\in\mathbb{R}^p:a_j\leq w_j\leq b_j\text{ for all }j=1,\ldots,p\}
      \]
      with \(-\infty\leq a_j\leq b_j\leq\infty\) for all \(j=1,\ldots,p\).

      <!-- formalization-clarifications:v1:418bea93fdc39204ec44f9663d25d6b41b0bce86a9cf4a14c5b12d95e725cedb -->
      Formalization clarifications from source and proof:
      1. Constants and quantifier order. The selected result is Xue–Yao, Theorem 1. Its formal order is: fix positive integers \(n,m,p\), the random arrays \(X^n,Y^m,F^n,G^m\) with the stated independence/distributional structure, and any constant sequence \(\delta_{n,m}\); assume (a)–(e); then the displayed inequality holds with \(K_3>0\). Thus \(\delta_{n,m}\) is a parameter depending on \(n,m\), while \(\delta_1>\delta_2>0\), \(b>0\), \(c_1>0\), and \(K_3\) are called universal. As written, \(K_3\) must not depend on \(n,m,p\), \(B_{n,m}\), \(\delta_{n,m}\), the laws of \(X,Y,F,G\), or the random variables themselves. The source does not display any dependence of \(K_3\) on the named universal constants; the proof suggests dependence on \(b\) through Lemma 3/Lemma 4 and possibly on absolute constants, but this is not made fully explicit in the theorem statement. Do not silently let \(K_3\) depend on \(B_{n,m}\), \(p\), or the data. Condition (a), “\(\delta_2<|\delta_{n,m}|<\delta_1\),” is strict and uniform in \(n,m\); neither the lower nor upper bound may depend on \(n,m,p,B_{n,m}\), or the data. Condition (b), “\(\min_{1\le j\le p}E\{(\cdots)^2\}\ge b\),” gives a universal lower bound uniform in \(j,n,m,p\) and in the distributions; \(b\) is not allowed to depend on \(j,n,m,p,B_{n,m},\delta_{n,m}\), or the random vectors. \(B_{n,m}\ge1\) in condition (c) is a sequence of constants that may depend on \(n,m\) and on the law/distributional parameters, but not on the realized sample; it must bound both \(L_n^X\) and \(L_m^Y\), and the same \(B_{n,m}\) is used in (c), (d), and (e). By contrast, the proof-local quantities \(\phi_n^*,\phi_m^{**}\) defined in (17) are not universal; they depend on \(n,m,p,B_{n,m},\delta_{n,m}\) and on \(K_1\). The proof calls \(K_1\) universal and defines it from \(c_1,c_4,\ldots,c_7,K^*\). The constants \(c_4,\ldots,c_7\) appear after a maximum over \(p\); the source nevertheless labels them “positive universal constants,” so in the source’s intended reading they are not to depend on \(p,n,m,i,j\), or \(B_{n,m}\), but the exact statement of the cited Lemma 2.2.2 in van der Vaart–Wellner was not supplied, so the precise dependence in that external lemma is unresolved. For Lemma 3 in Xue–Yao (reference R3), \(K^*\) is stated to depend only on \(b\); for Lemma 4 in Xue–Yao (reference R5), \(K_2\) is stated to depend only on \(b\), and \(K_1\in(0,(K^*\vee2)^{-1}]\). There is an internal source-notation inconsistency: the supplied Appendix text for Lemma 4 contains a phrase suggesting \(K^*\) “depends on \(n\),” while Lemma 3 states it depends only on \(b\). Treat that as unresolved in the supplied text, not as permission to make constants depend on \(n\). In Chernozhukov–Chetverikov–Kato Lemma C.1 (reference R4), \(A>0\) and \(B>0\) are parameters of the tail hypothesis and are arbitrary positive constants in that universal lemma; in the Xue–Yao application one takes \(A=2\) and a tail scale of the form \(c_iB_{n,m}\log p\). Those application-specific choices do not restrict the cited universal lemma.

      2. Norms and mathematical objects. The ambient space is \(\mathbb R^p\) with coordinatewise notation. The main object \(\rho_{n,m}^{**}\) in (2) is a supremum over all hyperrectangles \(A\in\mathcal A^{\mathrm{Re}}\), not a supremum over Euclidean balls, not the Kolmogorov distance over halfspaces, and not the sup-norm ball distance. The exact expression is
      \[
      \sup_{A\in\mathcal A^{\mathrm{Re}}}\bigl|P(S_n^X-n^{1/2}\mu^X+\delta_{n,m}S_m^Y-\delta_{n,m}m^{1/2}\mu^Y\in A)
      -P(S_n^F-n^{1/2}\mu^X+\delta_{n,m}S_m^G-\delta_{n,m}m^{1/2}\mu^Y\in A)\bigr|,
      \]
      so \(\delta_{n,m}\) multiplies both \(S_m^Y\) and \(m^{1/2}\mu^Y\), and similarly for \(G\); it is not \(\delta_{n,m}S_m^Y-m^{1/2}\mu^Y\) or \(\delta_{n,m}(S_m^Y-\mu^Y)\). The class \(\mathcal A^{\mathrm{Re}}\) consists of products \(\{w:a_j\le w_j\le b_j,\ j=1,\dots,p\}\) with \(-\infty\le a_j\le b_j\le\infty\); finite, unbounded, and degenerate intervals are included. The proof also defines \(\rho_{n,m}\) using \(y\in\mathbb R^p\) and coordinatewise \(\le y\), and \(\rho_{n,m}^*\) using \(A\in\mathcal A^{\mathrm{Re}}\) with the \(v\)-mixture. These are distinct proof objects; do not replace \(\rho_{n,m}^{**}\) by \(\rho_{n,m}\) or \(\rho_{n,m}^*\). The only norms explicitly introduced are the Orlicz norms \(\|X\|_{\psi_\alpha}\) with \(\psi_\alpha(x)=\exp(x^\alpha)-1\) and
      \[
      \|X\|_{\psi_\alpha}=\inf\{\lambda>0:E\psi_\alpha(|X|/\lambda)\le1\}.
      \]
      The source uses \(\psi_1\) and \(\psi_2\), the latter via reference R1. These are not unnormalized exponential moments: condition (d) \(E\exp(|X_{ij}-\mu_j^X|/B_{n,m})\le2\) implies only \(\|X_{ij}-\mu_j^X\|_{\psi_1}\le B_{n,m}\) by taking \(\lambda=B_{n,m}\); the norm need not equal \(B_{n,m}\). The quantities \(L_n^X,L_m^Y\) are maxima over coordinates of averages of third absolute central moments:
      \[
      L_n^X=\max_{1\le j\le p}n^{-1}\sum_{i=1}^nE|X_{ij}-\mu_j^X|^3,\qquad
      L_m^Y=\max_{1\le j\le p}m^{-1}\sum_{i=1}^mE|Y_{ij}-\mu_j^Y|^3.
      \]
      Do not replace them by variances or by \((\max_j E|X_{ij}-\mu_j^X|^3)^{1/3}\). In the proof-local \(M\)-definitions, the threshold and integrand use \(\max_{1\le j\le p}|X_{ij}-\mu_j^X|^3 1\{\max_{1\le j\le p}|X_{ij}-\mu_j^X|>\cdots\}\), with sample-size normalization \(n^{-1}\) or \(m^{-1}\) outside the sum; the \(m\)-threshold contains \(|\\delta_{n,m}|\) in the denominator. The Gaussian objects are \(F_i\sim N_p(\mu^X,E[(X_i-\mu^X)(X_i-\mu^X)'])\) and \(G_i\sim N_p(\mu^Y,E[(Y_i-\mu^Y)(Y_i-\mu^Y)'])\), mutually independent within \(F^n\) and within \(G^m\), and independent of the other arrays. The displays for \(M_n^F(\phi)\) and \(M_m^G(\phi)\) print \(\mu_j^F\) and \(\mu_j^G\) without separately defining them; from the Gaussian means in the “Definitions and notation,” the intended identification is \(\mu_j^F=\mu_j^X\) and \(\mu_j^G=\mu_j^Y\) (reference R5 also records this). A fresh independent mean is not intended. Reference R4 is a tail-integration lemma for a nonnegative random variable \(\xi\): under \(P(\xi>x)\le Ae^{-x/B}\) for all \(x\ge0\), it gives \(E[\xi^3 1\{\xi>t\}]\le6A(t+B)^3e^{-t/B}\) for every \(t\ge0\). The \(B\) there is a tail-scale parameter of that external lemma, not the same symbol as \(B_{n,m}\).

      3. Asymptotics. Theorem 1 itself is not an asymptotic limit statement. It gives an explicit finite-\(n,m,p\) inequality under the listed assumptions; no relation such as \(n/(n+m)\to c\in(0,1)\) is assumed in Theorem 1, and condition (e) is a uniform inequality \((B_{n,m})^2\{\log(pn)\}^7/n\le c_1\), \((B_{n,m})^2\{\log(pm)\}^7/m\le c_1\), not a statement that either left side tends to zero. The bound can therefore be non-vanishing under Theorem 1. The condition \(n/(n+m)\in(c_1,c_2)\) appears later in Theorem 3, not in Theorem 1. The symbols \(\lesssim\) and \(\sim\) are defined in the paper: \(a_n\lesssim b_n\) means \(a_n\le Cb_n\) for a universal \(C>0\), and \(a_n\sim b_n\) means both \(a_n\lesssim b_n\) and \(b_n\lesssim a_n\); this \(\sim\) is two-sided bounded equivalence, not \(a_n/b_n\to1\). The proof uses \(\lesssim\) for intermediate deterministic estimates, but the theorem conclusion is the explicit \(K_3\) inequality; do not promote proof-local \(\lesssim\) chains into hypotheses or into a weaker asymptotic statement. The main probability \(P\) in Theorem 1 is the joint law of the four independent arrays \(X^n,Y^m,F^n,G^m\). The probability variants \(P_e\) and \(P_{e^*}\) occur in later multiplier-bootstrap theorems (Xue–Yao Theorems 2–5), not in the selected Theorem 1; if used elsewhere, \(P_e\) means probability with respect to the multiplier variables \(e^{n+m}\) only. The external R1/R2 Orlicz lemmas are universal statements independent of \(n,m,p\); the Xue–Yao proof applies them to specific Gaussian/coordinate bounds, and those applications do not restrict the cited lemmas. Likewise, R4’s inequality is for every \(t\ge0\), with no limiting variable; the proof specializes it at \(t=n^{1/2}/(4\phi\log p)\) or \(t=m^{1/2}/(4|\delta_{n,m}|\phi\log p)\).

      4. Potentially omitted definitions and side conditions. The source leaves the logarithm base unspecified; the paper writes \(\log p\), \(\log(pn)\), \(\log(pm)\), and the proofs use these inside exponentials and denominators. The conventional base is natural, but that is not stated explicitly; a formalization should keep a fixed consistent base and track constants. The source also does not explicitly state \(p\ge2\) or otherwise ensure \(\log p\ne0\), although the \(M\)-definitions and proof use \(1/\log p\) and factors \(\log p\); for \(p=1\) those expressions are problematic. Treat this as an implicit side condition or unresolved convention. It is implicit throughout that \(n,m,p\) are positive integers. The arrays \(X_i\) are mutually independent within \(X^n\) but not necessarily identically distributed; \(Y_i\) likewise; coordinates within a vector may be arbitrarily correlated; \(F_i\) and \(G_i\) are mutually independent Gaussian vectors with the stated means and covariances; the four sets \(X^n,Y^m,F^n,G^m\) are mutually independent. No further distributional or correlation assumption is part of Theorem 1. Condition (a) in Theorem 1 ensures \(|\delta_{n,m}|>\delta_2>0\), so the \(|\\delta_{n,m}|\)-denominators in \(M_m^Y,M_m^G\) are harmless there. The extracted statement of Lemma 4 in reference R5 does not explicitly list \(|\\delta_{n,m}|>0\) even though its \(M_m^Y,M_m^G\) definitions use \(|\\delta_{n,m}|\) in the denominator; that is an unresolved source-notation point, not a license to choose \(\delta_{n,m}=0\). Reference R3 contains an important proof/source mismatch: Lemma 3 as stated bounds \(\rho_{n,m}^*\) under condition (a), but the supplied proof passage is written as “Putting condition (b) and [R3] together yields” an estimate for \(\rho_{n,m}\) with \(\rho_{n,m}^*\) on the right. The reference note explicitly says no bridge between \(\rho_{n,m}\) and \(\rho_{n,m}^*\) is derived or asserted in the supplied material. Therefore do not formalize “Lemma 3 directly bounds \(\rho_{n,m}\)” as a source fact without checking the original supplement. For R1 and R2, the original van der Vaart–Wellner statements were not fully retrieved; the supplied reconstructions are not authoritative transcriptions, and their exact constants/hypotheses should not be promoted to source facts. For R4, the supplied source is an arXiv version, not the journal printing, and the Xue–Yao formulas using \(c_4,\ldots,c_7\) are application consequences, not the statement of Lemma C.1. Finally, the selected theorem’s proof may contain repaired/synthesized material; its intermediate displays, such as the exact use of Lemma 3 or the derivation of \(\mu_j^F,\mu_j^G\), should be checked against the original Xue–Yao main/supplement before being made Lean hypotheses. The authoritative final claim remains Xue–Yao Theorem 1 as stated, with external results retaining their own owners: van der Vaart–Wellner Lemma 2.2.1 (R1), van der Vaart–Wellner Lemma 2.2.2 (R2), Xue–Yao Lemma 3 (R3), Chernozhukov–Chetverikov–Kato Lemma C.1 (R4), and Xue–Yao Lemma 4 (R5).
      <!-- /formalization-clarifications -->

      For any sequence of constants \(\delta_{n,m}\), assume we have the following conditions (a)–(e):

      (a) There exist universal constants \(\delta_1>\delta_2>0\) such that \(\delta_2<|\delta_{n,m}|<\delta_1\).

      (b) There exists a universal constant \(b>0\) such that
      \[
      \min_{1\leq j\leq p}E\{(S_{nj}^X-n^{1/2}\mu_j^X+\delta_{n,m}S_{mj}^Y-\delta_{n,m}m^{1/2}\mu_j^Y)^2\}\geq b.
      \]

      (c) There exists a sequence of constants \(B_{n,m}\geq1\) such that \(L_n^X\leq B_{n,m}\) and \(L_m^Y\leq B_{n,m}\).

      (d) The sequence of constants \(B_{n,m}\) defined in (c) also satisfies
      \[
      \max_{1\leq i\leq n}\max_{1\leq j\leq p}E\{\exp(|X_{ij}-\mu_j^X|/B_{n,m})\}\leq2,
      \]
      \[
      \max_{1\leq i\leq m}\max_{1\leq j\leq p}E\{\exp(|Y_{ij}-\mu_j^Y|/B_{n,m})\}\leq2.
      \]

      (e) There exists a universal constant \(c_1>0\) such that
      \[
      (B_{n,m})^2\{\log(pn)\}^7/n\leq c_1,\qquad (B_{n,m})^2\{\log(pm)\}^7/m\leq c_1.
      \]

      Then we have the following property, where \(\rho_{n,m}^{**}\) is defined by (2) above:
      \[
      \rho_{n,m}^{**}\leq K_3\big[((B_{n,m})^2\{\log(pn)\}^7/n)^{1/6}+((B_{n,m})^2\{\log(pm)\}^7/m)^{1/6}\big],
      \]
      for a universal constant \(K_3>0\).
    assumptions:
      - None.
    proof_body: |-
      ### Definitions and notation used in Proof
      For any \(\alpha>0\), define the function \(\psi_\alpha(x)=\exp(x^\alpha)-1\) for \(x\in[0,\infty)\). For any random variable \(X\), define
      \[
      (1)\qquad \|X\|_{\psi_\alpha}
      =\inf\{\lambda>0:E\{\psi_\alpha(|X|/\lambda)\}\le 1\},
      \]
      which is an Orlicz norm for \(\alpha\in[1,\infty)\) and a quasi-norm for \(\alpha\in(0,1)\).

      For any two sequences of constants \(a_n\) and \(b_n\), write \(a_n\lesssim b_n\) if \(a_n\le Cb_n\) up to a universal constant \(C>0\), and \(a_n\sim b_n\) if \(a_n\lesssim b_n\) and \(b_n\lesssim a_n\).

      The proof also uses the quantity \(\rho_{n,m}\) defined, in the source notation, by
      \[
      \begin{aligned}
      (10)\qquad \rho_{n,m}={}&\sup_{v\in[0,1]}\sup_{y\in\mathbb R^p}\Big|P\{v^{1/2}(S_n^X-n^{1/2}\mu^X+\delta_{n,m}S_m^Y-\delta_{n,m}m^{1/2}\mu^Y)\\
      &\quad +(1-v)^{1/2}(S_n^F-n^{1/2}\mu^X+\delta_{n,m}S_m^G-\delta_{n,m}m^{1/2}\mu^Y)\le y\}\\
      &\quad -P(S_n^F-n^{1/2}\mu^X+\delta_{n,m}S_m^G-\delta_{n,m}m^{1/2}\mu^Y\le y)\Big|.
      \end{aligned}
      \]

      The main-article quantity \(\rho_{n,m}^*\) referred to in the proof has, in the form supplied by the companion proof of Lemma 3,
      \[
      \begin{aligned}
      (11)\qquad \rho_{n,m}^*
      &=\sup_{v\in[0,1]}\sup_{A\in\mathcal A^{Re}}\Big|P\{v^{1/2}(S_n^X+\delta_{n,m}S_m^Y-n^{1/2}\mu^X-\delta_{n,m}m^{1/2}\mu^Y)\\
      &\quad +(1-v)^{1/2}(S_n^F+\delta_{n,m}S_m^G-n^{1/2}\mu^X-\delta_{n,m}m^{1/2}\mu^Y)\in A\}\\
      &\quad -P(S_n^F+\delta_{n,m}S_m^G-n^{1/2}\mu^X-\delta_{n,m}m^{1/2}\mu^Y\in A)\Big|,
      \end{aligned}
      \]
      with the equality to \(\tilde\rho_{n,m}\) recorded as (104) in the companion.

      The proof also uses the quantities
      \[
      M_n^X(\phi),\quad M_n^F(\phi),\quad M_n(\phi)=M_n^X(\phi)+M_n^F(\phi),\quad
      M_m^Y(\phi),\quad M_m^G(\phi),\quad M_m^*(\phi)=M_m^Y(\phi)+M_m^G(\phi);
      \]
      their defining displays, as supplied, are as follows. For \(\phi\ge1\), define
      \[
      M_n(\phi)=M_n^X(\phi)+M_n^F(\phi),
      \]
      where
      \[
      M_n^X(\phi)=n^{-1}\sum_{i=1}^n E\bigg[\max_{1\le j\le p}|X_{ij}-\mu_j^X|^3
      1\bigg\{\max_{1\le j\le p}|X_{ij}-\mu_j^X|>n^{1/2}/(4\phi\log p)\bigg\}\bigg],
      \]
      \[
      M_n^F(\phi)=n^{-1}\sum_{i=1}^n E\bigg[\max_{1\le j\le p}|F_{ij}-\mu_j^F|^3
      1\bigg\{\max_{1\le j\le p}|F_{ij}-\mu_j^F|>n^{1/2}/(4\phi\log p)\bigg\}\bigg],
      \]
      with \(\mu_j^F\) as printed in the supplied defining display. Likewise, for any \(\phi\ge1\) and any sequence of constants \(\delta_{n,m}\) depending on both \(n\) and \(m\), define
      \[
      M_m^*(\phi)=M_m^Y(\phi)+M_m^G(\phi),
      \]
      where
      \[
      M_m^Y(\phi)=m^{-1}\sum_{i=1}^m E\bigg[\max_{1\le j\le p}|Y_{ij}-\mu_j^Y|^3
      1\bigg\{\max_{1\le j\le p}|Y_{ij}-\mu_j^Y|>m^{1/2}/(4|\delta_{n,m}|\phi\log p)\bigg\}\bigg],
      \]
      \[
      M_m^G(\phi)=m^{-1}\sum_{i=1}^m E\bigg[\max_{1\le j\le p}|G_{ij}-\mu_j^G|^3
      1\bigg\{\max_{1\le j\le p}|G_{ij}-\mu_j^G|>m^{1/2}/(4|\delta_{n,m}|\phi\log p)\bigg\}\bigg],
      \]
      with \(\mu_j^G\) as printed in the supplied defining display. No separate definitions of \(\mu^F\) and \(\mu^G\) are supplied.

      ### Proof
      First, we set \(L_n^*=L_m^{**}=B_{n,m}\). Together with condition (c), it is obvious that
      \[
      (5)\qquad \bar L_n^*=B_{n,m}\ge L_n^X,\qquad \bar L_m^{**}=B_{n,m}\ge L_m^Y.
      \]
      By combining the definition of the Orlicz norm in (1) with condition (d), we have
      \[
      (6)\qquad \max_{1\le i\le n}\max_{1\le j\le p}\|X_{ij}-\mu_j^X\|_{\psi_1}\le B_{n,m},\qquad
      \max_{1\le i\le m}\max_{1\le j\le p}\|Y_{ij}-\mu_j^Y\|_{\psi_1}\le B_{n,m}.
      \]
      Moreover, since \(F_{ij}\sim N(\mu_j^X,E(X_{ij}-\mu_j^X)^2)\) for all \(i=1,\ldots,n\) and \(j=1,\ldots,p\), it can be deduced that for any \(t\ge0\),
      \[
      (7)\qquad P(|F_{ij}-\mu_j^X|>t)\le 2\exp[-t^2/\{2E(X_{ij}-\mu_j^X)^2\}],
      \]
      for all \(i=1,\ldots,n\) and \(j=1,\ldots,p\). Therefore, by combining (7) with [ref:R1], we have
      \[
      (8)\qquad \|F_{ij}-\mu_j^X\|_{\psi_2}\le[(1+2)\{2E(X_{ij}-\mu_j^X)^2\}]^{1/2},
      \]
      for all \(i=1,\ldots,n\) and \(j=1,\ldots,p\). Furthermore, by property of the Orlicz norm, it can be shown that for all \(i=1,\ldots,n\) and \(j=1,\ldots,p\),
      \[
      (9)\qquad \|F_{ij}-\mu_j^X\|_{\psi_1}\le(\log2)^{2^{-1}-1}\|F_{ij}-\mu_j^X\|_{\psi_2}
      =(\log2)^{-2^{-1}}\|F_{ij}-\mu_j^X\|_{\psi_2}.
      \]
      In addition, for all \(i=1,\ldots,n\) and \(j=1,\ldots,p\), it can be justified that
      \[
      (10)\qquad E(X_{ij}-\mu_j^X)^2\le2\|X_{ij}-\mu_j^X\|_{\psi_1}^2.
      \]
      Henceforth, by combining (6), (8), (9) with (10), we have
      \[
      (11)\qquad \max_{1\le i\le n}\max_{1\le j\le p}\|F_{ij}-\mu_j^X\|_{\psi_1}\le c_2B_{n,m},
      \]
      for a universal constant \(c_2>0\). Similar reasoning leads to
      \[
      (12)\qquad \max_{1\le i\le m}\max_{1\le j\le p}\|G_{ij}-\mu_j^Y\|_{\psi_1}\le c_3B_{n,m},
      \]
      for a universal constant \(c_3>0\). As a result, by combining (6), (11), (12) with [ref:R2], we conclude that
      \[
      \|\max_{1\le j\le p}|X_{ij}-\mu_j^X|\|_{\psi_1}\le c_4B_{n,m}\log p,\qquad i=1,\ldots,n,
      \]
