      ##### Definitions and notation
      Let \(X^n=\{X_1,\ldots,X_n\}\) be mutually independent (not necessarily identically distributed) random vectors in \(\mathbb{R}^p\), with
      \[
      X_i=(X_{i1},\ldots,X_{ip})',\qquad E(X_i)=\mu^X=(\mu_1^X,\ldots,\mu_p^X)',\quad i=1,\ldots,n.
      \]
      Similarly, let \(Y^m=\{Y_1,\ldots,Y_m\}\) be mutually independent random vectors in \(\mathbb{R}^p\) with \(E(Y_i)=\mu^Y=(\mu_1^Y,\ldots,\mu_p^Y)'\), \(i=1,\ldots,m\).

      Let \(F^n=\{F_1,\ldots,F_n\}\) be mutually independent random vectors in \(\mathbb{R}^p\) such that
      \[
      F_i=(F_{i1},\ldots,F_{ip})'\sim N_p\!\left(\mu^X,E\{(X_i-\mu^X)(X_i-\mu^X)'\}\right),\quad i=1,\ldots,n,
      \]
      and let \(G^m=\{G_1,\ldots,G_m\}\) be mutually independent random vectors in \(\mathbb{R}^p\) such that
      \[
      G_i=(G_{i1},\ldots,G_{ip})'\sim N_p\!\left(\mu^Y,E\{(Y_i-\mu^Y)(Y_i-\mu^Y)'\}\right),\quad i=1,\ldots,m.
      \]
      Thus, for \(j=1,\ldots,p\), set \(\mu_j^F=\mu_j^X\) and \(\mu_j^G=\mu_j^Y\).
      The sets \(X^n\), \(Y^m\), \(F^n\), and \(G^m\) are assumed to be independent of each other.

      Define the normalized sums
      \[
      S_n^X=n^{-1/2}\sum_{i=1}^n X_i=(S_{n1}^X,\ldots,S_{np}^X)',\qquad
      S_n^F=n^{-1/2}\sum_{i=1}^n F_i=(S_{n1}^F,\ldots,S_{np}^F)',
      \]
      \[
      S_m^Y=m^{-1/2}\sum_{i=1}^m Y_i=(S_{m1}^Y,\ldots,S_{mp}^Y)',\qquad
      S_m^G=m^{-1/2}\sum_{i=1}^m G_i=(S_{m1}^G,\ldots,S_{mp}^G)',
      \]
      where \(S_n^F\) and \(S_m^G\) serve as Gaussian approximations for \(S_n^X\) and \(S_m^Y\), respectively. Here \(\delta_{n,m}\) denotes a sequence of constants depending on both \(n\) and \(m\).

      Denote
      \[
      L_n^X=\max_{1\le j\le p}\sum_{i=1}^n E(|X_{ij}-\mu_j^X|^3)/n,
      \qquad
      L_m^Y=\max_{1\le j\le p}\sum_{i=1}^m E(|Y_{ij}-\mu_j^Y|^3)/m.
      \]

      The key quantity \(\rho_{n,m}^{**}\) is defined by
      \[
      \begin{aligned}
      (2)\qquad \rho_{n,m}^{**}={}&\sup_{A\in\mathcal{A}^{Re}}\big|P(S_n^X-n^{1/2}\mu^X+\delta_{n,m}S_m^Y-\delta_{n,m}m^{1/2}\mu^Y\in A)\\
      &-P(S_n^F-n^{1/2}\mu^X+\delta_{n,m}S_m^G-\delta_{n,m}m^{1/2}\mu^Y\in A)\big|,
      \end{aligned}
      \]
      where \(P(S_n^X-n^{1/2}\mu^X+\delta_{n,m}S_m^Y-\delta_{n,m}m^{1/2}\mu^Y\in A)\) represents the unknown probability of interest, and \(P(S_n^F-n^{1/2}\mu^X+\delta_{n,m}S_m^G-\delta_{n,m}m^{1/2}\mu^Y\in A)\) serves as a Gaussian approximation to this probability of interest; \(\rho_{n,m}^{**}\) measures the error of approximation over all hyperrectangles \(A\in\mathcal{A}^{Re}\). Here \(\mathcal{A}^{Re}\) is the class of all hyperrectangles in \(\mathbb{R}^p\) of the form
      \[
      \{w\in\mathbb{R}^p:a_j\le w_j\le b_j\text{ for all }j=1,\ldots,p\}
      \]
      with \(-\infty\le a_j\le b_j\le\infty\) for all \(j=1,\ldots,p\).

      For any \(\phi\ge1\), define
      \[
      M_n(\phi)=M_n^X(\phi)+M_n^F(\phi),
      \]
      where
      \[
      M_n^X(\phi)=n^{-1}\sum_{i=1}^n E\bigg[\max_{1\le j\le p}|X_{ij}-\mu_j^X|^3
      1\bigg\{\max_{1\le j\le p}|X_{ij}-\mu_j^X|>n^{1/2}/(4\phi\log p)\bigg\}\bigg],
      \]
      \[
      M_n^F(\phi)=n^{-1}\sum_{i=1}^n E\bigg[\max_{1\le j\le p}|F_{ij}-\mu_j^F|^3
      1\bigg\{\max_{1\le j\le p}|F_{ij}-\mu_j^F|>n^{1/2}/(4\phi\log p)\bigg\}\bigg].
      \]
      Likewise, for any \(\phi\ge1\) and any sequence of constants \(\delta_{n,m}\) depending on both \(n\) and \(m\), define
      \[
      M_m^*(\phi)=M_m^Y(\phi)+M_m^G(\phi),
      \]
      where
      \[
      M_m^Y(\phi)=m^{-1}\sum_{i=1}^m E\bigg[\max_{1\le j\le p}|Y_{ij}-\mu_j^Y|^3
      1\bigg\{\max_{1\le j\le p}|Y_{ij}-\mu_j^Y|>m^{1/2}/(4|\delta_{n,m}|\phi\log p)\bigg\}\bigg],
      \]
      \[
      M_m^G(\phi)=m^{-1}\sum_{i=1}^m E\bigg[\max_{1\le j\le p}|G_{ij}-\mu_j^G|^3
      1\bigg\{\max_{1\le j\le p}|G_{ij}-\mu_j^G|>m^{1/2}/(4|\delta_{n,m}|\phi\log p)\bigg\}\bigg].
      \]

      ##### Assumptions
      For any sequence of constants \(\delta_{n,m}\), assume the following conditions:

      (a) There exists a universal constant \(b>0\) such that
      \[
      \min_{1\le j\le p}E\{(S_{nj}^X-n^{1/2}\mu_j^X+\delta_{n,m}S_{mj}^Y-\delta_{n,m}m^{1/2}\mu_j^Y)^2\}\ge b.
      \]

      (b) There exist two sequences of constants \(\bar L_n^*\) and \(\bar L_m^{**}\) such that
      \[
      \bar L_n^*\ge L_n^X,\qquad \bar L_m^{**}\ge L_m^Y.
      \]
      Moreover,
      \[
      \phi_n^*=K_1\{(\bar L_n^*)^2(\log p)^4/n\}^{-1/6}\ge2,
      \]
      \[
      \phi_m^{**}=K_1\{(\bar L_m^{**})^2(\log p)^4|\delta_{n,m}|^6/m\}^{-1/6}\ge2,
      \]
      for a universal constant \(K_1\in(0,(K^*\vee2)^{-1}]\), where the positive constant \(K^*\) is as defined in Lemma 3 in the Appendix.

      ##### Statement
      **LEMMA 4.** Under Assumptions (a)–(b), we have the following property, where \(\rho_{n,m}^{**}\) is the quantity defined by (2) above:
      \[
      \begin{aligned}
      \rho_{n,m}^{**}\le {}&K_2\big[((\bar L_n^*)^2(\log p)^7/n)^{1/6}+\{M_n(\phi_n^*)/\bar L_n^*\}\\
      &+\{(\bar L_m^{**})^2(\log p)^7|\delta_{n,m}|^6/m\}^{1/6}+\{M_m^*(\phi_m^{**})/\bar L_m^{**}\}\big],
      \end{aligned}
      \]
      for a universal constant \(K_2>0\) that depends only on \(b\).
