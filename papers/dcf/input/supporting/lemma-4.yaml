      ##### Content basis

      Source extraction. The named result is **Lemma 3** in Xue and Yao’s main article (D2, Appendix). D2 describes it as a two-sample version of Corollary 5.1 of Chernozhukov, Chetverikov and Kato (2017). The citation additionally uses the displayed inequality **(107)** in the supplement (D1, Proof of Lemma 4). In D1, (107) is introduced by: “Second, condition (a) together with Lemma 3 implies that for every \(\phi_1,\phi_2\ge1\) … for the universal constant \(K^*>0\) defined in Lemma 3.” The two source displays are kept separate because they are not textually identical: the main Lemma 3 uses \(M_n(\phi_1)\), \(M_m^*(\phi_2)\) and \((\min\{\phi_1,\phi_2\})^{-1}\), while (107) uses \(M_n(2\phi_1)\), \(M_m^*(2\phi_2)\), the factors \(8\), and separate terms \((2\phi_1)^{-1}\), \((2\phi_2)^{-1}\). No bridge between these displayed forms is asserted or derived here. The definitions of \(\rho_{n,m}^*\), \(L_n^X,L_m^Y\), \(M_n,M_m^*\), the Gaussian arrays and the normalized sums are quoted from D2. D2 prints \(\mu_j^F,\mu_j^G\) in the definitions of \(M_n^F,M_m^G\); the intended identifications are \(\mu_j^F=\mu_j^X\), \(\mu_j^G=\mu_j^Y\). The main Lemma 3 states that \(K^*\) depends only on \(b\); a later phrase in D2’s Lemma 4 says “\(K^*\) that depends on \(n\),” which is a separate source inconsistency and is not part of Lemma 3 as stated.

      ##### Lemma 3

      ###### Definitions and notation
      Let \(n,m,p\) be positive integers. Let
      \[
      X^n=\{X_1,\ldots,X_n\}
      \]
      be mutually independent random vectors in \(\mathbb R^p\), with
      \[
      X_i=(X_{i1},\ldots,X_{ip})',\qquad E(X_i)=\mu^X=(\mu_1^X,\ldots,\mu_p^X)',\quad i=1,\ldots,n,
      \]
      and let
      \[
      Y^m=\{Y_1,\ldots,Y_m\}
      \]
      be mutually independent random vectors in \(\mathbb R^p\), with
      \[
      Y_i=(Y_{i1},\ldots,Y_{ip})',\qquad E(Y_i)=\mu^Y=(\mu_1^Y,\ldots,\mu_p^Y)',\quad i=1,\ldots,m.
      \]

      Let
      \[
      F^n=\{F_1,\ldots,F_n\}
      \]
      be mutually independent Gaussian random vectors such that
      \[
      F_i=(F_{i1},\ldots,F_{ip})'\sim N_p\bigl(\mu^X,E\{(X_i-\mu^X)(X_i-\mu^X)'\}\bigr),
      \quad i=1,\ldots,n,
      \]
      and let
      \[
      G^m=\{G_1,\ldots,G_m\}
      \]
      be mutually independent Gaussian random vectors such that
      \[
      G_i=(G_{i1},\ldots,G_{ip})'\sim N_p\bigl(\mu^Y,E\{(Y_i-\mu^Y)(Y_i-\mu^Y)'\}\bigr),
      \quad i=1,\ldots,m.
      \]
      The sets \(X^n,Y^m,F^n,G^m\) are independent of each other.

      The normalized sums are
      \[
      S_n^X=n^{-1/2}\sum_{i=1}^n X_i=(S_{n1}^X,\ldots,S_{np}^X)',\qquad
      S_n^F=n^{-1/2}\sum_{i=1}^n F_i=(S_{n1}^F,\ldots,S_{np}^F)',
      \]
      \[
      S_m^Y=m^{-1/2}\sum_{i=1}^m Y_i=(S_{m1}^Y,\ldots,S_{mp}^Y)',\qquad
      S_m^G=m^{-1/2}\sum_{i=1}^m G_i=(S_{m1}^G,\ldots,S_{mp}^G)'.
      \]
      Let \(\delta_{n,m}\) be a sequence of constants depending on both \(n\) and \(m\).

      Define
      \[
      L_n^X=\max_{1\le j\le p}\sum_{i=1}^n E(|X_{ij}-\mu_j^X|^3)/n,
      \qquad
      L_m^Y=\max_{1\le j\le p}\sum_{i=1}^m E(|Y_{ij}-\mu_j^Y|^3)/m.
      \]

      Let \(\mathcal A^{\mathrm{Re}}\) be the class of all hyperrectangles in \(\mathbb R^p\) of the form
      \[
      \{w\in\mathbb R^p:a_j\le w_j\le b_j\text{ for all }j=1,\ldots,p\},
      \qquad -\infty\le a_j\le b_j\le\infty \text{ for all }j=1,\ldots,p.
      \]

      Define \(\rho_{n,m}^*\) by
      \[
      \begin{aligned}
      \rho_{n,m}^*={}&\sup_{v\in[0,1]}\sup_{A\in\mathcal A^{\mathrm{Re}}}\bigl|P\{v^{1/2}(S_n^X-n^{1/2}\mu^X+\delta_{n,m}S_m^Y-\delta_{n,m}m^{1/2}\mu^Y)\\
      &+(1-v)^{1/2}(S_n^F-n^{1/2}\mu^X+\delta_{n,m}S_m^G-\delta_{n,m}m^{1/2}\mu^Y)\in A\}\\
      &-P(S_n^F-n^{1/2}\mu^X+\delta_{n,m}S_m^G-\delta_{n,m}m^{1/2}\mu^Y\in A)\bigr|.
      \end{aligned}
      \tag{11}
      \]

      For \(\phi\ge1\), define
      \[
      M_n(\phi)=M_n^X(\phi)+M_n^F(\phi),
      \]
      where
      \[
      M_n^X(\phi)=n^{-1}\sum_{i=1}^n E\Bigl[\max_{1\le j\le p}|X_{ij}-\mu_j^X|^3
      1\Bigl\{\max_{1\le j\le p}|X_{ij}-\mu_j^X|>n^{1/2}/(4\phi\log p)\Bigr\}\Bigr],
      \]
      \[
      M_n^F(\phi)=n^{-1}\sum_{i=1}^n E\Bigl[\max_{1\le j\le p}|F_{ij}-\mu_j^X|^3
      1\Bigl\{\max_{1\le j\le p}|F_{ij}-\mu_j^X|>n^{1/2}/(4\phi\log p)\Bigr\}\Bigr].
      \]
      For \(\phi\ge1\) and the sequence \(\delta_{n,m}\), define
      \[
      M_m^*(\phi)=M_m^Y(\phi)+M_m^G(\phi),
      \]
      where
      \[
      M_m^Y(\phi)=m^{-1}\sum_{i=1}^m E\Bigl[\max_{1\le j\le p}|Y_{ij}-\mu_j^Y|^3
      1\Bigl\{\max_{1\le j\le p}|Y_{ij}-\mu_j^Y|>m^{1/2}/(4|\delta_{n,m}|\phi\log p)\Bigr\}\Bigr],
      \]
      \[
      M_m^G(\phi)=m^{-1}\sum_{i=1}^m E\Bigl[\max_{1\le j\le p}|G_{ij}-\mu_j^Y|^3
      1\Bigl\{\max_{1\le j\le p}|G_{ij}-\mu_j^Y|>m^{1/2}/(4|\delta_{n,m}|\phi\log p)\Bigr\}\Bigr].
      \]

      ###### Assumptions
      For the sequence \(\delta_{n,m}\), assume:

      (a) There exists a universal constant \(b>0\) such that
      \[
      \min_{1\le j\le p}E\{(S_{nj}^X-n^{1/2}\mu_j^X+\delta_{n,m}S_{mj}^Y-\delta_{n,m}m^{1/2}\mu_j^Y)^2\}\ge b.
      \]

      ###### Statement
      For any \(\phi_1,\phi_2\ge1\) and any sequence of constants \(\delta_{n,m}\), under assumption (a), there exists a universal constant \(K^*>0\) that depends only on \(b\) such that
      \[
      \begin{aligned}
      \rho_{n,m}^*\le {}&K^*\Bigl[n^{-1/2}\phi_1^2(\log p)^2\{\phi_1L_n^X\rho_{n,m}^*+L_n^X(\log p)^{1/2}+\phi_1M_n(\phi_1)\}\\
      &+m^{-1/2}\phi_2^2(\log p)^2|\delta_{n,m}|^3\{\phi_2L_m^Y\rho_{n,m}^*+L_m^Y(\log p)^{1/2}+\phi_2M_m^*(\phi_2)\}\\
      &+(\min\{\phi_1,\phi_2\})^{-1}(\log p)^{1/2}\Bigr],
      \end{aligned}
      \]
      where \(\rho_{n,m}^*\) is the quantity defined in (11) above.

      ##### Equation (107) in the proof of Lemma 4

      ###### Definitions and notation
      The same setup and definitions as in the Lemma 3 group above apply. In particular, \(X^n,Y^m,F^n,G^m\), \(S_n^X,S_n^F,S_m^Y,S_m^G\), \(\mu^X,\mu^Y\), \(\delta_{n,m}\), \(L_n^X,L_m^Y\), \(\mathcal A^{\mathrm{Re}}\), \(\rho_{n,m}^*\), \(M_n(\phi)\), and \(M_m^*(\phi)\) are exactly as defined there; \(\rho_{n,m}^*\) is given by (11), and \(M_n,M_m^*\) are the thresholded third-moment quantities defined above.

      ###### Assumptions
      Assume condition (a) of Lemma 3:
      \[
      \min_{1\le j\le p}E\{(S_{nj}^X-n^{1/2}\mu_j^X+\delta_{n,m}S_{mj}^Y-\delta_{n,m}m^{1/2}\mu_j^Y)^2\}\ge b,
      \]
      for a universal constant \(b>0\). The displayed inequality is asserted for every \(\phi_1,\phi_2\ge1\), with the universal constant \(K^*>0\) defined in Lemma 3.

      ###### Statement
      Under the above condition (a), for every \(\phi_1,\phi_2\ge1\),
      \[
      \begin{aligned}
      \rho_{n,m}^*\le {}&K^*\Bigl[8n^{-1/2}\phi_1^2(\log p)^2\{\phi_1L_n^X\rho_{n,m}^*+2^{-1}L_n^X(\log p)^{1/2}+\phi_1M_n(2\phi_1)\}\\
      &+8m^{-1/2}\phi_2^2(\log p)^2|\delta_{n,m}|^3\{\phi_2L_m^Y\rho_{n,m}^*+2^{-1}L_m^Y(\log p)^{1/2}+\phi_2M_m^*(2\phi_2)\}\\
      &+(2\phi_1)^{-1}(\log p)^{1/2}+(2\phi_2)^{-1}(\log p)^{1/2}\Bigr],
      \end{aligned}
      \tag{107}
      \]
      where \(K^*>0\) is the universal constant defined in Lemma 3.
