      ##### Statement
      Let \(\varphi_i:\mathbb R\to[0,\infty)\), \(i=1,2\), be non-decreasing functions, and let \(\xi_i\), \(i=1,2\), be independent real-valued random variables. Assume that all expectations below exist and are finite. Then
