      ##### Definitions and notation
      For \(z=(z_1,\dots,z_p)^T\in\mathbb R^p\), define the smooth max function
      \[
      F_\beta(z):=\beta^{-1}\log\left(\sum_{j=1}^p \exp(\beta z_j)\right),
      \]
      where \(\beta>0\) is the smoothing parameter. Here \(\max_{1\le j\le p} z_j\) denotes the coordinatewise maximum. The source uses the variable \(z\) in this definition and in the bound.

      ##### Assumptions
      Let \(p\) be the dimension of the ambient space \(\mathbb R^p\), with coordinates indexed by \(j=1,\dots,p\). Let \(\beta>0\). The source passage states no further restriction on \(p\) or \(\beta\).

      ##### Statement
      For every \(z\in\mathbb R^p\),
      \[
      0\le F_\beta(z)-\max_{1\le j\le p} z_j\le \beta^{-1}\log p. \tag{1}
      \]
      Equivalently,
      \[
      \max_{1\le j\le p} z_j\le F_\beta(z)\le \max_{1\le j\le p} z_j+\beta^{-1}\log p.
      \]
