      ##### Lemma A.1 (Nazarov’s inequality, [30])
      ###### Definitions and notation
      For \(p\ge 1\), \(\mathbb R^p\) is the \(p\)-dimensional Euclidean space. The source paper has the global notation convention \(n\ge4\), although \(n\) does not occur in Lemma A.1; the displayed lemma itself repeats only the variance lower bound stated below.

      For \(w=(w_1,\dots,w_p)'\in\mathbb R^p\) and \(y=(y_1,\dots,y_p)'\in\mathbb R^p\), the relation \(w\le y\) means \(w_j\le y_j\) for every \(j=1,\dots,p\). For \(y=(y_1,\dots,y_p)'\in\mathbb R^p\) and \(a\in\mathbb R\), \(y+a=(y_1+a,\dots,y_p+a)'\).

      \(P\) and \(E\) denote probability and expectation under the law of \(Y\). A centered Gaussian random vector means a multivariate Gaussian random vector with mean zero; no independence among coordinates is assumed. \(E[Y_j^2]\) is the variance of the \(j\)-th coordinate. The constant \(C\) in the lemma depends only on \(b\), not on \(p,y,a\) or the covariance matrix.

      ###### Assumptions
      - \(Y=(Y_1,\dots,Y_p)'\) is a centered Gaussian random vector in \(\mathbb R^p\).
      - There is a constant \(b>0\) such that
        \[
        E[Y_j^2]\ge b
        \qquad\text{for all }j=1,\dots,p.
        \]
        No nonsingularity of the covariance matrix and no independence of the coordinates is required.
      - \(y\in\mathbb R^p\) and \(a>0\) are arbitrary.
      - In the source paper’s global notation, \(p\ge3\); this paper-wide convention is not repeated in the displayed statement of Lemma A.1.

      ###### Statement
      **Lemma A.1** (Nazarov’s inequality, [30]). Let \(Y=(Y_1,\dots,Y_p)'\) be a centered Gaussian random vector in \(\mathbb R^p\) such that \(E[Y_j^2]\ge b\) for all \(j=1,\dots,p\) and some constant \(b>0\). Then for every \(y\in\mathbb R^p\) and \(a>0\),
      \[
      P(Y\le y+a)-P(Y\le y)\le C a\sqrt{\log p},
      \]
      where \(C\) is a constant depending only on \(b\).

