      Source extraction. The statement below is transcribed from the supplied arXiv manuscript `arXiv:1212.6906v6 [math.ST] 23 Jan 2018`, physical/printed page 25, Appendix A, §A.2, Lemma A.5 (“Bounds on derivatives of \(m=g\circ F_\beta\)”), attributed to Chernozhukov, Chetverikov and Kato (2013). It supplies the derivative majorants \(U_{jk},U_{jkl}\) and their summability bounds used by the current Lemma 1. The companion two-sided stability comparison is Lemma A.6 (a separate reference item) and is not part of the A.5 statement. The source states A.5 with smoothing parameter \(\beta>0\) and general \(g\in C_b^3(\mathbb R)\); the specialization \(\beta=\phi\log p\), the cutoff \(\Phi_0\), and the composed function \(\kappa\) belong to the consuming paper, not to source Lemma A.5. No proof is included here.

      ##### Lemma A.5 (Bounds on derivatives of \(m=g\circ F_\beta\))

      ###### Definitions and notation
      - \(C^k(\mathbb R)\) denotes the class of \(k\) times continuously differentiable functions from \(\mathbb R\) to itself, and \(C_b^k(\mathbb R)\) denotes the class of all \(f\in C^k(\mathbb R)\) such that
        \[
        \sup_{z\in\mathbb R}|\partial^j f(z)|<\infty,\qquad j=0,\dots,k.
        \]

      - The smooth max function is, for \(\beta>0\) and \(z=(z_1,\dots,z_p)'\in\mathbb R^p\),
        \[
        F_\beta(z):=\beta^{-1}\log\left(\sum_{j=1}^p \exp(\beta z_j)\right).
        \]

      - For \(1\le j,k,l\le p\), set
        \[
        \delta_{jk}:=1\{j=k\},
        \]
        and define
        \[
        \pi_j(z):=\frac{e^{\beta z_j}}{\sum_{m=1}^p e^{\beta z_m}}.
        \]

      - For a smooth function \(g:\mathbb R\to\mathbb R\), write
        \[
        G_k:=\sup_{z\in\mathbb R}|\partial^k g(z)|,\qquad k\ge0.
        \]

      - The function under consideration is
        \[
        m:=g\circ F_\beta.
        \]
        The derivatives in Lemma A.5 are those of this \(m\), evaluated at \(z\in\mathbb R^p\).

      ###### Assumptions
      - \(p\ge3\) under the source’s standing convention “unless otherwise stated.”
      - \(\beta>0\).
      - \(g\in C_b^3(\mathbb R)\), i.e. \(g:\mathbb R\to\mathbb R\) is three times continuously differentiable with
        \[
        \sup_{z\in\mathbb R}|\partial^j g(z)|<\infty,\qquad j=0,1,2,3.
        \]
      - \(m=g\circ F_\beta\), with \(F_\beta\) as defined above.

      ###### Statement
      For every \(1\le j,k,l\le p\),
      \[
      |\partial_j\partial_k m(z)|\le U_{jk}(z),\qquad
      |\partial_j\partial_k\partial_l m(z)|\le U_{jkl}(z),
      \]
      where
      \[
      U_{jk}(z):=\bigl(G_2\pi_j\pi_k+G_1\beta W_{jk}(z)\bigr),
      \qquad
      W_{jk}(z):=(\pi_j\delta_{jk}+\pi_j\pi_k)(z),
      \]
      \[
      U_{jkl}(z):=\bigl(G_3\pi_j\pi_k\pi_l
      +G_2\beta(W_{jk}\pi_l+W_{jl}\pi_k+W_{kl}\pi_j)
      +G_1\beta^2 Q_{jkl}\bigr)(z),
      \]
      \[
      Q_{jkl}(z):=\bigl(\pi_j\delta_{jl}\delta_{jk}
      +\pi_j\pi_l\delta_{jk}
      +\pi_j\pi_k(\delta_{jl}+\delta_{kl})
      +2\pi_j\pi_k\pi_l\bigr)(z).
      \]
      Moreover,
      \[
      \sum_{j,k=1}^p U_{jk}(z)\le G_2+2G_1\beta,
      \qquad
      \sum_{j,k,l=1}^p U_{jkl}(z)\le G_3+6G_2\beta+6G_1\beta^2.
      \]

