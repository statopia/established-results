      ##### Lemma A.6 (Stability Properties of Bounds over Large Regions)

      ###### Definitions and notation
      Let \(p\) be the ambient dimension, and write \(z=(z_1,\dots,z_p)'\in\mathbb R^p\). For \(\beta>0\), the smooth max function is
      \[
      F_\beta(z):=\beta^{-1}\log\left(\sum_{j=1}^p\exp(\beta z_j)\right).
      \]
      For a smooth function \(g:\mathbb R\to\mathbb R\), define
      \[
      G_k:=\sup_{z\in\mathbb R}|\partial^k g(z)|,\qquad k\ge 0.
      \]
      For \(j=1,\dots,p\), define
      \[
      \pi_j(z):=\frac{e^{\beta z_j}}{\sum_{m=1}^p e^{\beta z_m}},
      \]
      and let
      \[
      \delta_{jk}:=1\{j=k\}.
      \]
      As in Lemma A.5, for \(m=g\circ F_\beta\), the derivative majorants \(U_{jk}\) and \(U_{jkl}\) are defined, for every \(1\le j,k,l\le p\), by
      \[
      |\partial_j\partial_k m(z)|\le U_{jk}(z),\qquad |\partial_j\partial_k\partial_l m(z)|\le U_{jkl}(z),
      \]
      where
      \[
      U_{jk}(z):=(G_2\pi_j\pi_k+G_1\beta W_{jk})(z),
      \]
      \[
      W_{jk}(z):=(\pi_j\delta_{jk}+\pi_j\pi_k)(z),
      \]
      and
      \[
      U_{jkl}(z):=\bigl(G_3\pi_j\pi_k\pi_l
      +G_2\beta(W_{jk}\pi_l+W_{jl}\pi_k+W_{kl}\pi_j)
      +G_1\beta^2 Q_{jkl}\bigr)(z),
      \]
      \[
      Q_{jkl}(z):=\bigl(\pi_j\delta_{jl}\delta_{jk}
      +\pi_j\pi_l\delta_{jk}
      +\pi_j\pi_k(\delta_{jl}+\delta_{kl})
      +2\pi_j\pi_k\pi_l\bigr)(z).
      \]
      Here the final \((z)\) denotes evaluation of the displayed product at \(z\). The symbol \(\lesssim\) means inequality up to a universal positive constant: \(a\lesssim b\) if \(a\le Cb\) for a universal positive constant \(C\).

      ###### Assumptions
      Assume \(g\in C_b^3(\mathbb R)\), as in Lemmas A.4–A.6; equivalently, \(g\) is three times continuously differentiable and
      \[
      \sup_{z\in\mathbb R}|\partial^k g(z)|<\infty
      \]
      for \(k=0,1,2,3\). The smoothing parameter \(\beta\) is positive. No random-vector, independence, or moment assumptions from the current theorem are part of this deterministic lemma.

      ###### Statement
      For every \(z\in\mathbb R^p\), \(w\in\mathbb R^p\) with \(\max_{j\le p}|w_j|\beta\le 1\), \(\tau\in[0,1]\), and every \(1\le j,k,l\le p\), we have
      \[
      U_{jk}(z)\lesssim U_{jk}(z+\tau w)\lesssim U_{jk}(z),
      \qquad
      U_{jkl}(z)\lesssim U_{jkl}(z+\tau w)\lesssim U_{jkl}(z).
      \]
