      Source extraction from the Xue–Yao main paper (D2), Appendix, **LEMMA 2**, where it is described as a two-sample extension of Lemma 5.1 in [9]. The statement, its condition (a), and the definitions of \(\rho_{n,m}\) in (10), \(L_n^X,L_m^Y\), \(M_n,M_m^*\), together with the two-sample Gaussian setup, are taken from D2. This result is the source named in R1 and supports the intermediate invocation of Lemma 2 in the proof of the current Lemma 3, namely the displayed bound for \(\tilde\rho_{n,m}\) after Lemma 2 is applied to the doubled arrays. The source statement of Lemma 2 concerns \(\rho_{n,m}\), not \(\rho_{n,m}^*\); the passage from the doubled \(\tilde\rho_{n,m}\) bound to the final \(\rho_{n,m}^*\) bound and the cited equations (102)–(105) are not part of the supplied Lemma 2 statement and are not reorganized here. The current target Lemma 3 is not restated as an additional external premise.

      ##### Lemma 2
      ###### Definitions and notation
      Let \(X^n=\{X_1,\ldots,X_n\}\) be a collection of mutually independent (not necessarily identically distributed) random vectors in \(\mathbb R^p\) with \(X_i=(X_{i1},\ldots,X_{ip})'\) and \(E(X_i)=\mu^X=(\mu_1^X,\ldots,\mu_p^X)'\), \(i=1,\ldots,n\). Let \(Y^m=\{Y_1,\ldots,Y_m\}\) be defined similarly with \(E(Y_i)=\mu^Y=(\mu_1^Y,\ldots,\mu_p^Y)'\) for \(i=1,\ldots,m\).

      Denote the normalized sums
      \[
      S_n^X=n^{-1/2}\sum_{i=1}^n X_i=(S_{n1}^X,\ldots,S_{np}^X)',
      \qquad
      S_m^Y=m^{-1/2}\sum_{i=1}^m Y_i=(S_{m1}^Y,\ldots,S_{mp}^Y)'.
      \]
      Let \(F^n=\{F_1,\ldots,F_n\}\) be mutually independent random vectors in \(\mathbb R^p\) such that \(F_i=(F_{i1},\ldots,F_{ip})'\) and
      \[
      F_i\sim N_p\bigl(\mu^X,E\{(X_i-\mu^X)(X_i-\mu^X)'\}\bigr)
      \]
      for all \(i=1,\ldots,n\). Likewise, let \(G^m=\{G_1,\ldots,G_m\}\) be mutually independent random vectors in \(\mathbb R^p\) such that \(G_i=(G_{i1},\ldots,G_{ip})'\) and
      \[
      G_i\sim N_p\bigl(\mu^Y,E\{(Y_i-\mu^Y)(Y_i-\mu^Y)'\}\bigr)
      \]
      for all \(i=1,\ldots,m\). The sets \(X^n\), \(Y^m\), \(F^n\) and \(G^m\) are assumed to be independent of each other. Denote
      \[
      S_n^F=n^{-1/2}\sum_{i=1}^n F_i,
      \qquad
      S_m^G=m^{-1/2}\sum_{i=1}^m G_i.
      \]

      For vectors \(x=(x_1,\ldots,x_p)\in\mathbb R^p\) and \(y=(y_1,\ldots,y_p)'\in\mathbb R^p\), write \(x\le y\) if \(x_j\le y_j\) for all \(j=1,\ldots,p\).

      For sequences of constants \(a_n\) and \(b_n\), write \(a_n\lesssim b_n\) if \(a_n\le Cb_n\) up to a universal constant \(C>0\).

      For any sequence of constants \(\delta_{n,m}\) that depends on both \(n\) and \(m\), define the quantity \(\rho_{n,m}\) by the source display (10):
      \[
      \begin{aligned}
      \rho_{n,m}={}&\sup_{v\in[0,1]}\sup_{y\in\mathbb R^p}\Bigl|
      P\{v^{1/2}(S_n^X-n^{1/2}\mu^X+\delta_{n,m}S_m^Y-\delta_{n,m}m^{1/2}\mu^Y)\\
      &\qquad +(1-v)^{1/2}(S_n^F-n^{1/2}\mu^X+\delta_{n,m}S_m^G-\delta_{n,m}m^{1/2}\mu^Y)\le y\}\\
      &\qquad -P(S_n^F-n^{1/2}\mu^X+\delta_{n,m}S_m^G-\delta_{n,m}m^{1/2}\mu^Y\le y)\Bigr|.
      \end{aligned}
      \]

      Define
      \[
      L_n^X=\max_{1\le j\le p}\sum_{i=1}^n E(|X_{ij}-\mu_j^X|^3)/n,
      \qquad
      L_m^Y=\max_{1\le j\le p}\sum_{i=1}^m E(|Y_{ij}-\mu_j^Y|^3)/m.
      \]

      For any \(\phi\ge1\), denote
      \[
      M_n(\phi)=M_n^X(\phi)+M_n^F(\phi),
      \]
      where
      \[
      M_n^X(\phi)=n^{-1}\sum_{i=1}^n E\Bigl[\max_{1\le j\le p}|X_{ij}-\mu_j^X|^3
      1\Bigl\{\max_{1\le j\le p}|X_{ij}-\mu_j^X|>n^{1/2}/(4\phi\log p)\Bigr\}\Bigr],
      \]
      \[
      M_n^F(\phi)=n^{-1}\sum_{i=1}^n E\Bigl[\max_{1\le j\le p}|F_{ij}-\mu_j^X|^3
      1\Bigl\{\max_{1\le j\le p}|F_{ij}-\mu_j^X|>n^{1/2}/(4\phi\log p)\Bigr\}\Bigr].
      \]

      Likewise, for any \(\phi\ge1\) and any sequence of constants \(\delta_{n,m}\) that depends on both \(n\) and \(m\), denote
      \[
      M_m^*(\phi)=M_m^Y(\phi)+M_m^G(\phi),
      \]
      where
      \[
      M_m^Y(\phi)=m^{-1}\sum_{i=1}^m E\Bigl[\max_{1\le j\le p}|Y_{ij}-\mu_j^Y|^3
      1\Bigl\{\max_{1\le j\le p}|Y_{ij}-\mu_j^Y|>m^{1/2}/(4|\delta_{n,m}|\phi\log p)\Bigr\}\Bigr],
      \]
      \[
      M_m^G(\phi)=m^{-1}\sum_{i=1}^m E\Bigl[\max_{1\le j\le p}|G_{ij}-\mu_j^Y|^3
      1\Bigl\{\max_{1\le j\le p}|G_{ij}-\mu_j^Y|>m^{1/2}/(4|\delta_{n,m}|\phi\log p)\Bigr\}\Bigr].
      \]

      ###### Assumptions
      Condition (a): There exists a universal constant \(b>0\) such that
      \[
      \min_{1\le j\le p}E\{(S_{nj}^X-n^{1/2}\mu_j^X+\delta_{n,m}S_{mj}^Y-\delta_{n,m}m^{1/2}\mu_j^Y)^2\}\ge b.
      \]

      ###### Statement
      For any \(\phi_1,\phi_2\ge1\) and any sequence of constants \(\delta_{n,m}\), assume condition (a) in Assumptions holds. Then
      \[
      \begin{aligned}
      \rho_{n,m}\lesssim {}&
      n^{-1/2}\phi_1^2(\log p)^2\{\phi_1L_n^X\rho_{n,m}+L_n^X(\log p)^{1/2}+\phi_1M_n(\phi_1)\}\\
      &+m^{-1/2}\phi_2^2(\log p)^2|\delta_{n,m}|^3\{\phi_2L_m^Y\rho_{n,m}+L_m^Y(\log p)^{1/2}+\phi_2M_m^*(\phi_2)\}\\
      &+(\min\{\phi_1,\phi_2\})^{-1}(\log p)^{1/2},
      \end{aligned}
      \]
      up to a positive universal constant that depends only on \(b\), where \(\rho_{n,m}\) is defined in (10).
