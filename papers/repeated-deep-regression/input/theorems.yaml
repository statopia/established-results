      ##### Lemma S.3

      ###### Definitions and notation
      Let \(Z(x)\) be a random function on \([0,1]^d\), with i.i.d. realizations \(Z_1(x),\dots,Z_n(x)\). The \(i\)th subject is measured at \(m_i\) points \(X_{i1},\dots,X_{im_i}\), and the exposition assumes \(m_1=\cdots=m_n=m\). The covariates \(X_{ij}\), \(1\le i\le n\), \(1\le j\le m\), are i.i.d. from a distribution \(\mathcal P_X\) supported on some \(\Omega\subseteq[0,1]^d\) and independent of \(Z_i\), \(1\le i\le n\). The set \(\Omega\) has a well-defined volume measure, and \(\mathcal P_X\) is absolutely continuous with respect to that volume measure. The regression function is
      \[
      f^\circ(x)=\mathbb E[Z(X)\mid X=x].
      \]
      The repeated-measures model is
      \[
      Y_{ij}=Z_i(X_{ij})+\epsilon_{ij}=f^\circ(X_{ij})+U_i(X_{ij})+\epsilon_{ij},
      \quad 1\le i\le n,\ 1\le j\le m, \tag{1}
      \]
      where \(U_i(x)=Z_i(x)-f^\circ(x)\) are the individual stochastic parts and the \(\epsilon_{ij}\) are independent noise variables. The available data are \(\{(Y_{ij},X_{ij}):1\le i\le n,1\le j\le m\}\).

      The nonparametric least-squares estimator over a function class \(\mathcal F_{nm}\) is
      \[
      \hat f_{nm}\in\arg\min_{f\in\mathcal F_{nm}}
      \frac{1}{nm}\sum_{i=1}^{n}\sum_{j=1}^{m}(Y_{ij}-f(X_{ij}))^2. \tag{2}
      \]
      In Lemma S.3, \(\hat f\) denotes \(\hat f_{nm}\).

      The infinity norm is \(\|f\|_\infty=\sup_{x\in\Omega}|f(x)|\). For \(r>0\),
      \[
      \mathcal F_{nm}(r)=\left\{f\in\mathcal F_{nm}:
      \int_\Omega(f(x)-f^\circ(x))^2\,dP_X\le r\right\}.
      \]
      A function \(\phi_{nm}(r)\) is sub-root if and only if \(\phi_{nm}(r)/\sqrt r\) is nonnegative and nonincreasing. Let \(\{\sigma_{ij},1\le i\le n,1\le j\le m\}\) be i.i.d. Rademacher variables uniformly chosen from \(\{-1,+1\}\). For a random process \(V\) and an uncountable index set \(\mathcal F\),
      \[
      \mathbb E\sup_{f\in\mathcal F}V(f)
      =
      \sup\left\{\mathbb E\sup_{f\in\mathcal F^*}V(f):
      \mathcal F^*\subset\mathcal F,\ \mathcal F^*\text{ is finite}\right\}.
      \]
      A positive number \(r^*_{nm}\) is a Rademacher fixed point of \(\mathcal F_{nm}\) if \(\phi_{nm}(r)\) is sub-root for \(r\ge r^*_{nm}\), \(\phi_{nm}(r^*_{nm})\le r^*_{nm}\), and
      \[
      \phi_{nm}(r)\ge
      \mathbb E\left[
      \sup_{f\in\mathcal F_{nm}(r)}
      \left|
      \frac{1}{nm}\sum_{i=1}^{n}\sum_{j=1}^{m}
      \sigma_{ij}(f(X_{ij})-f^\circ(X_{ij}))
      \right|
      \right]
      \]
      for all \(r\ge r^*_{nm}\). As in Section S.5, write
      \[
      \int_\Omega(f-f^\circ)^2\,dP_X
      :=
      \int_\Omega(f(x)-f^\circ(x))^2\,dP_X,
      \]
      and abbreviate \(\mathcal F=\mathcal F_{nm}\), \(\phi=\phi_{nm}\), and \(r^*=r^*_{nm}\).

      For a truncation level \(\beta\), the truncation operator is
      \[
      \mathcal T_\beta f(x)
      =
      f(x)I(|f(x)|\le\beta)
      +
      \operatorname{sign}(f(x))\beta\, I(|f(x)|>\beta),
      \]
      where \(I(\cdot)\) is an indicator. In Lemma S.3, the truncation level is \(\beta_\epsilon\).

      The constants \(B_1,B_2,B_3\) are the constants appearing in Assumptions 1 and 2 below. The constants \(c_{40}\) and \(c_{41}\) are universal constants supplied by Lemma S.3.

      ###### Assumptions
      The repeated-measures design and model are as follows: \(Z_1,\dots,Z_n\) are i.i.d. realizations of \(Z\); the covariates \(X_{ij}\), \(1\le i\le n\), \(1\le j\le m\), are i.i.d. from \(\mathcal P_X\) supported on \(\Omega\subseteq[0,1]^d\), independent of \(Z_i\); \(\Omega\) has a well-defined volume measure and \(\mathcal P_X\) is absolutely continuous with respect to that volume measure; \(f^\circ(x)=\mathbb E[Z(X)\mid X=x]\); the responses satisfy (1), with \(m_1=\cdots=m_n=m\), \(U_i(x)=Z_i(x)-f^\circ(x)\), and independent noise variables \(\epsilon_{ij}\). The estimator \(\hat f=\hat f_{nm}\) is defined by (2).

      **Assumption 1** (Regression function and candidate class). There exists a positive number \(B_1\) such that
      \[
      \|f^\circ\|_\infty\le B_1
      \]
      and
      \[
      \|f\|_\infty\le B_1
      \]
      for each \(f\in\mathcal F_{nm}\).

      **Assumption 2** (Random process and noise). The random processes \(U_i(x)\) are continuous, and there exist nonnegative numbers \(B_2\) and \(B_3\) such that, for \(1\le i\le n\) and \(1\le j\le m\),
      \[
      \mathbb E\left[
      \exp\left\{
      \left|\frac{U_i(X_{ij})}{B_2}\right|
      \right\}
      \right]\le 1,
      \qquad
      \mathbb E\left[
      \exp\left\{
      \left|\frac{\epsilon_{ij}}{B_3}\right|
      \right\}
      \right]\le 1. \tag{4}
      \]
      The quantity \(r^*=r^*_{nm}\) is a positive Rademacher fixed point of \(\mathcal F_{nm}\), with sub-root function \(\phi=\phi_{nm}\), in the sense recalled in Definitions and notation. The truncation level \(\beta_\epsilon\) is positive.

      ###### Statement
      Under the same model and assumptions as Theorem 2.1, we have
      \[
      \left|
      \frac{1}{nm}\sum_{i=1}^{n}\sum_{j=1}^{m}
      \left(\mathcal T_{\beta_\epsilon}\epsilon_{ij}
      -\mathbb E[\mathcal T_{\beta_\epsilon}\epsilon_{ij}]\right)
      \left(\hat f(X_{ij})-f^\circ(X_{ij})\right)
      \right|
      \]
      \[
      \le
      \frac{1}{16}\int_\Omega(\hat f-f^\circ)^2\,dP_X
      +
      c_{40}\beta_\epsilon^2r^*
      +
      \frac{c_{41}(B_1\beta_\epsilon+B_3^2)t}{nm},
      \]
      with probability at least \(1-\exp\{-t\}\), where \(\mathcal T_{\beta_\epsilon}\) is the truncation operator, and \(c_{40}\) and \(c_{41}\) are universal constants.

