      “**Lemma S.8** (Talagrand’s inequality). *Let \(\{W_{i,f},1\le i\le n,f\in\mathcal F\}\) be random variables independent cross \(i\). Assume that for any \(1\le i\le n\) and \(f\in\mathcal F\), we have \(|W_{i,f}|\le b_2\), \(\mathbb E[W_{i,f}]=0\) and \(\mathbb E[W_{i,f}^2]\le b_3\). Then with probability at least \(1-\exp\{-t\}\), the following inequality holds:*
      \[
      \sup_{f\in\mathcal F}\left|\frac1n\sum_{i=1}^nW_{i,f}\right|\le2\mathbb E\left[\sup_{f\in\mathcal F}\left|\frac1n\sum_{i=1}^nW_{i,f}\right|\right]+\sqrt{\frac{8b_3t}{n}}+\frac{35b_2t}{n}.
      \]
      *Lemma S.8 could be derived from Theorem 4 of Massart (2000).*” In the proof of Theorem 2.1, this is used in Step 3.1: “By combining with (S.9), (S.10), (S.11) and (S.12) and checking the conditions required by Lemma S.8, we can conclude that, with probability at least \(1-\exp\{-t\}\),
      \[
      \left|\frac{1}{nm}\sum_{i=1}^n\sum_{j=1}^m\frac{(\mathcal T_{\beta_U}U_i)(X_{ij})(\hat f(X_{ij})-f^\circ(X_{ij}))-\int_\Omega(\mathcal T_{\beta_U}U_i)(\hat f-f^\circ)dP_X}{\int_\Omega(\hat f-f^\circ)^2dP_X+r}\right|
      \]
      \[
      \le\sup_{f\in\mathcal F}\left|\frac{1}{nm}\sum_{i=1}^n\sum_{j=1}^m\frac{(\mathcal T_{\beta_U}U_i)(X_{ij})(f(X_{ij})-f^\circ(X_{ij}))-\int_\Omega(\mathcal T_{\beta_U}U_i)(f-f^\circ)dP_X}{\int_\Omega(f-f^\circ)^2dP_X+r}\right|
      \]
      \[
      \le\frac{32\beta_U\phi(r)}{r}+\sqrt{\frac{2\beta_U^2t}{nmr}}+\frac{140B_1\beta_Ut}{nmr}.
