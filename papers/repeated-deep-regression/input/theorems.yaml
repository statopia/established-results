      (V)\le2B_1\mathbb E[|\epsilon_{ij}-\mathcal T_{\beta_\epsilon}\epsilon_{ij}+\mathbb E[\mathcal T_{\beta_\epsilon}\epsilon_{ij}]|]\le4B_1\mathbb E[|\epsilon_{11}|I(|\epsilon_{11}|>\beta_\epsilon)]
      \]
      \[
      \le4B_1\mathbb E\left[2B_3\exp\left\{\frac{|\epsilon_{11}|}{2B_3}\right\}\exp\left\{\frac{|\epsilon_{11}|-\beta_\epsilon}{2B_3}\right\}\right]\le8B_1B_3\exp\left\{-\frac{\beta_\epsilon}{2B_3}\right\}.\tag{S.20}
      \]
      Substituting (S.19) and (S.20) into (S.18) and setting \(\beta_\epsilon=2B_3\log nm\), we have
      \[
      \frac{1}{nm}\mathbb E\left[\sum_{i=1}^n\sum_{j=1}^m\epsilon_{ij}(\hat f(X_{ij})-f^\circ(X_{ij}))\right]
      \]
      \[
      \le\frac{1}{16}\mathcal E_{f^\circ}(\hat f)+\frac{c_{51}(B_1^2+B_3^2\log^2nm)}{nm}+c_{52}B_3^2r^*\log^2nm,\tag{S.21}
      \]
      where \(c_{51}\) and \(c_{52}\) are universal constants.

      Step 5. Plugging (S.17)(S.21) into (S.6) yields
      \[
      \hat{\mathcal E}_{f^\circ}(\hat f)\le\inf_{f\in\mathcal F}\int_\Omega(f-f^\circ)^2d\mathcal P_X+\frac14\mathcal E_{f^\circ}(\hat f)+\frac{c_{53}(B_1^2+B_2^2)}{n}
      \]
      \[
      +\frac{c_{54}(B_1^2+B_2^2\log n+B_3^2\log nm)}{nm}+c_{55}r^*(B_2^2\log n+B_3^2\log nm)).\tag{S.22}
      \]
      Substituting (S.22) into (S.4) and noting that all constants \(c_k\) used in this proof are universal, the desired result follows. Thus we complete the proof. \(\Box\)

