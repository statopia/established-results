      :=(IV)+(V).
      \]
      Step 4.1. [ref:R2] implies that, with probability at least \(1-\exp\{-t\}\),
      \[
      \left|\frac{1}{nm}\sum_{i=1}^n\sum_{j=1}^m(\mathcal T_{\beta_\epsilon}\epsilon_{ij}-\mathbb E[\mathcal T_{\beta_\epsilon}\epsilon_{ij}])(\hat f(X_{ij})-f^\circ(X_{ij}))\right|
      \]
      \[
      \le\frac{1}{16}\int_\Omega(\hat f-f^\circ)^2d\mathcal P_X+c_{40}\beta_\epsilon^2r^*+\frac{c_{41}(B_1\beta_\epsilon+B_3^2)t}{nm}.
      \]
      Further, by taking the expectation of the previous result, we have
      \[
      (IV)\le\frac{1}{16}\mathcal E_{f^\circ}(\hat f)+c_{40}\beta_\epsilon^2r^*+\frac{c_{41}(B_1\beta_\epsilon+B_3^2)}{nm}.\tag{S.19}
      \]
