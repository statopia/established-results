      ##### Lemma S.7 (Comparison Theorem; see Theorem 4.12 in Ledoux & Talagrand (1991))
      ###### Definitions and notation
      For a positive integer \(n\), let \(1\le i\le n\). The functions \(\Phi_i\) are real-valued functions of the real arguments \(t_i\).

      A function \(\Phi_i\) is \(b_1\)-Lipschitz, in the standard sense, if
      \[
      |\Phi_i(s)-\Phi_i(t)|\le b_1|s-t|
      \]
      for all relevant real \(s,t\), with Lipschitz constant \(b_1\).

      The variables \(\{\sigma_i,1\le i\le n\}\) are Rademacher random variables, i.e. each takes values in \(\{-1,+1\}\) with equal probability; the source condition says that they do not depend on others.

      The set \(\Omega'\) is a bounded subset of \(\mathbb R^n\), and its elements are written \((t_1,\ldots,t_n)\). The expectation \(\mathbb E\) in the statement is taken with respect to the Rademacher variables \(\sigma_i\).

      ###### Assumptions
      Let \(n\) be a positive integer. Let \(\{\Phi_i,1\le i\le n\}\) be functions that are \(b_1\)-Lipschitz and satisfy
      \[
      \Phi_i(0)=0,\qquad 1\le i\le n.
      \]
      Assume that \(\{\sigma_i,1\le i\le n\}\) are Rademacher random variables not depending on others. Let \(\Omega'\) be a bounded subset of \(\mathbb R^n\).

      ###### Statement
      Under the above conditions, for any bounded subset \(\Omega'\) in \(\mathbb R^n\),
      \[
      \mathbb E\left[\sup_{(t_1,\ldots,t_n)\in\Omega'}\left|\frac1n\sum_{i=1}^n\sigma_i\Phi_i(t_i)\right|\right]
      \le
      2b_1\cdot
      \mathbb E\left[\sup_{(t_1,\ldots,t_n)\in\Omega'}\left|\frac1n\sum_{i=1}^n\sigma_i t_i\right|\right],
      \]
      where the expectation is taken with respect to \(\sigma_i\).

