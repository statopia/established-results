      ##### Lemma S.8 (Talagrand’s inequality)
      ###### Definitions and notation
      The statement is indexed by \(i=1,\dots,n\) and by \(f\in\mathcal F\), where \(\mathcal F\) is the index set of the random variables \(\{W_{i,f}\}\). The concentration parameter is \(t\), appearing in the probability statement \(1-\exp\{-t\}\). The parameters \(b_2\) and \(b_3\) are those occurring in the hypotheses below.

      For mathematical rigor, as stated immediately before Lemma S.8 in the source, when the index set \(\mathcal F\) is uncountable, for a random process \(V\),
      \[
      \mathbb E\sup_{f\in\mathcal F}V(f)=\sup\left\{\mathbb E\sup_{f\in\mathcal F^*}V(f):\mathcal F^*\subset\mathcal F,\ \mathcal F^*\text{ is finite}\right\},
      \]
      as in Talagrand (2014). This convention applies to the expectation of the supremum in Lemma S.8.

      ###### Assumptions
      The variables \(\{W_{i,f}:1\le i\le n,\ f\in\mathcal F\}\) are independent across \(i\) (the source says “independent cross \(i\)”). For every \(1\le i\le n\) and every \(f\in\mathcal F\),
      \[
      |W_{i,f}|\le b_2,\qquad \mathbb E[W_{i,f}]=0,\qquad \mathbb E[W_{i,f}^2]\le b_3.
      \]
      The source adds that, unlike the usual versions of Talagrand’s inequality with better constants, this version does not impose the requirement that \(W_i\), \(1\le i\le n\), be identically distributed.

      ###### Statement
      With probability at least \(1-\exp\{-t\}\), the following inequality holds:
      \[
      \sup_{f\in\mathcal F}\left|\frac1n\sum_{i=1}^nW_{i,f}\right|
      \le
      2\mathbb E\left[\sup_{f\in\mathcal F}\left|\frac1n\sum_{i=1}^nW_{i,f}\right|\right]
      +\sqrt{\frac{8b_3t}{n}}
      +\frac{35b_2t}{n}.
      \]
