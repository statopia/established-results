      ##### Definitions and notation
      The repeated-measures model is
      \[
      Y_{ij}=Z_i(X_{ij})+\epsilon_{ij}=f^\circ(X_{ij})+U_i(X_{ij})+\epsilon_{ij},\qquad 1\le i\le n,\quad 1\le j\le m, \tag{1}
      \]
      where \(Z_i(x)\) are independent and identically distributed realizations of a random function \(Z(x)\) on \([0,1]^d\), \(U_i(x)=Z_i(x)-f^\circ(x)\), and the \(\epsilon_{ij}\) are independent noise variables. The regression function is
      \[
      f^\circ(x)=\mathbb E[Z(X)\mid X=x].
      \]
      The covariates \(X_{ij}\), \(1\le i\le n\), \(1\le j\le m\), are i.i.d. from a distribution \(\mathcal P_X\) supported on \(\Omega\subseteq[0,1]^d\) and independent of \(Z_i\), \(1\le i\le n\). The set \(\Omega\) has a well-defined volume measure, and \(\mathcal P_X\) is absolutely continuous with respect to that volume measure. In the repeated-measurements setting considered here, \(m_1=\cdots=m_n=m\).

      The data are \(\{(Y_{ij},X_{ij}):1\le i\le n,1\le j\le m\}\). The nonparametric least-squares estimator is
      \[
      \hat f_{nm}\in\arg\min_{f\in\mathcal F_{nm}}\frac1{nm}\sum_{i=1}^n\sum_{j=1}^m(Y_{ij}-f(X_{ij}))^2, \tag{2}
      \]
      where \(\mathcal F_{nm}\) is the chosen function class. In Lemma S.2 and its proof, \(\hat f\) abbreviates \(\hat f_{nm}\). Also,
      \[
      \int_\Omega(f-f^\circ)^2dP_X:=\int_\Omega(f(x)-f^\circ(x))^2dP_X.
      \]
      For \(r>0\), define
      \[
      \mathcal F_{nm}(r)=\left\{f\in\mathcal F_{nm}:\int_\Omega(f(x)-f^\circ(x))^2dP_X\le r\right\}.
      \]
      A function \(\phi_{nm}(r)\) is sub-root if and only if \(\phi_{nm}(r)/\sqrt r\) is nonnegative and nonincreasing. Let \(\{\sigma_{ij}:1\le i\le n,1\le j\le m\}\) be i.i.d. Rademacher variables uniformly chosen from \(\{-1,+1\}\). For an uncountable index set \(\mathcal F\), the expectation of the supremum is defined by
      \[
      \mathbb E\sup_{f\in\mathcal F}V(f)
      =
      \sup\left\{\mathbb E\sup_{f\in\mathcal F^*}V(f):\mathcal F^*\subset\mathcal F,\ \mathcal F^*\text{ is finite}\right\}.
      \]
      A positive number \(r_{nm}^*=r^*\) is a Rademacher fixed point of \(\mathcal F_{nm}\) if \(\phi_{nm}(r)\) is sub-root for \(r\ge r_{nm}^*\), \(\phi_{nm}(r_{nm}^*)\le r_{nm}^*\), and
      \[
      \phi_{nm}(r)\ge
      \mathbb E\left[
      \sup_{f\in\mathcal F_{nm}(r)}
      \left|
      \frac1{nm}\sum_{i=1}^n\sum_{j=1}^m
      \sigma_{ij}\bigl(f(X_{ij})-f^\circ(X_{ij})\bigr)
      \right|
      \right]
      \]
      for all \(r\ge r_{nm}^*\). The constants \(c_{38}\) and \(c_{39}\) in the statement are universal constants.

