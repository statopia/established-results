      \mathbb E\sup_{f\in\mathcal F^*}V(f):
      \mathcal F^*\subset\mathcal F,\ \mathcal F^*\text{ finite}
      \right\}.
      \]
      The source writes \(\int_\Omega(f-f^\circ)^2dP_X\) for \(\int_\Omega(f(x)-f^\circ(x))^2dP_X\), and abbreviates \(\mathcal F=\mathcal F_{nm}\), \(\phi=\phi_{nm}\), \(r^*=r^*_{nm}\).

      ###### Assumptions
      The lemma is stated under the same model and assumptions as Theorem 2.1. In particular:

      **Assumption 1.** There is a positive number \(B_1\) such that \(\|f^\circ\|_\infty\le B_1\) and \(\|f\|_\infty\le B_1\) for every \(f\in\mathcal F_{nm}\).

      **Assumption 2.** The processes \(U_i(x)\) are continuous, and there exist nonnegative numbers \(B_2,B_3\) such that, for all \(1\le i\le n\), \(1\le j\le m\),
      \[
      \mathbb E\left[\exp\left\{\left|\frac{U_i(X_{ij})}{B_2}\right|\right\}\right]\le 1,
