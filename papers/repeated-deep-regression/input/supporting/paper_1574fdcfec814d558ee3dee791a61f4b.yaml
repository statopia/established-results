      \]
      with probability at least \(1-\exp\{-t\}\), where \(c_{38}\) and \(c_{39}\) are universal constants.

      ##### Lemma S.7 (Comparison Theorem)
      ###### Definitions and notation
      Let \(\{\Phi_i\}_{1\le i\le n}\) be functions, let \(b_1\) be a Lipschitz constant, let \(\{\sigma_i\}_{1\le i\le n}\) be Rademacher random variables, and let \(\Omega'\) be a bounded subset of \(\mathbb R^n\). The expectation in the statement is taken with respect to the \(\sigma_i\).

      ###### Assumptions
      The functions \(\Phi_i\) are \(b_1\)-Lipschitz and satisfy \(\Phi_i(0)=0\). The Rademacher variables \(\sigma_i\) do not depend on other random objects. \(\Omega'\) is a bounded subset of \(\mathbb R^n\).

      ###### Statement
      For any bounded subset \(\Omega'\) in \(\mathbb R^n\),
      \[
      \mathbb E\left[
      \sup_{(t_1,\ldots,t_n)\in\Omega'}
      \left|
      \frac1n\sum_{i=1}^n\sigma_i\Phi_i(t_i)
      \right|
      \right]
      \le
      2b_1\,
      \mathbb E\left[
      \sup_{(t_1,\ldots,t_n)\in\Omega'}
      \left|
      \frac1n\sum_{i=1}^n\sigma_i t_i
      \right|
      \right],
      \]
      where the expectation is taken with respect to the \(\sigma_i\). The source attributes this comparison theorem to Theorem 4.12 in Ledoux & Talagrand (1991).

      ##### Lemma S.8 (Talagrand’s inequality)
      ###### Definitions and notation
      Let \(\{W_{i,f}:1\le i\le n,\ f\in\mathcal F\}\) be random variables, and let \(b_2,b_3\) be nonnegative parameters. The source uses \(t\) as the confidence parameter.

      ###### Assumptions
      The variables \(W_{i,f}\) are independent across \(i\) (the source writes “independent cross \(i\)”). For any \(1\le i\le n\) and \(f\in\mathcal F\),
      \[
      |W_{i,f}|\le b_2,
      \qquad
      \mathbb E[W_{i,f}]=0,
      \qquad
      \mathbb E[W_{i,f}^2]\le b_3.
      \]

      ###### Statement
      With probability at least \(1-\exp\{-t\}\),
      \[
      \sup_{f\in\mathcal F}
      \left|
      \frac1n\sum_{i=1}^n W_{i,f}
      \right|
      \le
      2\mathbb E\left[
      \sup_{f\in\mathcal F}
      \left|
      \frac1n\sum_{i=1}^n W_{i,f}
      \right|
      \right]
      +
      \sqrt{\frac{8b_3t}{n}}
      +
      \frac{35b_2t}{n}.
      \]
      The source states that this lemma can be derived from Theorem 4 of Massart (2000) and that, unlike usual versions of Talagrand’s inequality with better constants, it does not require the \(W_{i,f}\) to be identically distributed in \(i\).
