      ##### Lemma S.2
      ###### Definitions and notation
      The source uses the repeated-measures model
      \[
      Y_{ij}=Z_i(X_{ij})+\epsilon_{ij}=f^\circ(X_{ij})+U_i(X_{ij})+\epsilon_{ij},
      \qquad 1\le i\le n,\quad 1\le j\le m,
      \]
      where \(Z_1,\dots,Z_n\) are i.i.d. realizations of a random function \(Z(x)\) on \([0,1]^d\), \(U_i(x)=Z_i(x)-f^\circ(x)\), and
      \[
      f^\circ(x)=\mathbb E[Z(X)\mid X=x].
      \]
      The covariates \(X_{ij}\) are i.i.d. from \(\mathcal P_X\) on \(\Omega\subseteq[0,1]^d\), independent of \(Z_i\); \(\mathcal P_X\) is absolutely continuous with respect to the volume measure on \(\Omega\). The \(\epsilon_{ij}\) are independent noise variables, and the equal-measurement convention is \(m_1=\cdots=m_n=m\).

      The nonparametric least-squares estimator is
      \[
      \hat f=\hat f_{nm}\in\arg\min_{f\in\mathcal F_{nm}}
      \frac1{nm}\sum_{i=1}^n\sum_{j=1}^m (Y_{ij}-f(X_{ij}))^2.
      \]
      For \(r>0\),
      \[
      \mathcal F_{nm}(r)
      =
      \left\{
      f\in\mathcal F_{nm}:
      \int_\Omega(f-f^\circ)^2\,dP_X\le r
      \right\}.
      \]
      A function \(\phi=\phi_{nm}\) is sub-root if \(\phi(r)/\sqrt r\) is nonnegative and nonincreasing. Let \(\{\sigma_{ij}:1\le i\le n,1\le j\le m\}\) be i.i.d. Rademacher variables uniform on \(\{-1,+1\}\). A positive number \(r^*=r^*_{nm}\) is a Rademacher fixed point of \(\mathcal F_{nm}\) if \(\phi_{nm}(r)\) is sub-root for \(r\ge r^*_{nm}\), \(\phi_{nm}(r^*_{nm})\le r^*_{nm}\), and
      \[
      \phi_{nm}(r)\ge
      \mathbb E\left[
      \sup_{f\in\mathcal F_{nm}(r)}
      \left|
      \frac1{nm}\sum_{i=1}^n\sum_{j=1}^m
      \sigma_{ij}\bigl(f(X_{ij})-f^\circ(X_{ij})\bigr)
      \right|
      \right]
      \]
