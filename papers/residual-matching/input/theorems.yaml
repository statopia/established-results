theorems:
  - id: entry:selected:7cc1196c-e149-4b85-9199-7e973f475d7a
    title: Theorem 4.1 (first main theorem; thm:upper_bound_for_rankr; rank-r matrix recovery bound, including the uniform low-loss candidate conclusion)
    kind: theorem
    latex_statement: |-
      For any matrix \(\M\in \mathbb{R}^{m\times n}\), the following norms are defined: \(\|\M\|\) for the spectral norm (the largest singular value), \(\|\M\|_{F}\) for the Frobenius norm (the square root of the sum of squared entries), \(\|\M\|_{*}\) for the nuclear norm (the sum of singular values), \(\|\M\|_{\infty}\) for the maximum norm (the largest absolute value of entries), and \(\|\M\|_{2,\infty}\) for the largest \(L_2\) norm of the rows (sometimes named as the \(L_2/L_\infty\) norm \citep{ma2018implicit}). The transpose of \(\M\) is denoted by \(\M'\), and \(\operatorname{Proj}_{s}(\M)\) indicates the projection of \(\M\) onto the space of matrices with rank no more than \(s\). We use the notation \(\M_{[1:s]}\) to denote the matrix formed by the first \(s\) columns of \(\M\), and \((a)_{+}\) to represent the positive part of \(a\). Additionally, the notation \(a(m)\lesssim b(m)\) means that there exists a constant \(c>0\) such that \(|a(m)|\le c|b(m)|\), and similarly \(a(m)\gtrsim b(m)\) means that \(|a(m)|\ge c|b(m)|\).

      Noisy matrix completion aims to estimate \(\M_0\in \mathbb{R}^{m\times n}\) with \(n/m=\rho\in[\rho_-,1]\) for a fixed \(\rho_->0\) from the observation \(\Y\in \mathbb{R}^{m\times n}\),
      \begin{align*}
      \Y = P_{\bOmega}(\M_0 + \bH),
      \end{align*}
      where \(\bOmega\in \mathbb{R}^{m\times n}\) is a binary matrix with ones indexing the locations of observed entries, and \(\bH\in \mathbb{R}^{m\times n}\) is an unknown noise matrix that is independent of \(\M_0\). The projection \(P_{\bOmega}(\cdot)\) preserves the observed entries in \(\bOmega\) and assigns zeros to the unobserved entries.

      A sparse Gaussian random matrix of size \(m\times n\) and missing probability \(1-p_{i,j} \ge 0, 1\le i\le m, 1\le j\le n\) can be formulated as
      \begin{align*}
         \M\in\mathbb{R}^{m\times n}, \quad \M_{i,j} = \bm{\Phi}_{i,j} \bOmega_{i,j},\quad 1\le i\le m,1\le j\le n,
      \end{align*}
      where \(\bm{\Phi}_{i,j}\) are independent Gaussian random variables with mean zero and variance \(1/m\), and \(\bOmega_{i,j}\) are independent Bernoulli random variables with success probability \(p_{i,j}\).
      Define the probability space \(\mathcal{S}_{m,n,p} = \left(\mathbb{R}^{m\times n},\mathcal{B}_{m,n},\mathcal{P}_{m,n,p}\right)\), where \(\mathcal{B}_{m,n}\) is the Borel \(\sigma\)-algebra of \(\mathbb{R}^{m\times n}\), and the probability measure \(\mathcal{P}_{m,n,p}\) is the product mixture law
      \begin{align*}
       \mathcal P_{m,n,p}
       =\bigotimes_{i=1}^{m}\bigotimes_{j=1}^{n}
       \{p_{i,j}N(0,1/m)+(1-p_{i,j})\delta_0\},
      \end{align*}
      where \(\delta_0\) is a point mass at zero. 
      We denote the singular values of \(\M\) as \(\lambda_{1}(\M)\ge \lambda_2(\M)\ge \cdots \ge \lambda_n(\M)\) and combine them into a vector \(\bm{\lambda}(\M)\). 
      In the probability space \(\mathcal{S}_{m,n,p}\), we define the conditional expectation of the random vector \(\bm{\lambda}(\M)\) as
      \(\bm{\lambda} = \mathbb{E}_{\M} [\bm{\lambda}(\M)|\bOmega]\). For uniform sampling, the singular values of \(p^{-1/2}\M\) admit a coarse ordered approximation to the rooted Marchenko--Pastur quantiles under the sparse sampling conditions in Section~\ref{sec:theoretical}. The same-mask reference additionally reflects the realized observation pattern, while averaging several draws reduces Monte Carlo variability. The conditional mean spectrum can be approximated by Monte Carlo \(\widehat{\bm{\lambda}} = \sum_{i=1}^T \bm{\lambda}(\M_i)/T\) where \(\M_i,1\le i\le T\) are independent sparse Gaussian random matrices conditional on the observed set \(\bOmega\). The entries of \(\widehat{\bm{\lambda}}\) are denoted as \(\widehat{\lambda}_i,1\le i\le n\).

      We then construct a criterion \(l(\bm{N};\bm{\omega})\) to evaluate whether the spectrum of a matrix \(\bm{N}\in\mathbb R^{m\times n}\) agrees with the sparse Gaussian reference. Let the ordered singular values of \(\bm{N}\) be denoted as \(\psi_1(\bm{N})\ge \psi_2(\bm{N})\ge \cdots \ge \psi_n(\bm{N})\), and define the vector \(\bm{\psi}(\bm{N}) = (\psi_1(\bm{N}),\cdots,\psi_n(\bm{N}))\). The criterion calculates the weighted \(L_2\) distance between \(\bm{\psi}(\bm{N})\) and \(\widehat{\bm{\lambda}}\), i.e., 
      \[
      l(\bm{N};\bm{\omega}) = \left\|\bm{\psi}(\bm{N}) - \widehat{\bm{\lambda}}\right\|_{\bm{\omega}}^2 = \sum_{i=1}^n \omega_i \left(\psi_i(\bm{N}) - \widehat{\lambda}_i \right)^2,
      \]
      where \(\bm{\omega}=(\omega_1,\cdots,\omega_n)\) is the vector of nonnegative weights satisfying \(\sum_{i=1}^n\omega_i=1\). The weights are held fixed during optimization.

      \begin{align} 
      \label{eq:working_variance}
          \widehat{\sigma}(\M) = \frac{\sum_{i\in I} \psi_i\left(\Y - P_{\bOmega}(\M)\right)}{\sqrt{m}\sum_{i\in I} \widehat\lambda_i},
      \end{align}
      where \(I=\{\lceil n/3\rceil,\ldots,\lfloor2n/3\rfloor\}\) and \(\psi_i(\Y-P_{\bOmega}(\M))\) are the ordered residual singular values. Candidates with zero bulk scale are assigned infinite loss. We use the normalization \(\mathcal L(\M)=p^{-1}l((\Y-P_{\bOmega}(\M))/(\sqrt m\widehat\sigma(\M));\bm\omega)\). The working estimator \(\widehat\sigma(\M)\) approximates the standard deviation \(\sigma\) of the noise by calculating the proportion of the bulk singular values' sum from the residual matrix and sparse random matrices. Using the middle singular values reduces the influence of a few large residual singular values on scale estimation.

      With a rank cap \(s\), write \(\M=\bL\R'\) with
      \(\bL\in\mathbb R^{m\times s}\) and \(\R\in\mathbb R^{n\times s}\).
      To control the distribution of the signal across entries, define
      \begin{align*}
       \mathbb M_{s,\mu_1}=\left\{\M=\U\bm D\V':\operatorname{rank}(\M)\le s,
       \ \|\U\|_{2,\infty}^2\le\frac{\mu_1s}{m},
       \ \|\V\|_{2,\infty}^2\le\frac{\mu_1s}{n}\right\},
      \end{align*}
      where \(\U,\V\) contain the nonzero singular directions; the zero matrix is included. Consider the estimator
      \begin{align*}
       \widetilde\M\in\operatorname*{argmin}_{\M\in \mathbb M_{r,\mu_1}}
                   \mathcal L(\M),
      \end{align*}
      whenever a minimizer exists.

      <!-- formalization-clarifications:v1:621b8de46419d6160b6c0b78191a9a144915a3812a98692f8591b45165f5113a -->
      Formalization clarifications from source and proof:
      1. Constants and quantifier order. For Theorem 4.1 the intended order is: fix the numerical/fixed parameters and conditions, including the fixed ratio constant ρ_->0, α0>15, the tail constant K_H, the fixed low-loss multiplier C_L>0, and the weight vector ω with sum one and first coordinate ω1; for each m,n with m≥n and n/m∈[ρ_-,1], each rank r with 12r≤n, each fixed deterministic M0 satisfying Assumption target with parameters μ0, s*, s1, κ, and each μ1≥μ0, p and σ satisfying the displayed sampling condition and assumptions, one considers the random mask Ω, noise H, and Gaussian Monte Carlo reference draws, obtaining an event of probability at least 1-c n^{-3}. On that same event the theorem asserts the bound for the minimizer and, more generally, simultaneously for every M∈M_{r,μ1} with finite loss and L(M)≤C_Lω1. The source states the uniform clause explicitly: “on the same event, every finite-loss candidate … obeys this bound”; the proof adds “uniform in the candidate” and “data-dependent candidates.” Thus do not put the candidate before the probability event as a per-candidate event; the high-probability event is common. The source says M0 is fixed in Assumption target and the probability statements account for “the observation mask, noise and Monte Carlo reference matrices.” The asymptotic filter is not formally specified; the source uses “sufficiently large dimensions” and ω1≫log^{-2}m, while the sampling inequality np≥Cκ²{⋯} is a finite quantitative condition. Constants: the theorem says the error constant “may depend on fixed C_L>0”; the proof states “Constants may depend on the fixed lower bound for n/m.” R2 explicitly says its C,c are numerical and may depend on the fixed lower bound for n/m. R3 explicitly allows C_M≥1 to be “possibly depending on the dimensions,” and C_{C_M} may depend on C_M. The selected text does not give a complete dependence calculus for C and c in Theorem 4.1 or for C0 in R1; in particular, exact permitted dependence on r, μ0, μ1, κ, p, σ, T, and the weight vector is not fully spelled out. What is clear is that an implicit Lean parameter does not by itself make a constant uniform over that parameter. Also, ω1 here is the first coordinate of the fixed weight vector ω, not an independent arbitrary loss threshold; the threshold is C_Lω1, and the condition ω1≫log^{-2}m is used with the first weighted term in the loss (Theorem 4.1 and proof “The first weighted singular-value term in the loss…”). The theorem’s minimizer conclusion requires a minimizer to exist; the Definitions and Proof state the estimator “whenever a minimizer exists” and “Statements about global minimizers assume their existence.” The more general finite-loss candidate conclusion does not require asserting that the candidate is a minimizer.

      2. Norms and mathematical objects. The Definitions and notation fixes all matrix norms exactly: ‖M‖ is the spectral norm, the largest singular value; ‖M‖_F is the Frobenius norm, the square root of the sum of squared entries; ‖M‖_* is the nuclear norm, the sum of singular values; ‖M‖_∞ is the maximum absolute entry; and ‖M‖_{2,∞} is the largest Euclidean row L2 norm. The transpose is M′, Proj_s(M) is the projection onto rank ≤s matrices, M_{[1:s]} means the first s columns, and (a)_+ is the positive part. In the proof s_i(A)=ψ_i(A) denotes the i-th singular value in decreasing order, not an eigenvalue. The Monte Carlo reference \hatλ_i in the loss is the i-th singular value of P_Ω(G^{(t)})/√m averaged over t, and the ideal same-mask reference is λ_i°(Ω)=E_G[s_i(P_Ω(G)/√m)|Ω] in R1; these are singular values of the sparse-masked Gaussian reference, not deterministic Marchenko–Pastur quantiles, not eigenvalues of a covariance matrix, and not the singular values of an unprojected or p-scaled Gaussian matrix. R1 only compares them to √p γ_i in its reference-rigidity bound. The loss is l(N;ω)=∑_{i=1}^n ω_i(ψ_i(N)-\hatλ_i)^2=‖ψ(N)-\hatλ‖_ω^2, and the normalized loss is L(M)=p^{-1}l((Y-P_Ω(M))/(√m\hatσ(M));ω); the p^{-1}, the √m division, and the scale \hatσ(M) are part of the object. The working scale is \hatσ(M)=∑_{i∈I}ψ_i(Y-P_Ω(M))/(√m∑_{i∈I}\hatλ_i), with I={ceil(n/3),…,floor(2n/3)}; candidates with zero bulk scale are assigned infinite loss, and R1 notes the reference middle sum is positive on the stated events. The candidate class M_{s,μ1} is defined through M=UDV′ with rank≤s and U,V containing the nonzero singular directions, satisfying the squared leverage bounds ‖U‖_{2,∞}^2≤μ1s/m and ‖V‖_{2,∞}^2≤μ1s/n; the zero matrix is included and has zero leverage. This is a condition on singular spaces, not on arbitrary factors L,R in M=LR′; the proof may use balanced factorizations for Schur bounds, but that is an intermediate device. In the proof, E(M)=Y-P_Ω(M), Δ=M-M0, d=‖Δ‖_F, Q_Ω(Δ)=‖P_Ω(Δ)‖_F^2, T_Ω=p^{-1}P_Ω-Id, h=σ√(m/p), and β=μ̄r/√(np). Q_Ω is the squared Frobenius norm of the observed projection, not p^{-1} times that quantity. R2 uses W_Ω=p^{-1}Ω-J, Λ=C√(m/p), θ=C√(μ0 r log m/(np)), and the Schur bound ‖T_Ω(LR′)‖≤Λ‖L‖_{2,∞}‖R‖_{2,∞}; its b(A,C) is the minimum of ‖A‖_F‖C‖_{2,∞} and ‖A‖_{2,∞}‖C‖_F. R3’s local RSC display is exactly (p/2)‖M-M0‖_F^2≤‖P_Ω(M-M0)‖_F^2≤(3p/2)‖M-M0‖_F^2 under its stated C_M-dependent event and sampling condition; do not replace the two-sided comparison by an unobserved Frobenius equality.

      3. Asymptotics. The preliminaries define a(m)≲b(m) to mean there exists c>0 with |a(m)|≤c|b(m)| and a(m)≳b(m) analogously. The selected theorem uses explicit C and c, not o_P/O_P notation. The expression ω1≫log^{-2}m is not given an exact quantitative constant in the selected statement; the proof only says “Since ω1≫log^{-2}m, for all sufficiently large m.” Likewise “sufficiently large dimensions” is an eventual side condition, not a specified threshold. The sampling condition np≥Cκ²{μ̄r log m+μ̄²r²} and the sparse condition mp≥log^{α0}m, α0>15, are quantitative finite-sample inequalities. The high-probability conclusion is literally with probability at least 1-c n^{-3}; R1 also gives conditional Monte Carlo error C√(log n/(mT)) and R2 gives mask probability 1-c n^{-4}. The main methodology says that under the sufficient sparse sampling condition any T≥1 has the required Monte Carlo property and larger T reduces the Monte Carlo component; however Theorem 4.1 itself does not explicitly restate a quantifier for T, so the exact T-dependence in the theorem statement is an implicit/source-unspecified point. The theorem’s event is the common calibration/mask/reference event; it is not a family of separate candidate-dependent events.

      4. Potentially omitted definitions and side conditions. In the homogeneous theoretical sections the mask is independent Bernoulli(p) with scalar p; the more general p_{i,j} notation in the methodology is not what Assumptions–Theorem 4.1 use. H has independent mean-zero entries with variance σ²>0 and a uniform sub-exponential tail with fixed K_H; the assumption does not say the H_{ij} are identically distributed beyond variance and tail. M0 is deterministic and fixed in Assumption target, with compact SVD and s*=ψ_r(M0)>0; 12r≤n and n/m∈[ρ_-,1] are side conditions. The theorem’s rank-r factor section says “Assume μ1≥μ0, so that M0 is feasible, and set μ̄=max{μ0,μ1}”; this feasibility condition is contextual even though it is not repeated inside the displayed theorem statement. The Gaussian reference matrices are independent of the noise conditional on the observed mask, and independent standard Gaussian draws are used conditionally on the mask in R1. The weight vector is nonnegative, sums to one, and is fixed during optimization; zero bulk scale gives infinite loss. Argmin notation is conditional: the estimator is taken “whenever a minimizer exists,” and the proof says global-minimizer statements assume existence. The proof’s intermediate claims—observed energy upper bound, coarse localization, local RSC, pilot consistency—are not additional source hypotheses of Theorem 4.1; they are proof steps or consequences/citations under the stated assumptions. The proof writes \widetilde M_fac in the pilot discussion while the selected theorem writes \widetilde M; the main source defines \widetilde M_fac as the factorization estimator, but the selected theorem text does not explicitly restate the identification, so this is a notational point to resolve in formalization rather than an extra assumption. The external owners are: R1, Lemma lem:loss_for_true “Same-mask spectral and scale calibration,” supplies the calibration event, uniform scale bound, true-loss calibration, conditional same-mask reference rigidity, and Monte Carlo reference error; R2, Lemma lem:mask_geometry “Uniform Bernoulli sampling bounds,” supplies the mask event, Λ and θ, the Schur-product bound, and the factor inequalities; R3, Lemma lem:global_relative_sampling “Relative sampling for incoherent candidates,” supplies the local relative sampling/RSC bound and the C_M-dependent condition. These are universal cited lemmas under their own stated assumptions and are not restricted by the target application.
