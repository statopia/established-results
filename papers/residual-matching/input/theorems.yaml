      ##### Lemma (Uniform Bernoulli sampling bounds, lem:mask_geometry)

      ###### Definitions and notation
      Let \(m,n\) be positive integers with \(m\ge n\) and
      \[
      0<\rho_-\le \frac nm\le 1
      \]
      for a fixed constant \(\rho_->0\). Let \(M_0\in\mathbb R^{m\times n}\) be a fixed rank-\(r\) matrix, and let \(\Omega\in\mathbb R^{m\times n}\) be a binary observation mask.

      For a matrix \(X\), let \(\|X\|\) denote the spectral norm, \(\|X\|_F\) the Frobenius norm, and
      \[
      \|X\|_{2,\infty}
      \]
      the largest \(L_2\) norm of the rows of \(X\). Let \(X'\) denote the transpose of \(X\), and let \(\operatorname{Id}\) denote the identity operator. Let \(J\) denote the \(m\times n\) all-ones matrix. Let \(P_\Omega\) be the projection that preserves entries indexed by \(\Omega\) and assigns zero to unobserved entries.

      Define
      \[
      W_\Omega=p^{-1}\Omega-J,
      \qquad
      T_\Omega=p^{-1}P_\Omega-\operatorname{Id}.
      \]

      Let \(T_\star\) be the fixed tangent space at \(M_0\). Equivalently, when
      \[
      M_0=U\Sigma V'
      \]
      is a compact singular value decomposition with \(r\) nonzero singular directions, the same source later writes the tangent space in the form
      \[
      T=\left\{ UA'+BV':\ A\in\mathbb R^{n\times r},\ B\in\mathbb R^{m\times r}\right\}.
      \]
      Thus in the present lemma, \(T_\star\) is this fixed tangent space at \(M_0\).

      For conformable factors \(A,C\) and \(B,D\), the source uses
      \[
      b(A,C)=\min\left\{\|A\|_F\|C\|_{2,\infty},\ \|A\|_{2,\infty}\|C\|_F\right\}.
      \]

      ###### Assumptions
      The surrounding homogeneous model is
      \[
      Y=P_\Omega(M_0+H),
      \]
      with fixed rank-\(r\) matrix \(M_0\in\mathbb R^{m\times n}\), \(m\ge n\), and
      \[
      0<\rho_-\le \frac nm\le 1
      \]
      for fixed \(\rho_->0\). The singular spaces of \(M_0\) are \(\mu_0\)-incoherent; in the notation of the target assumptions, for a compact SVD \(M_0=U_0\Sigma_0V_0'\),
      \[
      \|U_0\|_{2,\infty}\le \sqrt{\frac{\mu_0r}{m}},
      \qquad
      \|V_0\|_{2,\infty}\le \sqrt{\frac{\mu_0r}{n}}.
      \]
      Throughout the rank-constrained results, \(12r\le n\).

      The entries of \(\Omega\) are independent Bernoulli\((p)\) random variables and are independent of \(H\). The standing sparse sampling condition for the homogeneous spectral results is
      \[
      mp\ge \log^{\alpha_0}m
      \]
      for fixed \(\alpha_0>15\) and sufficiently large dimensions. In addition, the lemma assumes
      \[
      np\ge C\mu_0r\log m.
      \]
      The constants \(C,c\) are numerical and may depend on the fixed lower bound for \(n/m\). The probability statement below is over the observation mask \(\Omega\).

      ###### Statement
      Under the preceding assumptions, with probability at least \(1-cn^{-4}\), the following bounds hold simultaneously:
      \[
      \|W_\Omega\|\le \Lambda:=C\sqrt{\frac mp},
      \]
      and
      \[
      |\langle T_\Omega A,B\rangle|
      \le \theta\|A\|_F\|B\|_F,
      \qquad A,B\in T_\star,
      \]
      where
      \[
      \theta=C\sqrt{\frac{\mu_0r\log m}{np}},
      \]
      and \(T_\star\) is the fixed tangent space at \(M_0\).

      On this event the following hold for all conformable factors, including data-dependent factors:
      \[
      |\langle T_\Omega(AB'),CD'\rangle|
      \le \Lambda\, b(A,C)b(B,D),
      \qquad
      b(A,C)=\min\left\{\|A\|_F\|C\|_{2,\infty},
      \|A\|_{2,\infty}\|C\|_F\right\},
      \]
      and
      \[
      \|T_\Omega(LR')\|
      \le \Lambda\|L\|_{2,\infty}\|R\|_{2,\infty}.
      \]
      The two pairs of factors in the bilinear inequality may have different numbers of columns.

