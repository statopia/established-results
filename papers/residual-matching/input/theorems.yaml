      ##### Lemma `lem:loss_for_true` (Same-mask spectral and scale calibration)

      ###### Definitions and notation
      For the homogeneous model,
      \[
      Y=P_{\bOmega}(M_0+H),
      \]
      where \(M_0\in\mathbb R^{m\times n}\) is a fixed rank-\(r\) matrix, \(m\ge n\), and
      \[
      0<\rho_-\le \rho=\frac nm\le 1
      \]
      for a fixed constant \(\rho_->0\). The matrix \(P_{\bOmega}(\cdot)\) is the projection that preserves the entries indexed by \(\bOmega\) and assigns zeros to unobserved entries. The entries of \(\bOmega\) are independent Bernoulli\((p)\) variables. We write
      \[
      s_\star=s_r(M_0)>0,\qquad s_1=s_1(M_0),\qquad \kappa=\frac{s_1}{s_\star},\qquad h=\sigma\sqrt{\frac mp}.
      \]

      For any matrix \(\bm A\), \(s_i(\bm A)=\psi_i(\bm A)\) denotes its \(i\)th singular value, in decreasing order. Let
      \[
      I=\left\{\left\lceil \frac n3\right\rceil,\ldots,\left\lfloor \frac{2n}3\right\rfloor\right\},
      \qquad
      \delta_m=(\log m)^{-1}.
      \]
      Weights \(\omega_i\) are nonnegative, satisfy \(\sum_{i=1}^n\omega_i=1\), and are fixed during optimization. The reference middle sum is positive on the stated events. Candidates with zero bulk scale are assigned infinite loss.

      Under the aspect-ratio regime above, define the rooted Marchenko–Pastur density
      \[
      \nu_{\rho}(x)
      =
      \frac{1}{\pi}
      \frac{\sqrt{(\lambda_+^2-x^2)(x^2-\lambda_-^2)}}{\rho x}
      \mathbf 1_{\{\lambda_-\le x\le\lambda_+\}},
      \qquad
      \lambda_{\pm}=1\pm\sqrt{\rho},
      \]
      and let \(\gamma_1\ge\cdots\ge\gamma_n\) be the deterministic quantiles defined by
      \[
      \int_{\gamma_i}^{\lambda_+}\nu_{\rho}(x)\,dx
      =\frac{i-1/2}{n},
      \qquad 1\le i\le n.
      \]

      Let \(\bm G^{(t)}=(g^{(t)}_{ij})_{m\times n}\), \(1\le t\le T\), be independent standard Gaussian matrices, independent of \((\bOmega,H)\). The ideal same-mask reference is
      \[
      \lambda_i^{\circ}(\bOmega)
      =
      \mathbb E_{\bm G}\left[
      s_i\left(\frac{P_{\bOmega}(\bm G)}{\sqrt m}\right)
      \biggm|\bOmega\right],
      \qquad 1\le i\le n,
      \]
      and its Monte Carlo approximation is
      \[
      \widehat\lambda_i
      =
      \frac1T\sum_{t=1}^T
      s_i\left(\frac{P_{\bOmega}(\bm G^{(t)})}{\sqrt m}\right).
      \]

      The criterion is
      \[
      l(\bm N;\bm\omega)
      =
      \left\|\bm\psi(\bm N)-\widehat{\bm\lambda}\right\|_{\bm\omega}^2
      =
      \sum_{i=1}^n
      \omega_i\left(\psi_i(\bm N)-\widehat\lambda_i\right)^2,
      \]
      where \(\bm{\omega}=(\omega_1,\ldots,\omega_n)\) is the vector of nonnegative weights satisfying \(\sum_{i=1}^n\omega_i=1\), held fixed during optimization.

      The working scale is
      \[
      \widehat{\sigma}(M)
      =
      \frac{\sum_{i\in I}\psi_i\left(Y-P_{\bOmega}(M)\right)}
      {\sqrt m\sum_{i\in I}\widehat\lambda_i},
      \]
      where \(\psi_i(Y-P_{\bOmega}(M))\) are the ordered residual singular values. The normalized loss is
      \[
      \mathcal L(M;Y,\bOmega)
      =
      p^{-1}
      l\!\left(
      \frac{Y-P_{\bOmega}(M)}{\sqrt m\,\widehat\sigma(M)};
      \bm\omega
      \right).
      \]
      Candidates with zero bulk scale are assigned infinite loss.

      ###### Assumptions
      The homogeneous-noise assumptions are: the entries \(H_{ij}\) of \(H\) are independent, centered, have common variance \(\sigma^2>0\), and satisfy
      \[
      \mathbb P(|H_{ij}|>t\sigma)\le 2e^{-t/K}
      \]
      uniformly, for a fixed \(K>0\). The entries of \(\bOmega\) are independent Bernoulli\((p)\) and independent of \(H\). The Gaussian reference draws are independent of the observations. The singular spaces of \(M_0\) are \(\mu_0\)-incoherent; equivalently, for the compact SVD \(M_0=U_0D_0V_0'\),
      \[
      \|U_0\|_{2,\infty}\le\sqrt{\frac{\mu_0 r}{m}},
      \qquad
      \|V_0\|_{2,\infty}\le\sqrt{\frac{\mu_0 r}{n}}.
      \]
      The homogeneous spectral results assume
      \[
      mp\ge \log^{\alpha_0}m
      \]
      for a fixed \(\alpha_0>15\) and sufficiently large dimensions. The sampling condition of Lemma `lem:sparse_coarse_rigidity` is the same sparse polylogarithmic condition
      \[
      mp\ge \log^{\alpha_0}m
      \]
      with fixed \(\alpha_0>15\), applied to the normalized entries \(H_{ij}/\sigma\), which are independent, centered, of variance one, and satisfy the displayed uniform sub-exponential tail bound.

      ###### Statement
      Under the homogeneous-noise assumptions and the sampling condition of Lemma \ref{lem:sparse_coarse_rigidity}, the following bounds hold with probability at least \(1-cn^{-3}\):
      \begin{align}
       \max_i\left|\frac{s_i(P_{\bOmega}H)}{\sigma\sqrt m}
                        -\widehat\lambda_i\right|
       &\le C\sqrt p\log^{-1}m,
       \label{eq:supp_noise_reference_uniform}\\
       \frac{\|P_{\bOmega}H\|}{\sigma\sqrt m}
             \vee\widehat\lambda_1
       &\le\sqrt p(1+\sqrt\rho+C\log^{-1}m),
             \label{eq:control_theta_1}\\
       \sum_{i\in I}\widehat\lambda_i&\ge cn\sqrt p,
             \label{eq:bound_for_lambda_sum}\\
       \left|\frac{\widehat\sigma(M_0)}{\sigma}-1\right|
       &\le C\log^{-1}m,
       \label{eq:supp_sigma_consistency}\\
       \mathcal L(M_0;Y,\bOmega)&\le C_0\log^{-2}m.
             \label{eq:calibration_true_loss}
      \end{align}
      On the same event, simultaneously for all \(M\in\mathbb R^{m\times n}\),
      \begin{align}
       \left|\frac{\widehat\sigma(M)}{\sigma}-1\right|
       \le C\log^{-1}m+
       \frac{C\|P_{\bOmega}(M-M_0)\|_F}{\sigma\sqrt{mnp}}.
       \label{eq:working_scale_bound}
      \end{align}

      The conditional reference and Monte Carlo bounds referred to in the lemma are the following. For every fixed \(D>0\), if \(mp\ge\log^{\alpha_0}m\) with \(\alpha_0\) sufficiently large, then with probability at least \(1-cn^{-D}\) over the mask,
      \begin{align}
      \label{eq:supp_conditional_reference_rigidity}
          \max_{1\le i\le n}
          |\lambda_i^{\circ}(\bOmega)-\sqrt p\,\gamma_i|
          \le C\sqrt p\,\log^{-1}m.
      \end{align}
      Conditionally on such a mask, with probability at least \(1-cn^{-D}\) over the Monte Carlo Gaussian matrices,
      \begin{align}
      \label{eq:supp_mc_reference_error}
          \max_{1\le i\le n}
          |\widehat\lambda_i-\lambda_i^{\circ}(\bOmega)|
          \le C\sqrt{\frac{\log n}{mT}}.
      \end{align}

