      Suppose
      \begin{align}
       np\ge C\kappa^2\{\bar\mu r\log m+\bar\mu^2r^2\},
       \qquad \omega_1\gg\log^{-2}m.
       \label{eq:main_factor_sampling}
      \end{align}
      With probability at least \(1-cn^{-3}\),
      \begin{align*}
       \|\widetilde\M-\M_0\|_F\le C\sigma\sqrt{mr/p}.
      \end{align*}
      More generally, on the same event, every finite-loss candidate
      \(\M\in \mathbb M_{r,\mu_1}\) satisfying
      \(\mathcal L(\M)\le C_L\omega_1\) obeys this bound, with a constant
      that may depend on the fixed \(C_L>0\).
    assumptions:
      - |-
        The probability statements account for the observation mask, noise and Monte Carlo reference matrices.

        \begin{assumption}
        \label{assum:noise}\label{assum:1.a.}
        The entries \(\bH_{ij}\) are independent mean-zero random variables with
        variance \(\sigma^2>0\). There is a fixed constant \(K_H>0\) such that
        \(\mathbb P(|\bH_{ij}|>t\sigma)\le2\exp(-t/K_H)\) for every \(t>0\), uniformly
        in \(i,j,m,n\).
        \end{assumption}

        \begin{assumption}
        \label{assum:target}
        The fixed matrix \(\M_0\in\mathbb R^{m\times n}\) has rank \(r\), with
        \(12r\le n\) and \(0<\rho_-\le n/m\le1\). Its compact SVD
        \(\M_0=\U_0\bm D_0\V_0'\) satisfies
        \(\|\U_0\|_{2,\infty}\le\sqrt{\mu_0r/m}\) and
        \(\|\V_0\|_{2,\infty}\le\sqrt{\mu_0r/n}\).
        Write \(s_\star=\psi_r(\M_0)>0\), \(s_1=\psi_1(\M_0)\) and
        \(\kappa=s_1/s_\star\).
        \end{assumption}

        \begin{assumption}
        \label{assum:missing}
        The entries of \(\bOmega\) are independent Bernoulli\((p)\) variables,
        independent of \(\bH\), and \(mp\ge\log^{\alpha_0}m\) for a fixed
        \(\alpha_0>15\) and sufficiently large dimensions. The Gaussian reference
        matrices are independent of the noise conditional on the observed mask.
        \end{assumption}

        Throughout Sections~\ref{sec:4.1}--\ref{sec:4.3}, Assumptions~\ref{assum:noise}--\ref{assum:missing} are in force.

        In the setting of Theorem 4.1, the rank is \(s=r\). Firstly, we focus on the scenario where the rank \(s\) of the estimation space is properly selected, i.e., \(s=r\). In Section~\ref{sec:4.1}, the rank \(s\) of the estimation space is properly selected, i.e., \(s=r\). Assume \(\mu_1\ge\mu_0\), so that \(\M_0\) is feasible, and set \(\bar\mu=\max\{\mu_0,\mu_1\}\).
    proof_body: |-
      ### Definitions and notation used in Proof
      In the proof we write \(\mathcal L(\M;\Y,\bOmega)\) for the same normalized loss \(\mathcal L(\M)\) when displaying its data arguments. Write
      \[
      h=\sigma\sqrt{m/p}.
      \]
      The zero matrix has zero leverage. For any matrix \(A\), \(s_i(A)=\psi_i(A)\) denotes its \(i\)th singular value, in decreasing order. Write
      \[
      \delta_m=(\log m)^{-1}.
      \]
      The reference middle sum is positive on the stated events. Statements about global minimizers assume their existence. Write
      \[
      \bm E(\M)=\Y-P_{\bOmega}(\M).
      \]
      Throughout the rank-constrained proof, write
      \begin{align*}
          \Delta=\M-\M_0,\qquad
          d=\|\Delta\|_F,\qquad
          Q_{\bOmega}(\Delta)=\|P_{\bOmega}(\Delta)\|_F^2,
      \end{align*}
      and let
      \[
          \bar\mu=\max\{\mu_0,\mu_1\}.
      \]
      We work on the high-probability event constructed in the companion's sparse spectral section; in particular,
      \begin{align}
      \label{eq:factor_noise_edge_event}
          \|P_{\bOmega}(\bH)\|
          &\le C\sigma\sqrt{mp},\\
      \label{eq:factor_reference_edge_event}
          \widehat\lambda_1&\le C\sqrt p,\\
      \label{eq:factor_reference_bulk_event}
          \sum_{i=n/3}^{2n/3}\widehat\lambda_i&\ge c n\sqrt p,
      \end{align}
      with probability at least \(1-cn^{-3}\). Constants may depend on the fixed lower bound for \(n/m\). Also let
      \[
      T_{\bOmega}=p^{-1}P_{\bOmega}-\operatorname{Id}.
      \]

      ### Proof
      Work on the intersection of the calibration and sampling events above. Fix \(C_L>0\) and \(\omega_1>0\), and consider a finite-loss candidate \(\M\in \mathbb M_{r,\mu_1}\) satisfying
      \begin{align}
       \mathcal L(\M;\Y,\bOmega)\le C_L\omega_1.
       \label{eq:factor_low_loss_condition}
      \end{align}
      All subsequent bounds hold on this common event, uniformly in the candidate.

      \textit{Observed energy.} We first prove
      \begin{align}
       Q_{\bOmega}(\Delta)
       \le C_{C_L}\sigma\sqrt{rmp}\,d
             +C_{C_L}\frac rn d^2.
       \label{eq:factor_energy_upper}
      \end{align}
      The first weighted singular-value term in the loss and the finite-loss condition displayed above, namely
      \[
      \mathcal L(\M;\Y,\bOmega)\le C_L\omega_1,
      \]
      imply
      \begin{align*}
          \left|
          \frac{\|\bm E(\M)\|}{\sqrt m\widehat\sigma(\M)}
          -\widehat\lambda_1
          \right|
          \le \sqrt{C_Lp}.
      \end{align*}
      Together with the reference-edge event
      \[
      \widehat\lambda_1\le C\sqrt p
      \quad\text{(label eq:factor\_reference\_edge\_event)},
      \]
      we obtain
      \begin{align}
      \label{eq:residual_operator_low_loss}
          \|\bm E(\M)\|
          \le C_{C_L}\widehat\sigma(\M)\sqrt{mp}.
      \end{align}
      Since \(\bm E(\M)=P_{\bOmega}(\bH-\Delta)\), the noise-edge event
      \[
      \|P_{\bOmega}(\bH)\|\le C\sigma\sqrt{mp}
      \quad\text{(label eq:factor\_noise\_edge\_event)}
      \]
      and the residual-operator bound just displayed yield
      \begin{align}
      \label{eq:sampled_delta_operator}
          \|P_{\bOmega}(\Delta)\|
          \le C_{C_L}
          \{\widehat\sigma(\M)+\sigma\}\sqrt{mp}.
      \end{align}
      Because \(\operatorname{rank}(\Delta)\le2r\),
      \begin{align*}
          Q_{\bOmega}(\Delta)
          &=\langle P_{\bOmega}(\Delta),\Delta\rangle
          \le \|P_{\bOmega}(\Delta)\|\,\|\Delta\|_*
          \le \sqrt{2r}\|P_{\bOmega}(\Delta)\|d.
      \end{align*}
      By the calibration event of [ref:R1] under its stated homogeneous-noise and sampling conditions, the uniform scale bound
      \begin{align}
       \left|\frac{\widehat\sigma(\M)}{\sigma}-1\right|
       \le C\log^{-1}m+
       \frac{C\|P_{\bOmega}(\M-\M_0)\|_F}{\sigma\sqrt{mnp}}
       \label{eq:working_scale_bound}
      \end{align}
      holds on the same event simultaneously for all \(\M\in\mathbb R^{m\times n}\). Applying this to the sampled-delta operator bound just displayed gives
      \begin{align*}
          Q_{\bOmega}(\Delta)
          \le C_{C_L}\sigma\sqrt{rmp}\,d
             +C_{C_L}\sqrt{\frac rn}
              Q_{\bOmega}(\Delta)^{1/2}d.
      \end{align*}
      Young's inequality absorbs one half of the last \(Q_{\bOmega}(\Delta)\) term and proves
      \[
       Q_{\bOmega}(\Delta)
       \le C_{C_L}\sigma\sqrt{rmp}\,d
             +C_{C_L}\frac rn d^2
      \quad\text{(label eq:factor\_energy\_upper)}.
      \]

      \textit{Operator localization.} Put \(\beta=\bar\mu r/\sqrt{np}\). We next show that, if \(C_{C_L}\beta\le1/2\),
      \begin{align}
       \|\M-\M_0\|\le C_{C_L}h+C_{C_L}\beta s_1.
       \label{eq:factor_coarse_localization}
      \end{align}
      Let \(N=p^{-1}P_{\bOmega}\bH\), \(\Delta=\M-\M_0\), and \(E_{\bOmega}=T_{\bOmega}\Delta\). On the event of [ref:R2], under its standing sparse sampling condition and \(np\ge C\mu_0r\log m\), the Schur-product sampling bound
      \[
       \|T_{\bOmega}(LR')\|
       \le\Lambda\|L\|_{2,\infty}\|R\|_{2,\infty}
       \label{eq:sampling_schur_bound}
      \]
      holds for all conformable factors, including data-dependent factors. Applying this Schur bound to balanced factorizations of the two endpoints separately gives
      \begin{align}
       \|E_{\bOmega}\|\le C\beta(s_1+\|\Delta\|).
       \label{eq:sampling_endpoint_mask_bound}
      \end{align}
      The residual divided by \(p\) is \(N-\Delta-E_{\bOmega}\). Since \(\rank(\Delta)\le2r\) and \(i\in I\) implies \(i>2r\), the rank perturbation singular-value inequality gives
      \[
      s_i(N-\Delta)\le s_{i-2r}(N)\le\|N\|\le Ch.
      \]
      Weyl's inequality and \(\sum_{i\in I}\widehat\lambda_i/\sqrt p\ge cn\) therefore give
      \[
      \widehat\sigma(\M)\sqrt{m/p}
      =\frac{\sum_{i\in I}s_i\{N-\Delta-E_{\bOmega}\}}
             {\sum_{i\in I}\widehat\lambda_i/\sqrt p}
       \le C(h+\|E_{\bOmega}\|).
      \]
      The first weighted term of the low-loss condition implies
      \[
      \|\bm E(\M)/p\|\le C_{C_L}
      \widehat\sigma(\M)\sqrt{m/p}.
      \]
      Thus
      \[
      \|\Delta\|\le\|N\|+\|E_{\bOmega}\|+
      \|\bm E(\M)/p\|\le C_{C_L}(h+\|E_{\bOmega}\|).
      \]
      Use the sampling endpoint mask bound
      \[
       \|E_{\bOmega}\|\le C\beta(s_1+\|\Delta\|)
       \quad\text{(label eq:sampling\_endpoint\_mask\_bound)}
      \]
      and absorb its last term. This proves
      \[
       \|\M-\M_0\|\le C_{C_L}h+C_{C_L}\beta s_1
       \quad\text{(label eq:factor\_coarse\_localization)}.
      \]

      \textit{Frobenius error and minimizers.} Write \(d=\|\M-\M_0\|_F\) and \(\delta=\|\M-\M_0\|\). The sampling condition makes \(C_{C_L}\beta\le1/2\). If \(h\ge s_1\), the coarse localization bound gives \(\delta\le Ch\), and \(d\le\sqrt{2r}\delta\le C\sqrt r h\) already proves the claim. If \(h<s_1\), the coarse localization bound gives \(\|\M\|\le C_{C_L}s_1\).

      Use the local restricted strong convexity from [ref:R3]. On the event of [ref:R2], simultaneously for every \(\M\in\mathbb M_{r,\mu_1}\) satisfying \(\|\M\|\le C_Ms_1\), with \(\Delta=\M-\M_0\) and \(f=\|\Delta\|_F\), its relative sampling bound holds, and in particular, for fixed \(C_M\), if
      \[
      np\ge C_{C_M}\kappa^2\{\bar\mu r\log m+\bar\mu^2r^2\},
      \]
      then on the same event
      \begin{align}
       \frac p2\|\M-\M_0\|_F^2
       \le\|P_{\bOmega}(\M-\M_0)\|_F^2
       \le\frac{3p}2\|\M-\M_0\|_F^2.
       \label{eq:factor_local_rsc}
      \end{align}
      Use this with the fixed \(C_M\) just obtained and combine it with the energy upper bound
      \[
       Q_{\bOmega}(\Delta)
       \le C_{C_L}\sigma\sqrt{rmp}\,d
             +C_{C_L}\frac rn d^2
      \quad\text{(label eq:factor\_energy\_upper)}:
      \]
      \[
       \frac p2 d^2\le C_{C_L}\sigma\sqrt{rmp}\,d
                          +C_{C_L}\frac r n d^2.
      \]
      Since \(np\ge C_{C_L}r\), absorb the last term and divide by \(pd\) when \(d>0\). This gives \(d\le C_{C_L}\sigma\sqrt{mr/p}\); \(d=0\) is immediate. All events are uniform, so the argument applies to data-dependent candidates.

      Choose, for instance, \(C_L=1\). [ref:R1] shows that, under the homogeneous-noise assumptions and the sampling condition of Lemma~\ref{lem:sparse_coarse_rigidity}, on the calibration event of probability at least \(1-cn^{-3}\),
      \begin{align}
       \mathcal L(\M_0;\Y,\bOmega)&\le C_0\log^{-2}m.
       \label{eq:calibration_true_loss}
      \end{align}
      Since \(\omega_1\gg\log^{-2}m\), for all sufficiently large \(m\),
      \[
       \mathcal L(\widetilde\M;\Y,\bOmega)
          \le \mathcal L(\M_0;\Y,\bOmega)
          \le \omega_1.
      \]
      The uniform bound just proved therefore gives
      \[
          \|\widetilde\M-\M_0\|_F
          \le C\sigma\sqrt{\frac{mr}{p}}
      \]
      with probability at least \(1-cn^{-3}\).

      The same argument also calibrates the working scale at a low-loss candidate. For the minimizer, define
      \begin{align}
       \widehat\sigma_{\rm pil}=\widehat\sigma(\widetilde\M_{\rm fac}).
       \label{eq:nuclear_pilot_definition}
      \end{align}
      Substitution of the Frobenius bound into the energy upper bound
      \[
       Q_{\bOmega}(\Delta)
       \le C_{C_L}\sigma\sqrt{rmp}\,d
             +C_{C_L}\frac rn d^2
      \quad\text{(label eq:factor\_energy\_upper)}
      \]
      gives
      \[
      \|P_{\bOmega}(\widetilde\M_{\rm fac}-\M_0)\|_F^2\le C\sigma^2mr.
      \]
      Hence the uniform scale bound
      \[
       \left|\frac{\widehat\sigma(\M)}{\sigma}-1\right|
       \le C\log^{-1}m+
       \frac{C\|P_{\bOmega}(\M-\M_0)\|_F}{\sigma\sqrt{mnp}}
       \quad\text{(label eq:working\_scale\_bound)}
      \]
      yields
      \begin{align}
       \left|\widehat\sigma_{\rm pil}/\sigma-1\right|
       \le C\{\log^{-1}m+\sqrt{r/(np)}\}.
       \label{eq:nuclear_pilot_consistency}
      \end{align}
      Together with the bound
      \[
      \left|\frac{\widehat\sigma(\M_0)}{\sigma}-1\right|
       \le C\log^{-1}m
      \quad\text{(label eq:supp\_sigma\_consistency)}
      \]
      from the same calibration event, this establishes the pilot event
      \begin{align}
       \mathcal E_{\rm pil}
       =\left\{\frac12\sigma\le\widehat\sigma_{\rm pil}\le\frac32\sigma,
                \quad\frac12\sigma\le\widehat\sigma(\M_0)\le\frac32\sigma\right\}
       \label{eq:nuclear_pilot_event}
      \end{align}
      for sufficiently large dimensions. The same bounds hold for any candidate satisfying the low-loss premise, with constants depending on \(C_L\).

