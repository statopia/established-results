      ##### Lemma~\ref{lem:global_relative_sampling} (Relative sampling for incoherent candidates)
      ###### Definitions and notation
      Let \(m,n\) be positive integers with \(m\ge n\) and \(0<\rho_-\le n/m\le1\). Let \(p\in(0,1]\) be the Bernoulli observation probability, and let \(\bOmega\in\mathbb R^{m\times n}\) be the binary observation mask. The projection \(P_{\bOmega}(\cdot)\) keeps observed entries and sets unobserved entries to zero.

      Let \(\M_0\in\mathbb R^{m\times n}\) be a fixed rank-\(r\) matrix. For any matrix \(A\), write \(s_i(A)=\psi_i(A)\) for its \(i\)th singular value in decreasing order. Write
      \[
      s_1=s_1(\M_0),\qquad s_\star=s_r(\M_0)>0,\qquad \kappa=s_1/s_\star .
      \]
      The singular spaces of \(\M_0\) are \(\mu_0\)-incoherent. For the candidate class, \(\mu_1\) is the leverage/incoherence parameter, and
      \[
      \bar\mu=\max\{\mu_0,\mu_1\}.
      \]
      The class \(\mathbb M_{r,\mu_1}\) is the class of matrices of rank at most \(r\), represented as \(M=LR'\) with \(r\) columns in each factor and projector leverage bounds \(\mu_1r/m,\mu_1r/n\) on their nonzero singular spaces. The zero matrix is included and has zero leverage.

      Let \(J\) denote the \(m\times n\) all-ones matrix, and define
      \[
      W_\Omega=p^{-1}\bOmega-J,\qquad 
      T_\Omega=p^{-1}P_{\bOmega}-\operatorname{Id}.
      \]
      On the event of Lemma~\ref{lem:mask_geometry}, the constants used in the present lemma are
      \[
      \Lambda:=C\sqrt{m/p}
      \]
      from the operator bound \(\|W_\Omega\|\le\Lambda\) in \eqref{eq:sampling_mask_norm}, and
      \[
      \theta=C\sqrt{\frac{\mu_0r\log m}{np}}
      \]
      from the tangent-space sampling bound in \eqref{eq:recovery_tangent-event}. Here \(C\) denotes a sufficiently large numerical constant, and \(C_{C_M}\) denotes a constant depending on \(C_M\).

      For a candidate \(\M\in\mathbb M_{r,\mu_1}\), set
      \[
      \Delta=\M-\M_0,\qquad f=\|\Delta\|_F.
      \]
      The quantity \(a_g\) is defined in the Statement below by
      \[
      a_g=C\kappa\left\{\theta+(1+C_M)\Lambda\frac{\bar\mu r}{\sqrt{mn}}\right\}.
      \]

      ###### Assumptions
      The following source conditions apply.

      \begin{enumerate}
      \item The dimensions satisfy \(m\ge n\), \(0<\rho_-\le n/m\le1\), and \(12r\le n\). The rank-constrained results are stated in the regime of sufficiently large dimensions.

      \item The matrix \(\M_0\in\mathbb R^{m\times n}\) is fixed of rank \(r\), with singular spaces satisfying the \(\mu_0\)-incoherence condition of the homogeneous model. The quantities \(s_1,s_\star,\kappa\) are positive and finite as defined above.

      \item The observation mask \(\bOmega\) has independent Bernoulli\((p)\) entries. The standing sparse sampling condition
      \[
      mp\ge \log^{\alpha_0}m
      \]
      holds for a fixed \(\alpha_0>15\), with sufficiently large dimensions.

      \item The realized mask lies in the event of Lemma~\ref{lem:mask_geometry}. That event is formed under the standing sparse sampling condition and
      \[
      np\ge C\mu_0r\log m,
      \]
      and carries the constants \(\Lambda=C\sqrt{m/p}\) and \(\theta=C\sqrt{\mu_0r\log m/(np)}\) defined above. The present lemma is stated conditionally on this event.

      \item \(C_M\ge1\) is a constant, possibly depending on the dimensions.
      \end{enumerate}

      ###### Statement
      Let \(C_M\ge1\), possibly depending on the dimensions. On the event of Lemma~\ref{lem:mask_geometry}, simultaneously for every
      \[
      \M\in \mathbb M_{r,\mu_1}
      \]
      satisfying
      \[
      \|\M\|\le C_Ms_1,
      \]
      with
      \[
      \Delta=\M-\M_0,\qquad f=\|\Delta\|_F,
      \]
      the following bounds hold:
      \begin{align}
      \left|p^{-1}\|P_{\bOmega}\Delta\|_F^2-f^2\right|
      &\le a_g f^2,
      \label{eq:sampling_global_relative_sampling}\\
      a_g&=C\kappa\left\{\theta+(1+C_M)
                         \Lambda\frac{\bar\mu r}{\sqrt{mn}}\right\}
       \le C_{C_M}\kappa\left\{
            \sqrt{\frac{\bar\mu r\log m}{np}}+
            \frac{\bar\mu r}{\sqrt{np}}\right\}.
       \label{eq:sampling_global_sampling_constant}
      \end{align}
      In particular, for fixed \(C_M\), if
      \begin{align}
      np\ge C_{C_M}\kappa^2\{\bar\mu r\log m+\bar\mu^2r^2\},
      \label{eq:relative_sampling_condition}
      \end{align}
      then, on the same event,
      \begin{align}
      \frac p2\|\M-\M_0\|_F^2
      \le\|P_{\bOmega}(\M-\M_0)\|_F^2
      \le\frac{3p}2\|\M-\M_0\|_F^2.
      \label{eq:factor_local_rsc}
      \end{align}
