      ##### Lemma 5.4 (global Gram-factor inequality)
      ###### Definitions and notation
      For a matrix \(X\), \(\sigma_\ell(X)\) denotes the \(\ell\)-th largest singular value, and \(\|X\|=\sigma_1(X)\) is the operator norm. The distance used is
      \[
      \operatorname{dist}(U,X)
      :=\min_{R\in \mathbb R^{r\times r}:\,R^\top R=I_r}
      \|U-XR\|_F. \tag{3.1}
      \]
      Here \(\|\cdot\|_F\) is the Frobenius norm. The source’s minimization variable is \(R\); in the citation’s \(F,F_0\) notation the corresponding orthogonal variable is written \(O\) with \(O^\top O=I\).

      ###### Assumptions
      The printed lemma is stated for arbitrary matrices \(U,X\in\mathbb R^{n\times r}\) of the displayed dimensions. No incoherence, RIP, rank restriction on \(U\), or additional standing condition is attached to Lemma 5.4 in the supplied source material. The denominator is \(\sigma_r^2(X)\) as printed; no separate condition \(\sigma_r(X)>0\) is printed in the supplied statement.

      ###### Statement
