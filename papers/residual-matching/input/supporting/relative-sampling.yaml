      Let \(C_M\ge1\) be a constant, possibly depending on the dimensions. Then, on the event of Lemma~\ref{lem:mask_geometry}, simultaneously for every
      \[
      M\in \mathbb M_{r,\mu_1}
      \]
      satisfying
      \[
      \|M\|\le C_M s_1,
      \]
      with
      \[
      \Delta=M-M_0,\qquad f=\|\Delta\|_F,
      \]
      the following bounds hold:
      \[
      \left|p^{-1}\|P_{\Omega}\Delta\|_F^2-f^2\right|
      \le a_g f^2,
      \]
      where
      \[
      a_g
      =C\kappa\left\{
      \theta+(1+C_M)\Lambda\frac{\bar\mu r}{\sqrt{mn}}
      \right\}
      \le C_{C_M}\kappa\left\{
      \sqrt{\frac{\bar\mu r\log m}{np}}+
      \frac{\bar\mu r}{\sqrt{np}}
      \right\}.
      \]
      In particular, for fixed \(C_M\), if
      \[
      np\ge C_{C_M}\kappa^2\{\bar\mu r\log m+\bar\mu^2 r^2\},
      \]
      then on the same event,
      \[
      \frac p2\|M-M_0\|_F^2
      \le\|P_{\Omega}(M-M_0)\|_F^2
      \le\frac{3p}2\|M-M_0\|_F^2.
      \]
    assumptions:
      - |-
        Let \(m,n\) be positive integers with \(m\ge n\) and
        \[
        0<\rho_-\le \frac nm\le 1
        \]
        for a fixed constant \(\rho_->0\), and assume \(12r\le n\). Let \(p\in(0,1]\), and let \(\Omega\in\mathbb R^{m\times n}\) be a binary observation mask whose entries are independent Bernoulli\((p)\).

        Let \(M_0\in\mathbb R^{m\times n}\) be a fixed rank-\(r\) matrix with compact SVD \(M_0=U_0D_0V_0'\) and singular spaces that are \(\mu_0\)-incoherent:
        \[
        \|U_0\|_{2,\infty}\le \sqrt{\frac{\mu_0r}{m}},
        \qquad
        \|V_0\|_{2,\infty}\le \sqrt{\frac{\mu_0r}{n}}.
        \]
        Assume \(\mu_1\ge\mu_0\).

        Assume the sparse sampling condition
        \[
        mp\ge \log^{\alpha_0}m
        \]
        for fixed \(\alpha_0>15\) and sufficiently large dimensions, that the realized mask lies in the event of Lemma~\ref{lem:mask_geometry}, and that
