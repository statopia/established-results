        \]
    proof_body: |-
      ### Definitions and notation used in Proof
      Let \(T_\star\) be the fixed tangent space at \(M_0\).

      ### Proof
      Work on the event of [ref:R1]; in particular, the bounds involving \(\theta\) and \(\Lambda\) stated there are available and uniform over the factors.

      Take balanced factors \(M=XY'\) and \(M_0=X_0Y_0'\), padding the first pair with zero columns when its rank is smaller than \(r\). A common orthogonal rotation of \(X,Y\) can be chosen so that, with
      \[
      E_X=X-X_0,\qquad E_Y=Y-Y_0,
      \]
      we have
      \[
       \|E_X\|_F^2+\|E_Y\|_F^2
       \le\frac{f^2}{(\sqrt2-1)s_\star}.
      \]
      To prove this inequality, for \(\operatorname{Dil}(M)=\left(\begin{smallmatrix}0&M\\M'&0\end{smallmatrix}\right)\) and \(F=(X',Y')'\), balancedness gives
      \[
      FF'=|\operatorname{Dil}(M)|+\operatorname{Dil}(M).
      \]
      For any symmetric \(A,B\), expansion in their eigenbases shows
      \[
       \||A|-|B|\|_F^2
       =\sum_{ij}(|a_i|-|b_j|)^2|\langle u_i,v_j\rangle|^2
       \le\sum_{ij}(a_i-b_j)^2|\langle u_i,v_j\rangle|^2
       =\|A-B\|_F^2.
      \]
      The diagonal and off-diagonal blocks of the balanced lift are orthogonal, so
      \[
      \|FF'-F_0F_0'\|_F^2\le4f^2.
      \]
      Apply the global Gram-factor inequality [ref:R2]
      \[
       \min_{O'O=I}\|FO-F_0\|_F^2
       \le\frac{\|FF'-F_0F_0'\|_F^2}
       {2(\sqrt2-1)\sigma_r(F_0)^2},
       \qquad \sigma_r(F_0)^2=2s_\star,
      \]
      which proves
      \[
       \|E_X\|_F^2+\|E_Y\|_F^2
       \le\frac{f^2}{(\sqrt2-1)s_\star}.
      \]

      Let
      \[
      b_L=\sqrt{\bar\mu r/m},\qquad b_R=\sqrt{\bar\mu r/n}.
      \]
      Balancedness, endpoint incoherence, and the operator norm bound imply
      \[
       \|X_0\|_{2,\infty}+\|E_X\|_{2,\infty}\le C_{C_M}\sqrt{s_1}\,b_L,
      \]
      \[
       \|Y_0\|_{2,\infty}+\|E_Y\|_{2,\infty}\le C_{C_M}\sqrt{s_1}\,b_R.
      \]
      Write
      \[
      \Delta_T=X_0E_Y'+E_XY_0'\in T_\star,
      \qquad
      \Delta_Q=E_XE_Y'.
      \]
      By the factor-distance inequality,
      \[
      \|\Delta_T\|_F+\|\Delta_Q\|_F\le C_{C_M}\sqrt\kappa f.
      \]
      For the quadratic term use
      \[
      \|E_X\|\le(1+\sqrt{C_M})\sqrt{s_1}.
      \]
      More specifically,
      \[
      \|\Delta_T\|_F\le C\sqrt\kappa f
      \]
      independently of \(C_M\). The tangent--tangent form is therefore at most
      \[
      C\kappa\theta f^2.
      \]
      For the two tangent--quadratic forms use, respectively,
      \[
      \Lambda\|X_0\|_{2,\infty}\|E_X\|_F\|E_Y\|_F\|E_Y\|_{2,\infty},
      \]
      and
      \[
      \Lambda\|E_X\|_F\|E_X\|_{2,\infty}\|Y_0\|_{2,\infty}\|E_Y\|_F.
      \]
      Each is at most
      \[
      C_{C_M}\Lambda\kappa b_Lb_R f^2.
      \]
      The quadratic--quadratic form is bounded by
      \[
       \Lambda\|E_X\|_F\|E_X\|_{2,\infty}
       \|E_Y\|_F\|E_Y\|_{2,\infty},
      \]
      with the same upper bound. Each row-norm product introduces at most
      \[
      (1+\sqrt{C_M})^2\le2(1+C_M).
      \]
      The tangent--tangent bound is independent of \(C_M\). Adding the four forms proves
      \[
       \left|p^{-1}\|P_{\Omega}\Delta\|_F^2-f^2\right|
       \le a_g f^2,
      \]
      where
      \[
      a_g=C\kappa\left\{\theta+(1+C_M)
                         \Lambda\frac{\bar\mu r}{\sqrt{mn}}\right\}
       \le C_{C_M}\kappa\left\{
            \sqrt{\frac{\bar\mu r\log m}{np}}+
            \frac{\bar\mu r}{\sqrt{np}}\right\}.
      \]
      Choosing the constant in
      \[
       np\ge C_{C_M}\kappa^2\{\bar\mu r\log m+\bar\mu^2r^2\}
      \]
      so that \(a_g\le1/2\) gives
      \[
       \frac p2\|M-M_0\|_F^2
       \le\|P_{\Omega}(M-M_0)\|_F^2
       \le\frac{3p}2\|M-M_0\|_F^2.
      \]

      ### References
      #### Reference R1
      Target: Lemma~\ref{lem:mask_geometry} (Uniform Bernoulli sampling bounds)

      Citation: Let \(J\) denote the \(m\times n\) all-ones matrix, and put \(W_\Omega=p^{-1}\bOmega-J\) and \(T_\Omega=p^{-1}P_{\bOmega}-\operatorname{Id}\). Under the standing sparse sampling condition and \(np\ge C\mu_0r\log m\), with probability at least \(1-cn^{-4}\),
      \[
      \|W_\Omega\|\le\Lambda:=C\sqrt{m/p},
      \]
      \[
      |\langle T_\Omega A,B\rangle|
       \le\theta\|A\|_F\|B\|_F,\qquad A,B\in T_\star,
       \quad\theta=C\sqrt{\frac{\mu_0r\log m}{np}}.
      \]
      On this event,
      \[
      |\langle T_\Omega(AB'),CD'\rangle|
       \le\Lambda b(A,C)b(B,D),
       \quad b(A,C)=\min\{\|A\|_F\|C\|_{2,\infty},
                                  \|A\|_{2,\infty}\|C\|_F\},
      \]
      and
      \[
      \|T_\Omega(LR')\|
       \le\Lambda\|L\|_{2,\infty}\|R\|_{2,\infty}.
      \]
      In the proof of Lemma~\ref{lem:global_relative_sampling}, the tangent--tangent form is therefore at most \(C\kappa\theta f^2\), and the two tangent--quadratic forms use \(\Lambda\), with each bounded by \(C_{C_M}\Lambda\kappa b_Lb_R f^2\).

