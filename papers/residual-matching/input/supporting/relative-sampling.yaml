      ##### Content basis
      Source extraction from D1 (Ziyuan Chen and Fang Yao, supplement to “Residual spectral matching: a new perspective for matrix completion”), Section 3, Section 3.1 “Uniform sampling bounds,” Lemma \ref{lem:mask_geometry}. The named result supplies the mask event and the estimates for \(W_\Omega\), for the tangent--tangent form on \(T_\star\), for the bilinear form, and for the Schur product that the target proof invokes. The later use in the target proof of the global Gram-factor inequality \citep[Lemma~5.4]{tu2016procrustes} is an external citation (Reference R2 here), not part of this source lemma. No additional independently stated result from the supplied D1 passage is organized under this item.

      ##### Lemma \ref{lem:mask_geometry} (Uniform Bernoulli sampling bounds)
      ###### Definitions and notation
      Let \(m,n\) be positive integers. Let \(J\) denote the \(m\times n\) all-ones matrix. Let \(\bOmega\) be the binary observation mask, so that \(P_{\bOmega}\) keeps observed entries and zeroes unobserved entries. Put
      \[
      W_\Omega=p^{-1}\bOmega-J,
      \qquad
      T_\Omega=p^{-1}P_{\bOmega}-\operatorname{Id}.
      \]
      Let \(M_0\in\mathbb R^{m\times n}\) be a fixed rank-\(r\) matrix with compact SVD \(M_0=U_0D_0V_0'\) and singular spaces that are \(\mu_0\)-incoherent:
      \[
      \|U_0\|_{2,\infty}\le \sqrt{\frac{\mu_0r}{m}},
      \qquad
      \|V_0\|_{2,\infty}\le \sqrt{\frac{\mu_0r}{n}}.
      \]
      Here \(\|M\|\) is the spectral norm, \(\|M\|_F\) is the Frobenius norm, and \(\|M\|_{2,\infty}\) is the largest Euclidean row norm. For a matrix \(A\), \(s_i(A)=\psi_i(A)\) denotes its \(i\)th singular value in decreasing order. Write
      \[
      s_\star=s_r(M_0)>0,\qquad s_1=s_1(M_0),\qquad \kappa=s_1/s_\star.
      \]
      Let \(T_\star\) be the fixed tangent space at \(M_0\). For matrices \(A,C\) of compatible dimensions, define
      \[
      b(A,C)=\min\{\|A\|_F\|C\|_{2,\infty},
      \|A\|_{2,\infty}\|C\|_F\}.
      \]
      The constants \(C,c\) are numerical and may depend on the fixed lower bound for \(n/m\).

      ###### Assumptions
      The homogeneous model has \(m\ge n\) and
      \[
      0<\rho_-\le \frac nm\le 1
      \]
      for a fixed constant \(\rho_->0\). The entries of \(\bOmega\) are independent Bernoulli\((p)\), \(p\in(0,1]\), and the singular spaces of \(M_0\) are \(\mu_0\)-incoherent. We assume \(12r\le n\) throughout the rank-constrained results.

      The standing sparse sampling condition is
      \[
      mp\ge \log^{\alpha_0}m
      \]
      for fixed \(\alpha_0>15\) and sufficiently large dimensions. In addition,
      \[
      np\ge C\mu_0r\log m.
      \]

      ###### Statement
      Under the standing sparse sampling condition and \(np\ge C\mu_0r\log m\), with probability at least \(1-cn^{-4}\),
      \[
      \|W_\Omega\|\le\Lambda:=C\sqrt{m/p},
      \label{eq:sampling_mask_norm}
      \]
      \[
      |\langle T_\Omega A,B\rangle|
      \le\theta\|A\|_F\|B\|_F,\qquad A,B\in T_\star,
      \quad\theta=C\sqrt{\frac{\mu_0r\log m}{np}},
      \label{eq:recovery_tangent-event}
      \]
      where \(T_\star\) is the fixed tangent space at \(M_0\).

      On this event the following hold for all conformable factors, including data-dependent factors:
      \[
      |\langle T_\Omega(AB'),CD'\rangle|
      \le\Lambda b(A,C)b(B,D),
      \quad b(A,C)=\min\{\|A\|_F\|C\|_{2,\infty},
      \|A\|_{2,\infty}\|C\|_F\},
      \label{eq:recovery_bilinear-event}
      \]
      \[
      \|T_\Omega(LR')\|
      \le\Lambda\|L\|_{2,\infty}\|R\|_{2,\infty}.
      \label{eq:sampling_schur_bound}
      \]
      The two pairs of factors in the bilinear inequality may have different numbers of columns.

      #### Reference R2
      Target: Lemma~5.4 (global Gram-factor inequality)

      Citation: Apply the global Gram-factor inequality \citep[Lemma~5.4]{tu2016procrustes}
      \[
       \min_{O'O=I}\|FO-F_0\|_F^2
       \le\frac{\|FF'-F_0F_0'\|_F^2}
       {2(\sqrt2-1)\sigma_r(F_0)^2},
       \qquad
       \sigma_r(F_0)^2=2s_\star,
      \]
      which proves \(\|E_X\|_F^2+\|E_Y\|_F^2\le f^2/\{(\sqrt2-1)s_\star\}\).

