      Source extraction from Tropp, arXiv:1004.4389v7 (`tropp2012userfriendly`), “User-friendly tail bounds for sums of random matrices.” The supplied material gives the self-adjoint bounded matrix Bernstein statement as Theorem 1.4 and again, with the expanded inequality chain, as Theorem 6.1; it also gives the rectangular two-sided norm version as Theorem 1.6. The R2 citation applies matrix Bernstein to the self-adjoint operators \(z_{ij}\otimes z_{ij}\); the self-adjoint bounded statements supply the required tail inequality, while the rectangular Theorem 1.6 supplies a directly two-sided operator-norm tail bound. The dimension factor and summand/variance bounds are used as in the Citation, with constants absorbed there. A full bibliographic entry for `tropp2012userfriendly` was not supplied; the source basis is the arXiv version above. No proof is reproduced.

      ##### Theorem 1.4 (Matrix Bernstein)
      ###### Definitions and notation
      For a self-adjoint matrix, \(\lambda_{\max}\) denotes the algebraic maximum eigenvalue. The symbol \(\|\cdot\|\) denotes the spectral operator norm, i.e. the maximum singular value. “s.a.” abbreviates self-adjoint. \(\mathbb E\) denotes expectation, and “almost surely” means with probability one. For a finite sequence of random s.a. matrices, the variance parameter is
      \[
      \sigma^2:=\left\|\sum_k \mathbb E\,(X_k^2)\right\|.
      \]
      The dimension of the random s.a. matrices is \(d\); \(R\) is the uniform almost-sure eigenvalue bound; \(t\ge 0\) is the tail parameter.

      ###### Assumptions
      Let \(\{X_k\}\) be a finite sequence of independent, random, self-adjoint matrices with dimension \(d\). Assume that each random matrix satisfies
      \[
      \mathbb E\,X_k=\mathbf 0
      \qquad\text{and}\qquad
      \lambda_{\max}(X_k)\le R
      \quad\text{almost surely.}
      \]

      ###### Statement
      For all \(t\ge 0\),
      \[
      \mathbb P\left\{\lambda_{\max}\left(\sum_k X_k\right)\ge t\right\}
      \le d\cdot \exp\left(\frac{-t^2/2}{\sigma^2+Rt/3}\right),
      \]
      where
      \[
      \sigma^2:=\left\|\sum_k \mathbb E\,(X_k^2)\right\|.
      \]

      ##### Theorem 6.1 (Matrix Bernstein: Bounded Case)
      ###### Definitions and notation
      For a self-adjoint matrix, \(\lambda_{\max}\) denotes the algebraic maximum eigenvalue. The symbol \(\|\cdot\|\) denotes the spectral operator norm. “s.a.” abbreviates self-adjoint. \(\mathbb E\) denotes expectation, and “almost surely” means with probability one. The function \(h\) is
      \[
      h(u):=(1+u)\log(1+u)-u
      \qquad\text{for }u\ge 0.
      \]
      For a finite sequence of random s.a. matrices, the variance parameter is
      \[
      \sigma^2:=\left\|\sum_k \mathbb E\,(X_k^2)\right\|.
      \]
      The dimension is \(d\); \(R\) is the uniform almost-sure eigenvalue bound; \(t\ge 0\).

      ###### Assumptions
      Let \(\{X_k\}\) be a finite sequence of independent, random, self-adjoint matrices with dimension \(d\). Assume that
      \[
      \mathbb E\,X_k=\mathbf 0
      \qquad\text{and}\qquad
      \lambda_{\max}(X_k)\le R
      \quad\text{almost surely}
      \]
      for each \(k\).

      ###### Statement
      Define
      \[
      \sigma^2:=\left\|\sum_k \mathbb E\,(X_k^2)\right\|.
      \]
      Then for all \(t\ge 0\),
      \[
      \begin{aligned}
      \mathbb P\left\{\lambda_{\max}\left(\sum_k X_k\right)\ge t\right\}
      &\le d\cdot \exp\left(-\frac{\sigma^2}{R^2}\cdot h\left(\frac{Rt}{\sigma^2}\right)\right)\\
      &\le d\cdot \exp\left(\frac{-t^2/2}{\sigma^2+Rt/3}\right)\\
      &\le
      \begin{cases}
      d\cdot \exp(-3t^2/8\sigma^2), & \text{for } t\le \sigma^2/R,\\[2pt]
      d\cdot \exp(-3t/8R), & \text{for } t\ge \sigma^2/R,
      \end{cases}
      \end{aligned}
      \]
      where \(h(u):=(1+u)\log(1+u)-u\) for \(u\ge 0\).

      ##### Theorem 1.6 (Matrix Bernstein: Rectangular Case)
      ###### Definitions and notation
      The symbol \(\|\cdot\|\) denotes the spectral operator norm. \(Z_k^*\) denotes the conjugate transpose of \(Z_k\). \(\mathbb E\) denotes expectation, and “almost surely” means with probability one. The random matrices have dimensions \(d_1\times d_2\). \(R\) is the uniform almost-sure norm bound. The variance parameter is
      \[
      \sigma^2:=
      \max\left\{
      \left\|\sum_k \mathbb E\,(Z_kZ_k^*)\right\|,
      \left\|\sum_k \mathbb E\,(Z_k^*Z_k)\right\|
      \right\}.
      \]
      The dimension factor is \(d_1+d_2\); \(t\ge 0\).

      ###### Assumptions
      Let \(\{Z_k\}\) be a finite sequence of independent, random matrices with dimensions \(d_1\times d_2\). Assume that each random matrix satisfies
      \[
      \mathbb E\,Z_k=\mathbf 0
      \qquad\text{and}\qquad
      \|Z_k\|\le R
      \quad\text{almost surely.}
      \]

      ###### Statement
      Define
      \[
      \sigma^2:=
      \max\left\{
      \left\|\sum_k \mathbb E\,(Z_kZ_k^*)\right\|,
      \left\|\sum_k \mathbb E\,(Z_k^*Z_k)\right\|
      \right\}.
      \]
      Then for all \(t\ge 0\),
      \[
      \mathbb P\left\{\left\|\sum_k Z_k\right\|\ge t\right\}
      \le (d_1+d_2)\cdot
      \exp\left(\frac{-t^2/2}{\sigma^2+Rt/3}\right).
      \]
