      4. Potentially omitted definitions and side conditions. The target block is stated under noise assumptions \(H_{ij}\) independent, mean zero, variance \(\sigma^2>0\), sub-exponential with fixed \(K_H\), and \(\Omega\) independent of \(H\). However, none of \(H,\sigma,K_H\) appears in the displayed mask inequalities or in the proof of the mask-geometry lemma; the probability is over \(\Omega\). If the target theorem is formalized with those hypotheses included for source fidelity, they should remain unused side hypotheses rather than entering the event or the constants. The standing assumptions give \(m,n>0\), \(m\ge n\), \(0<\rho_-\le n/m\le1\), \(M_0\) fixed rank \(r\), \(\mu_0\)-incoherence of \(U_0,V_0\), and \(12r\le n\). The source does not explicitly state a range for \(r\) (such as \(r>0\)) or for \(\mu_0\) beyond the incoherence inequalities; do not add \(\mu_0\ge1\) or \(r>0\) unless supplied by the main paper’s conventions. Bernoulli \(p\) is implicitly in \([0,1]\); the sampling condition forces \(p>0\) for large \(m\), and the proof explicitly notes the \(p=1\) case has zero centered matrix. “Sufficiently large dimensions” is not quantified. The high-probability event should be understood as the simultaneous event for the two displayed probabilistic bounds \( \|W_\Omega\|\le\Lambda\) and the \(T_\star\)-restricted tangent bound; the bilinear and Schur inequalities are additional pointwise conclusions on that same event, not independent probability claims. The source does not define the inner product explicitly, the tensor notation \(z\otimes z\), the ambient dimensions in \(e_i e_j'\), or the identity dimension \(I\) in the proof formula for the Schur product; these are proof-local/contextual and should be fixed consistently from the displayed dimensions rather than treated as source facts with supplied conventions. Finally, cited universal results R1 and R2 retain their own hypotheses and quantification; the target’s specialized Bernoulli/matrix-Bernstein applications do not narrow those theorems.
