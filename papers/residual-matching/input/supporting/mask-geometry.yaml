      Formalization clarifications from source and proof:
      1. Constants. The owner of the concrete bounds is the target “Uniform Bernoulli sampling bounds” lemma (supp.tex Lemma \ref{lem:mask_geometry}). Explicitly, the lemma says “The constants \(C,c\) are numerical and may depend on the fixed lower bound for \(n/m\).” Thus \(C\) in \(\Lambda=C\sqrt{m/p}\), \(C\) in \(\theta=C\sqrt{\mu_0r\log m/(np)}\), \(c\) in \(1-cn^{-4}\), and the \(C\) in the sampling hypotheses are generic numerical constants; the source does not state that occurrences of \(C\) across different displays are equal, and it does not specify their numerical values. It explicitly allows dependence on the fixed \(\rho_-\le n/m\); it does not specify further dependence on \(\alpha_0,K_H,\mu_0,r,p,m,n\) or on the realized mask. Do not silently make these constants depend on \(\Omega\), on the tested factors \(A,B,L,R\), or on \(H\). The source’s proof uses only \(\Omega,M_0\), so the displayed mask inequalities have no \(H\)-dependence (proof-based inference from the proof: “For the centered Bernoulli matrix divided by \(\sqrt{mp}}\)…” and the matrix Bernstein application to \(\Omega_{ij}/p-1\)). The intended order is: fix the fixed parameters, including the lower bound for \(n/m\) and \(\alpha_0>15\), take sufficiently large dimensions with \(m\ge n\), \(0<\rho_-\le n/m\le1\), \(12r\le n\), and the displayed sampling conditions, then choose numerical \(C,c\), allowed to depend on the fixed ratio lower bound, so that for every fixed \(M_0\) with the stated \(\mu_0\)-incoherence and every Bernoulli mask, the event has probability at least \(1-cn^{-4}\). The source is asymptotic (“sufficiently large dimensions”) and does not spell out a formal quantifier string for \(r,\mu_0\) as functions of \(m,n\); do not add uniformity assumptions not stated. The probability statement is over the mask \(\Omega\) only (“The probability statement is over the observation mask \(\Omega\)”), not over \(H\). On the event, the factor inequalities are uniform over all conformable factors, “including data-dependent factors”; this uniformity is pointwise on the event and requires no independence of those factors from \(\Omega\).

      2. Norms and mathematical objects. Explicitly, \(\|X\|\) is the spectral/operator norm, \(\|X\|_F\) the unnormalized Frobenius norm \(\bigl(\sum_{ij}X_{ij}^2\bigr)^{1/2}\), and \(\|X\|_{2,\infty}\) is “the largest \(L_2\) norm of the rows,” i.e. \(\max_i(\sum_j X_{ij}^2)^{1/2}\), not a column norm, mixed \((2,1)\)-norm, or normalized norm. \(\Omega\) is a binary \(m\times n\) mask, \(P_\Omega\) preserves observed entries and zeroes the rest, \(J\) is the all-ones \(m\times n\) matrix, and \(\operatorname{Id}\) is the identity operator on the ambient matrix space. The target definitions are \(W_\Omega=p^{-1}\Omega-J\) and \(T_\Omega=p^{-1}P_\Omega-\operatorname{Id}\). The latter is a linear operator on matrices; in matrix-coordinate form it acts entrywise as \(T_\Omega(A)=W_\Omega\odot A\) with the Schur product (proof-based inference from the Schur identity “\(W_\Omega\odot(LR')=D_L'(W_\Omega\otimes I)D_R\)” and the definition of \(T_\Omega\)); do not replace \(T_\Omega\) by ordinary matrix multiplication by \(W_\Omega\). The angle bracket \(\langle\cdot,\cdot\rangle\) is not defined in the selected block itself, but the proof pairs matrices “through \(W_\Omega\)” and uses Frobenius norms, so the intended pairing is the unnormalized Frobenius/Hilbert–Schmidt inner product on real matrices; this is proof-based rather than explicitly declared in the target block. The tangent space is fixed at \(M_0\). For a compact SVD \(M_0=U_0\Sigma_0V_0'\), the source writes
      \(T_\star=\{U_0A'+BV_0':A\in\mathbb R^{n\times r},B\in\mathbb R^{m\times r}\}\);
      note the dimensions of \(A,B\), and do not swap them. \(P_{T_\star}\) is the orthogonal projection onto this subspace for the Frobenius pairing, and \(\mathcal I_{T_\star}\) is the identity operator on it. In the proof notation \(z_{ij}=P_{T_\star}(e_ie_j')\), the source suppresses that \(e_i\) must be an \(m\)-basis vector and \(e_j\) an \(n\)-basis vector for the product \(e_ie_j'\) to be \(m\times n\); this is proof-based/contextual, not spelled out in the selected definitions. The notation \(z_{ij}\otimes z_{ij}\) and the identity \(\sum_{ij}z_{ij}\otimes z_{ij}=\mathcal I_{T_\star}\) are also not expanded; in context this is a self-adjoint operator/tensor notation on \(T_\star\), not an ambient Kronecker matrix identity to be guessed. The target \(b(A,C)\) is exactly
      \(\min\{\|A\|_F\|C\|_{2,\infty},\|A\|_{2,\infty}\|C\|_F\}\), with unsquared row and Frobenius norms; it is used for conformable factors with compatible row dimensions, and the source explicitly says the two factor pairs in the bilinear inequality may have different numbers of columns. No rank or incoherence restriction on \(A,B,C,D,L,R\) is imposed in these factor consequences beyond conformability. The norm bounds themselves are: \(\|W_\Omega\|\) is the spectral norm of the rectangular centered mask and \(\Lambda=C\sqrt{m/p}\), not a Frobenius or normalized \(1/\sqrt{mp}\) norm; the tangent bound is an operator-norm bound for \(T_\Omega\) restricted to \(T_\star\); and the Schur bound is a spectral norm of the matrix \(T_\Omega(LR')\).

      3. Asymptotics and cited tools. The target statement uses no \(O,o\) notation; it asserts simultaneous inequalities on an event of probability at least \(1-cn^{-4}\), under the sampling conditions “\(mp\ge\log^{\alpha_0}m\)” for fixed \(\alpha_0>15\) and sufficiently large dimensions, and “\(np\ge C\mu_0r\log m\).” The exponent \(n^{-4}\) is literal in the statement; the proof says the bounds hold “on this event” and the bilinear/Schur conclusions are deterministic consequences of the \(W_\Omega\)-bound and the tangent bound. The source does not spell out the exact union-bound constants combining the two probabilistic ingredients; that detail is left implicit. For external R1, the owner is Corollary 2.7 of Brailovskaya et al., edge universality: for self-adjoint random matrices \(X\) and covariance-matched Gaussian \(G\), with universal \(C\), \( \mathbf P[|\lambda_{\max}(X)-\lambda_{\max}(G)|>C\varepsilon(t)]\le de^{-t}\), the analogous expectation statement, and the same bounds for \(\|X\|,\|G\|\); its constants are universal in that theorem, and its assumptions include independent zero-mean self-adjoint summands with bounded \(R(X)\). The target proof applies this “bounded-summand edge comparison” with \(t=C\log n\) after its own parameter calculation for the centered Bernoulli matrix. The specific Bernoulli norm estimate and the phrase “bounded-summand edge comparison” are downstream application/context, not part of the displayed Corollary 2.7 (source note under R1); do not restrict the cited universal theorem to the target’s Bernoulli application. For external R2, the owner is Tropp’s matrix Bernstein inequalities, with universal constants: the self-adjoint bounded statements Theorems 1.4/6.1 use dimension \(d\), uniform almost-sure eigenvalue bound \(R\), variance parameter \(\sigma^2\), and tail parameter \(t\); the rectangular statement Theorem 1.6 gives a two-sided operator norm bound with dimension factor \(d_1+d_2\). In the target proof the summands