    latex_statement: |-
      For a matrix \(X\), \(\|X\|\) denotes the spectral norm, \(\|X\|_F\) the Frobenius norm, and \(\|X\|_{2,\infty}\) the largest \(L_2\) norm of the rows. \(X'\) denotes the transpose. For a binary mask \(\Omega\), \(P_\Omega\) preserves entries indexed by \(\Omega\) and zeroes the rest; \(J\) is the all-ones matrix and \(\operatorname{Id}\) is the identity operator. In the homogeneous model \(Y=P_\Omega(M_0+H)\), \(H\) denotes the noise. Define
      \[
      W_\Omega=p^{-1}\Omega-J,
      \qquad
      T_\Omega=p^{-1}P_\Omega-\operatorname{Id}.
      \]
      Let \(T_\star\) be the fixed tangent space at \(M_0\); when \(M_0=U_0\Sigma_0V_0'\) is a compact SVD, this is
      \[
      T_\star=\left\{ U_0A'+BV_0':\ A\in\mathbb R^{n\times r},\ B\in\mathbb R^{m\times r}\right\}.
      \]
      For conformable matrices, set
      \[
      b(A,C)=\min\left\{\|A\|_F\|C\|_{2,\infty},
      \|A\|_{2,\infty}\|C\|_F\right\}.
      \]

