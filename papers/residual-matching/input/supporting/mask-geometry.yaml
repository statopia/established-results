      Source extraction: The supplied v3 source contains **Corollary 2.7 (Edge universality)** on physical PDF page 12, with the Section 2.1 model and parameters on pages 8–10 and the \(\varepsilon(t)\) formula from Theorem 2.6 on page 11. The statement below is the original Corollary 2.7. The phrase “bounded-summand edge comparison” and the Bernoulli-matrix norm estimate quoted in Reference R1’s Citation are downstream application/context material; they are not part of the displayed Corollary 2.7 in the supplied source. The supplied v2 material does not contain a visible Corollary 2.7. No alternate bounded-summand Corollary 2.7 was supplied.

      ##### Definitions and notation
      For a matrix or operator \(X\), \(\|X\|\) denotes its operator norm, and \(\operatorname{sp}(X)\) its spectrum. Let \(\mathbf E\) and \(\mathbf P\) denote expectation and probability. The general model is
      \[
      X:=Z_0+\sum_{i=1}^n Z_i. \tag{2.1}
      \]
      The covariance matrix of the entries of \(X\) is
      \[
      \operatorname{Cov}(X)_{ij,k\ell}
      :=\mathbf E\bigl[(X-\mathbf E X)_{ij}\overline{(X-\mathbf E X)_{k\ell}}\bigr]. \tag{2.2}
      \]
      The Gaussian model \(G\) is the \(d\times d\) self-adjoint random matrix such that:
      1. \(\{\operatorname{Re}G_{ij},\operatorname{Im}G_{ij}:i,j\in[d]\}\) are jointly Gaussian;
      2. \(\mathbf E[G]=\mathbf E[X]\) and \(\operatorname{Cov}(G)=\operatorname{Cov}(X)\).

      The matrix parameters used in the statement are
      \[
      \sigma(X):=\left\|\mathbf E[(X-\mathbf E X)^2]\right\|^{\frac12}, \tag{2.3}
      \]
      \[
      \sigma_*(X):=\sup_{\|v\|=\|w\|=1}
      \mathbf E\left[|\langle v,(X-\mathbf E X)w\rangle|^2\right]^{\frac12}, \tag{2.4}
      \]
      \[
      R(X):=\left\|\max_{1\le i\le n}\|Z_i\|\right\|_\infty, \tag{2.6}
      \]
      where \(\|Y\|_\infty\) denotes the essential supremum of the random variable \(|Y|\).

      The upper spectral edge is
      \[
      \lambda_{\max}(X):=\sup\operatorname{sp}(X).
      \]
      The function \(\varepsilon(t)\), as defined in Theorem 2.6 and referenced by Corollary 2.7, is
      \[
      \varepsilon(t)
      =\sigma_*(X)t^{\frac12}
      +R(X)^{\frac13}\sigma(X)^{\frac23}t^{\frac23}
      +R(X)t.
      \]
      The order notation \(a\lesssim b\) denotes \(a\le Cb\) for a universal constant \(C\).

      ##### Assumptions
      Let \(d\ge2\) and \(n\in\mathbb N\). Let \(Z_0\in \mathrm M_d(\mathbb C)_{\mathrm{sa}}\) be a deterministic \(d\times d\) self-adjoint matrix. Let \(Z_1,\dots,Z_n\) be independent \(d\times d\) self-adjoint random matrices with zero mean \(\mathbf E[Z_i]=0\) and complex-valued entries. Define
      \[
      X:=Z_0+\sum_{i=1}^n Z_i. \tag{2.1}
      \]
      Let \(G\) be the covariance-matched Gaussian model with the same mean and covariance as \(X\), in the sense of (2.2). Assume \(R(X)<\infty\); the source states that the results are meaningful only when \(R(X)<\infty\), which requires that the matrices \(Z_i\) are uniformly bounded. Let \(t\ge0\).

      ##### Statement
      **Corollary 2.7 (Edge universality).** For any \(t\ge0\), we have
      \[
      \mathbf P\bigl[|\lambda_{\max}(X)-\lambda_{\max}(G)|>C\varepsilon(t)\bigr]\le de^{-t},
      \]
      as well as
      \[
      \mathbf P\bigl[|\lambda_{\max}(X)-\mathbf E\lambda_{\max}(G)|>C\varepsilon(t)\bigr]\le de^{-t},
      \]
      where \(C\) is a universal constant and \(\varepsilon(t)\) is as in Theorem 2.6. Moreover,
      \[
      |\mathbf E\lambda_{\max}(X)-\mathbf E\lambda_{\max}(G)|
      \lesssim \sigma_*(X)(\log d)^{\frac12}
      +R(X)^{\frac13}\sigma(X)^{\frac23}(\log d)^{\frac23}
      +R(X)\log d.
      \]
      The same bounds hold if \(\lambda_{\max}(X),\lambda_{\max}(G)\) are replaced by \(\|X\|,\|G\|\), respectively.

      #### Reference R2
      Target: matrix Bernstein
      Citation: For \eqref{eq:recovery_tangent-event}, let \(z_{ij}=P_{T_\star}(e_ie_j')\). Then \(\|z_{ij}\|_F^2\le\mu_0r/m+\mu_0r/n\) and \(\sum_{ij}z_{ij}\otimes z_{ij}=\mathcal I_{T_\star}\). Apply matrix Bernstein \citep{tropp2012userfriendly} to \(\sum_{ij}(\Omega_{ij}/p-1)z_{ij}\otimes z_{ij}\). Its summand and variance bounds are \(C\mu_0r/(np)\), and its dimension is at most \(r(m+n)\). The resulting bound is the displayed \(\theta\) plus \(C\mu_0r\log m/(np)\), which is absorbed by \(\theta\).
