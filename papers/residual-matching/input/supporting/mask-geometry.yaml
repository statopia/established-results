      Under these assumptions, with probability at least \(1-cn^{-4}\), the following bounds hold simultaneously:
      \[
      \|W_\Omega\|\le \Lambda:=C\sqrt{\frac mp},
      \]
      and
      \[
      |\langle T_\Omega A,B\rangle|
      \le \theta\|A\|_F\|B\|_F,
      \qquad A,B\in T_\star,
      \]
      where
      \[
      \theta=C\sqrt{\frac{\mu_0r\log m}{np}}.
      \]
      On this event, the following hold for all conformable factors, including data-dependent factors:
      \[
      |\langle T_\Omega(AB'),CD'\rangle|
      \le \Lambda\, b(A,C)b(B,D),
      \]
      where
      \[
      b(A,C)=\min\left\{\|A\|_F\|C\|_{2,\infty},
      \|A\|_{2,\infty}\|C\|_F\right\},
      \]
      and
      \[
      \|T_\Omega(LR')\|
      \le \Lambda\|L\|_{2,\infty}\|R\|_{2,\infty}.
      \]
      The two pairs of factors in the bilinear inequality may have different numbers of columns. The constants \(C,c\) are numerical and may depend on the fixed lower bound for \(n/m\). The probability statement is over the observation mask \(\Omega\).
    assumptions:
      - |-
        Let \(m,n\) be positive integers with \(m\ge n\) and
        \[
        0<\rho_-\le \frac nm\le 1
        \]
        for a fixed constant \(\rho_->0\). Let \(M_0\in\mathbb R^{m\times n}\) be a fixed rank-\(r\) matrix, and let \(\Omega\in\mathbb R^{m\times n}\) be a binary observation mask. Suppose the singular spaces of \(M_0\) are \(\mu_0\)-incoherent, so that for a compact SVD \(M_0=U_0\Sigma_0V_0'\),
        \[
        \|U_0\|_{2,\infty}\le \sqrt{\frac{\mu_0r}{m}},
        \qquad
        \|V_0\|_{2,\infty}\le \sqrt{\frac{\mu_0r}{n}}.
        \]
        Assume \(12r\le n\). Let \(H\) be the noise in the homogeneous model \(Y=P_\Omega(M_0+H)\). The noise entries \(H_{ij}\) are independent, mean-zero, have variance \(\sigma^2>0\), and satisfy a uniform sub-exponential tail bound with fixed constant \(K_H\). The entries of \(\Omega\) are independent Bernoulli\((p)\) random variables and are independent of \(H\). The standing sparse sampling condition is
        \[
        mp\ge \log^{\alpha_0}m
        \]
        for a fixed \(\alpha_0>15\) and sufficiently large dimensions. In addition, assume
        \[
        np\ge C\mu_0r\log m.
        \]
    proof_body: |-
      ### Definitions and notation used in Proof
      Let \(e_i\) be the \(i\)th standard basis vector. Let \(P_{T_\star}\) denote the orthogonal projection onto \(T_\star\), and let \(\mathcal I_{T_\star}\) denote the identity operator on \(T_\star\). For \(i,j\), define \(z_{ij}=P_{T_\star}(e_ie_j')\). For matrices \(L\) and \(R\), define the block-diagonal maps
      \[
      D_Lx=(x_iL_{i,:})_i,
      \qquad
      D_Ry=(y_jR_{j,:})_j.
      \]
      Let \(I\) denote the identity matrix, and let \(\odot\) denote the entrywise (Schur) product.

      ### Proof
      Work under the displayed assumptions and on the high-probability event for the sampling mask. First, for the centered Bernoulli matrix divided by \(\sqrt{mp}\), the Hermitian summands have norm at most \((mp)^{-1/2}\), variance parameter at most one, and weak variance parameter at most \(Cm^{-1/2}\). Its covariance-matched Gaussian matrix has independent entries of variance \((1-p)/m\) and expected operator norm at most two. The bounded-summand edge comparison [ref:R1] used in Section~\ref{sec:supp_sparse_rmt}, with \(t=C\log n\), bounds its norm by
      \[
      2+C\left\{\sqrt{\log n/m}+(mp)^{-1/6}(\log n)^{2/3}
                      +(mp)^{-1/2}\log n\right\}\le C.
      \]
      This proves
      \[
      \|W_\Omega\|\le \Lambda:=C\sqrt{m/p};
      \]
      for \(p=1\) the centered matrix is zero.

      For the tangent-space bound, with \(z_{ij}\) as in the proof notation, we have
      \[
      \|z_{ij}\|_F^2\le \mu_0 r/m+\mu_0 r/n
      \]
      and
      \[
      \sum_{ij}z_{ij}\otimes z_{ij}=\mathcal I_{T_\star}.
      \]
      Apply the matrix Bernstein inequality [ref:R2] to
      \[
      \sum_{ij}(\Omega_{ij}/p-1)z_{ij}\otimes z_{ij}.
      \]
      Its summand and variance bounds are \(C\mu_0r/(np)\), and its dimension is at most \(r(m+n)\). The resulting bound is the displayed \(\theta\), plus \(C\mu_0r\log m/(np)\), which is absorbed by \(\theta\). Hence, for \(A,B\in T_\star\),
      \[
      |\langle T_\Omega A,B\rangle|
      \le \theta\|A\|_F\|B\|_F,
      \qquad
      \theta=C\sqrt{\frac{\mu_0r\log m}{np}}.
      \]

      To prove the bilinear bound, form matrices whose \(i\)th and \(j\)th rows are \(A_{i,:}\otimes C_{i,:}\) and \(B_{j,:}\otimes D_{j,:}\). Their Frobenius norms are at most \(b(A,C)\) and \(b(B,D)\), respectively. Pairing them through \(W_\Omega\) and using its operator norm gives
      \[
      |\langle T_\Omega(AB'),CD'\rangle|
      \le \Lambda\, b(A,C)b(B,D),
      \]
      with
      \[
      b(A,C)=\min\{\|A\|_F\|C\|_{2,\infty},\|A\|_{2,\infty}\|C\|_F\}.
      \]

      For the Schur bound, using the block-diagonal maps \(D_L\) and \(D_R\) from the proof notation, the Schur product \(W_\Omega\odot(LR')\) is
      \[
      D_L'(W_\Omega\otimes I)D_R.
      \]
      Since
      \[
      \|D_L\|=\max_i\|L_{i,:}\|_2,
      \qquad
      \|D_R\|=\max_j\|R_{j,:}\|_2,
      \]
      the claim follows:
      \[
      \|T_\Omega(LR')\|
      \le \Lambda\|L\|_{2,\infty}\|R\|_{2,\infty}.
      \]
      The bilinear and Schur inequalities hold for all conformable factors on the same event, including data-dependent factors, and the two pairs of factors in the bilinear inequality may have different numbers of columns. Intersecting the finite collection of events gives the stated simultaneous bounds with probability at least \(1-cn^{-4}\).

      ### References
      #### Reference R1
      Target: Corollary 2.7 of \cite{brailovskaya2024universality} (bounded-summand edge comparison)
      Citation: For spectral edges we use the bounded-summand edge universality result, Corollary 2.7 of \cite{brailovskaya2024universality}, after logarithmic truncation. In the proof of Lemma~\ref{lem:mask_geometry}: “For the centered Bernoulli matrix divided by \(\sqrt{mp}\), the Hermitian summands have norm at most \((mp)^{-1/2}\), variance parameter at most one, and weak variance parameter at most \(Cm^{-1/2}\). Its covariance-matched Gaussian matrix has independent entries of variance \((1-p)/m\) and expected operator norm at most two. The bounded-summand edge comparison used in Section~\ref{sec:supp_sparse_rmt}, with \(t=C\log n\), bounds its norm by \[
       2+C\left\{\sqrt{\log n/m}+(mp)^{-1/6}(\log n)^{2/3}
                        +(mp)^{-1/2}\log n\right\}\le C.
      \]
      This proves \eqref{eq:sampling_mask_norm}; for \(p=1\) the centered matrix is zero.”
      Bibliography: brailovskaya2024universality (full bibliographic entry not supplied in the provided source material).

