      ##### Coarse rigidity for sparse rectangular matrices (`lem:sparse_coarse_rigidity`)
      ###### Definitions and notation
      Throughout the containing block, the aspect-ratio regime is
      \[
      0<\rho_-\le \rho=\frac{n}{m}\le 1
      \]
      for a fixed constant \(\rho_->0\). In particular \(m\ge n\).

      For an \(m\times n\) matrix \(\bm A\), write
      \[
      s_1(\bm A)\ge \cdots \ge s_n(\bm A)
      \]
      for its ordered singular values; the supplement also writes \(s_i(\bm A)=\psi_i(\bm A)\).

      The rooted Marchenko–Pastur density is
      \[
      \nu_{\rho}(x)
          = \frac{1}{\pi}\frac{
          \sqrt{(\lambda_+^2-x^2)(x^2-\lambda_-^2)}}{\rho x}
          \mathbf 1_{\{\lambda_-\le x\le\lambda_+\}},
          \qquad
          \lambda_{\pm}=1\pm\sqrt{\rho}.
      \]
      The deterministic quantiles
      \(\gamma_1\ge\cdots\ge\gamma_n\) are defined by
      \[
      \int_{\gamma_i}^{\lambda_+}\nu_{\rho}(x)\,dx
          =\frac{i-1/2}{n},\qquad 1\le i\le n.
      \]

      For a mask \(\bOmega\), \(P_{\bOmega}(\bm A)\) keeps the entries of \(\bm A\) on \(\bOmega\) and sets the remaining entries to zero. The sparse matrix in the lemma is
      \[
      \bm A=\frac{1}{\sqrt{mp}}P_{\bOmega}(\bm\Xi),
      \qquad
      \bm\Xi=(\xi_{ij})_{m\times n}.
      \]

      The source writes \(\delta_m=(\log m)^{-1}\), so \(C\log^{-1}m=C\delta_m\) in the displayed rate.

      ###### Assumptions
      Let \(\{\xi_{ij}:1\le i\le m,\,1\le j\le n\}\) be independent random variables satisfying, uniformly in \(i,j\),
      \[
      \mathbb E\xi_{ij}=0,\qquad
      \mathbb E\xi_{ij}^2=1,\qquad
      \mathbb P(|\xi_{ij}|>t)\le 2\exp(-t/K),\quad t>0,
      \]
      for a fixed tail constant \(K>0\).

      Let
      \[
      \Omega_{ij}\stackrel{\mathrm{i.i.d.}}{\sim}\operatorname{Bernoulli}(p)
      \]
      be independent of the \(\xi_{ij}\). The sparse sampling condition is
      \[
      mp\ge \log^{\alpha_0}m
      \]
      for a fixed \(\alpha_0>15\). The aspect-ratio condition \(0<\rho_-\le \rho=n/m\le1\) with fixed \(\rho_->0\) is in force in the containing block.

      ###### Statement
      For every fixed \(\alpha_0>15\), if \(mp\ge\log^{\alpha_0}m\), then for some constant \(D>0\),
      \[
      \mathbb P\left
          \{\max_{1\le i\le n}|s_i(\bm A)-\gamma_i|
          >C\log^{-1}m\right\}
          \le c n^{-D}.
      \]
      In particular, with the same probability,
      \[
      s_1(\bm A)\le1+\sqrt{\rho}+C\log^{-1}m.
      \]
      The constants \(C,c>0\) and \(D>0\) are as in the source statement.
