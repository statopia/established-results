      ##### Theorem 1.1 (Götze–Tikhomirov Marchenko–Pastur Kolmogorov rate)
      ###### Definitions and notation
      Let \(X=(X_{jk})\) be an \(n\times p\) random matrix. Set
      \[
      W=\frac1p XX^*.
      \]
      Denote by \(\{s_1^2,\dots,s_n^2\}\) the eigenvalues of \(W\), and define the empirical spectral distribution function
      \[
      \mathcal F_n(x)=\frac1n\operatorname{card}\{j\le n:\ s_j^2\le x\},
      \qquad x\in\mathbb R.
      \]
      Define the expected distribution function
      \[
      F_n(x)=\mathbf E\,\mathcal F_n(x).
      \]
      Let
      \[
      y=\frac np.
      \]
      Let \(G_y\) denote the Marchenko–Pastur distribution function with density
      \[
      g_y(x)=G_y'(x)
      =\frac{1}{2\pi yx}\sqrt{(x-a)(b-x)}\,I_{[a,b]}(x),
      \]
      where \(I_{[a,b]}(x)\) denotes the indicator function of \([a,b]\), and
      \[
      a=(1-\sqrt y)^2,\qquad b=(1+\sqrt y)^2.
      \]
      For \(\alpha>0\) and \(\varkappa>0\), define
      \[
      l_{n,\alpha}:=\log n(\log\log n)^\alpha,
      \qquad
      \beta_n:=(l_{n,\alpha})^{\frac1{\varkappa}+1}. \tag{1.2}
      \]
      The supremum \(\sup_x|\mathcal F_n(x)-G_y(x)|\) is the Kolmogorov distance between \(\mathcal F_n\) and \(G_y\).

      ###### Assumptions
      The entries \(X_{jk}\), \(1\le j\le n\), \(1\le k\le p\), are independent. Assume
      \[
      \mathbf E X_{jk}=0,\qquad \mathbf E X_{jk}^2=1
      \]
      for all \(j,k\). There exists a constant \(\varkappa>0\) such that, for all \(n,p\ge1\), all \(1\le j\le n\), all \(1\le k\le p\), and all \(t\ge1\),
      \[
      \Pr\{|X_{jk}|>t\}\le \varkappa^{-1}\exp\{-t^{\varkappa}\}. \tag{1.1}
      \]
      Assume \(y\in(0,1]\). Let \(p=p(n)\) and assume
      \[
      \lim_{n\to\infty}\frac np=y\in(0,\infty),
      \]
      and, without loss of generality in the source, \(y\in(0,1]\). The constants in the result may depend on \(\varkappa\), \(\alpha\), and \(y\).

      ###### Statement
      For every \(\alpha>0\) there exist positive constants \(C\) and \(c\), depending on \(\varkappa\), \(\alpha\), and \(y\), such that
      \[
      \Pr\left\{\sup_x\big|\mathcal F_n(x)-G_y(x)\big|>n^{-1}\beta_n^4\right\}
      \le C\exp\{-c\,l_{n,\alpha}\}, \tag{1.3}
      \]
      where
      \[
      l_{n,\alpha}=\log n(\log\log n)^\alpha
      \quad\text{and}\quad
      \beta_n=(l_{n,\alpha})^{\frac1{\varkappa}+1}
      \]
      as in (1.2).

