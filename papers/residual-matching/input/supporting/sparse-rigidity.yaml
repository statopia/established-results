      ##### Statement
      **Remark 6.13 (An improved inequality for Stieltjes transforms).** The main complication in the proof of Theorem 2.10 arises from the fact that we aim to achieve a norm estimate. If we are only interested in establishing universality of the trace of the resolvent (that is, of the Stieltjes transform of the empirical spectral distribution), the proof simplifies greatly and yields a better bound. Indeed, the first equation display of the proof of Lemma 6.11 and Hölder’s inequality readily yield
      \[
      |\mathbf E[\partial_{Y_1}\partial_{Y_2}\partial_{Y_3}\operatorname{tr}(z\mathbf 1-X(t,i,s))^{-1}]|
      \le
      \frac{6\|Y_1\|_3\|Y_2\|_3\|Y_3\|_3}{(\operatorname{Im}z)^4}
      \]
      for any random matrices \(Y_1,Y_2,Y_3\). Combining this inequality with the \(p=3\) case of Corollary 6.2 immediately yields the estimate
      \[
      |\mathbf E[\operatorname{tr}(z\mathbf 1-X)^{-1}]-\mathbf E[\operatorname{tr}(z\mathbf 1-G)^{-1}]|
      \lesssim
      \frac{1}{(\operatorname{Im}z)^4}\sum_{i=1}^n\mathbf E[\operatorname{tr}|Z_i|^3].
      \]
      In particular, in this case the logarithmic dimension dependence is eliminated.

