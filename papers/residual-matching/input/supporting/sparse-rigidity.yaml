      ##### Definitions and notation
      Let \(A\) be an \(m\times n\) real matrix, with ordered singular values \(s_1(A)\ge\cdots\ge s_n(A)\). In the current proof, \(\bar\mu_A\) denotes the symmetrized empirical singular-value measure of \(A\), and \(\bar\mu_\rho\) denotes the deterministic symmetrized rooted Marchenko–Pastur measure associated with the aspect ratio \(\rho\). The exact zero-atom and normalization convention of the cited source is not supplied; the displayed inequality uses the same convention for both measures. A standard representation of the symmetrized singular-value measure is
      \[
      \bar\mu_A=\frac1{2n}\sum_{i=1}^n\bigl(\delta_{s_i(A)}+\delta_{-s_i(A)}\bigr),
      \]
      when the common zero atom is removed in the symmetrized formulation.

      For a probability measure \(\mu\) on \(\mathbb R\), its distribution function is
      \[
      F_\mu(x)=\mu((-\infty,x]).
      \]
      The expected measure \(\mathbb E\bar\mu_A\) is the measure-valued expectation of \(\bar\mu_A\), and \(F_{\mathbb E\bar\mu_A}\) is its distribution function. The Kolmogorov distance is
      \[
      d_{\mathrm K}(\mu,\nu)=\sup_{x\in\mathbb R}|F_\mu(x)-F_\nu(x)|.
      \]
      For \(z=u+i\eta\) with \(\eta>0\), the Stieltjes transform is written
      \[
      m_\mu(z)=\int_{\mathbb R}\frac{1}{x-z}\,d\mu(x),
      \]
      with the sign convention irrelevant for the absolute differences in the displayed bound. The deterministic measure \(\bar\mu_\rho\) is the symmetrized version of the rooted Marchenko–Pastur measure. In the notation of the current theorem, the positive rooted Marchenko–Pastur density is
      \[
      \nu_\rho(x)=
      \frac{1}{\pi}\frac{\sqrt{(\lambda_+^2-x^2)(x^2-\lambda_-^2)}}{\rho x}
      \mathbf 1_{\{\lambda_-\le x\le\lambda_+\}},
      \qquad
      \lambda_\pm=1\pm\sqrt\rho .
      \]
      The symmetrized deterministic measure is the corresponding even extension about \(0\), with the same normalization as used for \(\bar\mu_A\).

