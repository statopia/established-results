      ###### Definitions and notation
      Let \(d\ge 1\). Let \(\Sigma\in\mathbb R^{d\times d}\) be a real matrix with real eigenvalues, and write
      \[
      \mu=\lambda_{\min}(\Sigma)
      \]
      for its smallest eigenvalue. For \(\alpha\in\mathbb R^d\),
      \[
      \|\alpha\|_2=\left(\sum_{i=1}^d \alpha_i^2\right)^{1/2}
      \]
      is the ordinary Euclidean norm, and \(\alpha^\top\) denotes transpose.

      ###### Assumptions
      \(\Sigma\) is real symmetric positive definite, so all its eigenvalues are positive and its smallest eigenvalue satisfies \(\mu>0\). The dimension \(d\ge1\) is arbitrary, and no isotropy assumption on \(\Sigma\) is required.

      ###### Statement
      For every real vector \(\alpha\in\mathbb R^d\),
      \[
      \alpha^\top\Sigma\alpha\ge \mu\|\alpha\|_2^2.
      \]

