    proof_body: |-
      ### Definitions and notation used in Proof
      In the proof, \(\|\Sigma\|_{\rm op}\) denotes the operator norm
      \[
      \|\Sigma\|_{\rm op}
      =
      \sup_{x\in\mathbb R^d,\ x\neq0}\frac{\|\Sigma x\|_2}{\|x\|_2},
      \]
      where \(d\ge1\) is the dimension of the same Euclidean space; for symmetric positive definite \(\Sigma\),
      \[
      \|\Sigma\|_{\rm op}
      =
      \lambda_{\max}(\Sigma)
      =
      \mu\kappa_\Sigma.
      \]

      ### Proof
      By [ref:R1],
      \[
      \alpha^\top\Sigma\alpha\ge\mu\|\alpha\|_2^2
      \]
      and
      \[
      |\alpha^\top\Sigma\beta|
      \le \|\Sigma\|_{\rm op}\|\alpha\|_2\|\beta\|_2
      = \mu\kappa_\Sigma\|\alpha\|_2\|\beta\|_2.
      \]
      Since
      \[
      \alpha^\top\Sigma(\alpha+\beta)
      =\alpha^\top\Sigma\alpha+\alpha^\top\Sigma\beta,
      \]
      adding the two bounds gives
      \[
      \alpha^\top\Sigma(\alpha+\beta)
      \ge
      \mu\Bigl(\|\alpha\|_2^2-\kappa_\Sigma\|\alpha\|_2\|\beta\|_2\Bigr).
      \]
      This proves the claim.

