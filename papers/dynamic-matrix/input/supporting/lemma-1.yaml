      ###### Definitions and notation
      Let \(d\ge1\), and let \(\Sigma\in\mathbb R^{d\times d}\) have smallest eigenvalue \(\mu>0\) and largest eigenvalue \(\lambda_{\max}(\Sigma)\). Set
      \[
      \kappa_\Sigma=\frac{\lambda_{\max}(\Sigma)}{\mu}.
      \]
      The operator norm is
      \[
      \|\Sigma\|_{\rm op}
      =\sup_{x\in\mathbb R^d,\ x\neq0}\frac{\|\Sigma x\|_2}{\|x\|_2}.
      \]
      For symmetric positive definite \(\Sigma\),
      \[
      \|\Sigma\|_{\rm op}=\lambda_{\max}(\Sigma)=\mu\kappa_\Sigma.
      \]
      For \(\alpha,\beta\in\mathbb R^d\), \(\|\alpha\|_2,\|\beta\|_2\) are the ordinary Euclidean vector norms.

      ###### Assumptions
      \(\Sigma\) is real symmetric positive definite, with smallest eigenvalue \(\mu>0\), largest eigenvalue \(\lambda_{\max}(\Sigma)\), and \(\kappa_\Sigma=\lambda_{\max}(\Sigma)/\mu\). The vectors \(\alpha,\beta\) are arbitrary real vectors in the same finite-dimensional Euclidean space \(\mathbb R^d\). No isotropy assumption on \(\Sigma\) is required.

      ###### Statement
      For every \(\alpha,\beta\in\mathbb R^d\),
      \[
      |\alpha^\top\Sigma\beta|
      \le
      \|\Sigma\|_{\rm op}\|\alpha\|_2\|\beta\|_2
      =
      \mu\kappa_\Sigma\|\alpha\|_2\|\beta\|_2.
      \]
