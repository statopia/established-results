      ##### Content basis
      Source extraction. The result is stated in the supplied supplement D1 (`supp.tex`), in the section “Proof of Theorem 1,” as the environment `\begin{lemma}\label{lem1}\label{lemm_convex}`. It is the supplementary material for *Dynamic Matrix Recovery* (main.tex; authors: Ziyuan Chen, Ying Yang, Fang Yao), file `supp.tex`. In the current proof it supports the curvature inequality \(\langle\mathcal S(H+D),H\rangle\ge\mu(e^2-be)\); that displayed consequence is an application made in the read-only current proof context and is not restated here as part of the source lemma. The source lemma statement and its stated hypotheses are present in the supplied material; no statement content is missing. The source proof of the lemma is not included in this organization.

      ##### Lemma 1 (lem1, lemm_convex)
      ###### Definitions and notation
      In the lemma, \(\Sigma\) is a symmetric positive definite matrix, \(\mu>0\) is its smallest eigenvalue, and
      \[
      \kappa_\Sigma=\frac{\lambda_{\max}(\Sigma)}{\mu},
