      ##### Da Prato & Zabczyk (2014), Theorem 2.23 — secondary restatement via Stuart, Theorem 37
      ###### Definitions and notation
      Let \(\mathcal H\) be a fixed separable Hilbert space with inner product \(\langle\cdot,\cdot\rangle\) and norm \(\|\cdot\|\). A Gaussian measure \(\mathcal N(m,\mathcal C)\) has mean \(m\in\mathcal H\) and covariance operator \(\mathcal C\). For \(i=1,2\), \(\mathcal C_i^{1/2}\) denotes the positive square root of \(\mathcal C_i\), \(\mathcal C_i^{1/2}(\mathcal H)\) its image, and \(\mathcal C_i^{-1/2}\) the corresponding inverse/pseudoinverse where defined. The common image space in the equivalence condition is denoted \(E\). For a bounded operator \(L\) on a Hilbert space, the Hilbert–Schmidt norm is defined, for an orthonormal basis \(\{\varphi_j\}\), by
      \[
      \|L\|_{\mathrm{HS}}^2:=\sum_{j=1}^{\infty}\|L\varphi_j\|^2.
      \]

      ###### Assumptions
      Let \(\mu_i\), \(i=1,2\), be two Gaussian measures on the fixed separable Hilbert space \(\mathcal H\) with means \(m_i\) and strictly positive covariance operators \(\mathcal C_i\).

      ###### Statement
      1. \(\mu_1\) and \(\mu_2\) are either singular or equivalent.

      2. The measures \(\mu_1\) and \(\mu_2\) are equivalent Gaussian measures if and only if:
         - (a) the images of \(\mathcal H\) under \(\mathcal C_i^{1/2}\) coincide for \(i=1,2\), and this common image space is denoted \(E\);
         - (b) \(m_1-m_2\in E\);
         - (c)
           \[
           \left\|\left(\mathcal C_1^{-1/2}\mathcal C_2^{1/2}\right)\left(\mathcal C_1^{-1/2}\mathcal C_2^{1/2}\right)^*-I\right\|_{\mathrm{HS}}<\infty.
           \]

      Remark. The final condition may be replaced by the condition that
      \[
      \left\|\left(\mathcal C_1^{1/2}\mathcal C_2^{-1/2}\right)\left(\mathcal C_1^{1/2}\mathcal C_2^{-1/2}\right)^*-I\right\|_{\mathrm{HS}}<\infty
      \]
      and the theorem remains true.

      ##### Kerrigan, Ley & Smyth, Theorem 2 (The Feldman–Hájek Theorem, General Case)
      ###### Definitions and notation
      Let \(\mathcal F\) be a separable Hilbert space of measurable real-valued functions on \(\mathcal X\) with inner product \(\langle-,-\rangle_{\mathcal F}\). For \(i=1,2\), let \(\mathbb P=\mathcal N(m_1,C_1)\) and \(\mathbb Q=\mathcal N(m_2,C_2)\) be Gaussian measures on \(\mathcal F\), with means \(m_i\) and covariance operators \(C_i\). The images \(C_i^{1/2}(\mathcal F)\) are considered; if they coincide, their common image space is denoted \(H_0\). The closure of \(H_0\) is denoted \(\overline{H_0}\). The inverse/pseudoinverse of \(C_i^{1/2}\) is denoted \(C_i^{-1/2}\). Hilbert–Schmidt operators are understood on the indicated Hilbert space, here \(\overline{H_0}\).

      ###### Assumptions
      Let \(\mathbb P=\mathcal N(m_1,C_1)\) and \(\mathbb Q=\mathcal N(m_2,C_2)\) be Gaussian measures on the separable Hilbert space \(\mathcal F\). The theorem below is the supplied restatement in Kerrigan, Ley & Smyth; its supplement states that it refers to Da Prato & Zabczyk (2014, Theorem 2.23 and Theorem 2.25) for a proof.

      ###### Statement
      1. The measures \(\mathbb P\) and \(\mathbb Q\) are either equivalent, that is, \(\mathbb P\ll\mathbb Q\) and \(\mathbb Q\ll\mathbb P\), or mutually singular, that is, \(\mathbb P\) is not absolutely continuous with respect to \(\mathbb Q\) and vice versa.

      2. The measures \(\mathbb P\) and \(\mathbb Q\) are equivalent if and only if:
         - (a) \(C_1^{1/2}(\mathcal F)=C_2^{1/2}(\mathcal F)=H_0\);
         - (b) \(m_1-m_2\in H_0\);
         - (c) the operator
           \[
           \left(C_1^{-1/2}C_2^{1/2}\right)\left(C_1^{-1/2}C_2^{1/2}\right)^*-I
           \]
           is Hilbert–Schmidt on the closure \(\overline{H_0}\).

      3. If \(\mathbb P\) and \(\mathbb Q\) are equivalent and \(C_1=C_2=C\), then \(\mathbb Q\)-a.s. the Radon–Nikodym derivative is given by
      \[
      \frac{d\mathbb P}{d\mathbb Q}(f)
      =
      \exp\left[
      \left\langle C^{-1/2}(m_1-m_2),C^{-1/2}(f-m_2)\right\rangle
      -\frac12\left\|C^{-1/2}m_1-m_2\right\|^2
      \right]
      \qquad \forall f\in\mathcal F,
      \tag{A.1.19}
      \]

      ##### Kerrigan, Ley & Smyth, Theorem 1 (The Feldman–Hájek Theorem; equal-covariance Radon–Nikodym derivative)
      ###### Definitions and notation
      Let \(\mathcal F\) be a separable Hilbert space of measurable real-valued functions on \(\mathcal X\) with inner product \(\langle-,-\rangle_{\mathcal F}\). Let \(\mathbb P=\mathcal N(m_1,C)\) and \(\mathbb Q=\mathcal N(m_2,C)\) be Gaussian measures on \(\mathcal F\) with equal covariance operator \(C\). Define
      \[
      \Delta m=m_1-m_2\in\mathcal F.
      \]
      Here \(C^{-1}\) denotes the pseudoinverse of \(C\), and \(C^{-1/2}\) denotes the pseudoinverse of \(C^{1/2}\). The image space appearing in the equivalence criterion is \(C^{1/2}(\mathcal F)\).

      ###### Assumptions
      Let \(\mathbb P=\mathcal N(m_1,C)\) and \(\mathbb Q=\mathcal N(m_2,C)\) be Gaussian measures on the separable Hilbert space \(\mathcal F\) with equal covariance operator \(C\), and define \(\Delta m=m_1-m_2\in\mathcal F\).

      ###### Statement
      The measures \(\mathbb P\) and \(\mathbb Q\) are equivalent, that is, mutually absolutely continuous, if and only if
      \[
      \Delta m\in C^{1/2}(\mathcal F).
      \]
      In this case, for any \(f\in\mathcal F\), the Radon–Nikodym derivative is
      \[
      \frac{d\mathbb P}{d\mathbb Q}(f)
      =
      \exp\left[
      \left\langle \Delta m, C^{-1}(f-m_2)\right\rangle_{\mathcal F}
      -\frac12\left\|C^{-1/2}\Delta m\right\|_{\mathcal F}^2
      \right],
      \tag{3.4}
      \]
      where \(C^{-1}\) is the pseudoinverse of \(C\) and \(C^{-1/2}\) is the pseudoinverse of \(C^{1/2}\).

