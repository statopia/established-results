      ###### Definitions and notation
      Let \(X,Y\) be separable Banach spaces, equipped with the Borel \(\sigma\)-algebra, and let \(\mu_0\) be a measure on \(X\). Let \(X'\subseteq X\) and let \(\Phi:X\times Y\to\mathbb R\). For \(r>0\), \(B_Y(0,r)\) denotes the open ball of radius \(r\) in \(Y\) centered at \(0\). The functions \(M_i:\mathbb R^+\times\mathbb R^+\to\mathbb R^+\), \(i=1,2\), are monotonic non-decreasing separately in each argument, and \(M_2\) is strictly positive. The source defines, for the potential \(\Phi\),
