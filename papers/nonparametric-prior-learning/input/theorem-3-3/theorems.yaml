  - id: entry:selected:63c9041b-e306-402a-ab41-5334a989ba09
    title: Theorem 3.3 (Bayesian Well-Posedness of Inverse Problems; posterior density, positive finite normalizer and Hellinger continuity)
    kind: theorem
    latex_statement: |-
      Consider a forward operator \(\mathcal{G}:\mathcal{U}\to\tilde{\mathcal{H}}\), where \(\mathcal{U}\) and \(\tilde{\mathcal{H}}\) are separable Banach spaces. Data follows the model:
      \[
      y_j=\mathcal{L}_{x_j}(\mathcal{G}(u))+\eta_j,\quad \forall j=1,\dots,m,
      \tag{1}
      \]
      with \(u\) as the model parameter, \(x_j\in\mathcal{X}\) denoting measurement points or input functions, \(y_j\in\mathcal{Y}\) as observed data, and \(\eta_j\) representing independent identically distributed (i.i.d.) noise. Introduce another separable Banach space \(\mathcal{H}\subset\mathcal{Y}\), where \(\mathcal{X}\) and \(\mathcal{Y}\) are separable Banach spaces and \(\mathcal{L}_{x_j}:\mathcal{H}\to\mathcal{H}\) is a bounded linear operator dependent on \(x_j\). Define \(\boldsymbol{y}=(y_1,\cdots,y_m)^T\), \(\boldsymbol{\eta}=(\eta_1,\cdots,\eta_m)^T\), \(\boldsymbol{x}=(x_1,\cdots,x_m)^T\), so the model (1) compacts to \(\boldsymbol{y}=\mathcal{L}_{\boldsymbol{x}}\mathcal{G}(u)+\boldsymbol{\eta}\), where \(\mathcal{L}_{\boldsymbol{x}}\mathcal{G}(u):=(\mathcal{L}_{x_1}(\mathcal{G}(u)),\dots,\mathcal{L}_{x_m}(\mathcal{G}(u)))^T\). For inverse problems, assume a true parameter \(u^\dagger\), leading to the forward model \(\boldsymbol{y}=\mathcal{L}_{\boldsymbol{x}}\mathcal{G}(u^\dagger)+\boldsymbol{\eta}\).

      Define \(\mathcal{Z}:=\mathcal{X}\times\mathcal{Y}\), so the random element \(z:=(x,y)\) satisfies \(z\sim\mathbb{D}\in\mathcal{P}(\mathcal{Z})\). The dataset \(S=\{z_j=(x_j,y_j)\}_{j=1}^m\) consists of i.i.d. samples from \(\mathbb{D}\) (denoted \(S\sim\mathbb{D}^m\)).

      To show that Assumption 2.6 holds under certain conditions, consider a Gaussian prior \(\mathbb{P}:=\mathcal{N}(0,\mathcal{C}_0)\), where \(\mathcal{C}_0\) is a positive-definite, symmetric trace-class operator. Let \(\mathcal{U}\) be a separable Hilbert space with orthogonal basis \(\{e_k\}_{k=1}^\infty\). Assume the prior covariance operator has spectral decomposition \(\mathcal{C}_0=\sum_{k=1}^\infty \lambda_k e_k\otimes e_k\) with \(\lambda_1\ge\lambda_2\ge\cdots>0\). Define \(\mathcal{U}^2\) as the Hilbert scale induced by \(\mathcal{C}_0\) (see Engl et al. (1996) or Subsection 3.1).

      We assume that Assumption 2.7 holds true and introduce the mapping \(f(S;\theta):=(f_m(S;\theta_1),\theta_2)\in\mathcal{V}:=\mathcal{U}^2\times\mathbb{R}^{N_c}\). The data-dependent learned prior measure is specified as \(\mathbb{P}^\theta_S:=\mathcal{N}(f_m(S;\theta_1),\mathcal{C}_0(\theta_2))\), where the covariance operator
      \[
      \mathcal{C}_0(\theta_2)=\sum_{k=1}^{N_c}e^{\theta_{2k}}e_k\otimes e_k+\sum_{k=N_c+1}^{\infty}\lambda_k e_k\otimes e_k
      \tag{4}
      \]
      with \(N_c\in\mathbb{N}^+\) is a predefined constant. For the mean function \(f_m(S;\theta_1)\), we constrain all admissible \(f_m(S;\theta_1)\) to the ball \(B_{\mathcal{U}^2}(R_u)\subset\mathcal{U}^2\) defined by \(B_{\mathcal{U}^2}(R_u):=\{f\in\mathcal{U}^2\mid \|\mathcal{C}_0^{-1}f\|_{\mathcal{U}}\le R_u\}\), where \(R_u>0\) being a sufficiently large prespecified constant.

      For the potential used below,
      \[
      \Phi(u;x_j,y_j):=\frac12\|\Gamma^{-\frac12}\mathcal{L}_{x_j}\mathcal{G}(u)\|_{\mathcal{H}}^2-\langle\Gamma^{-\frac12}y_j,\Gamma^{-\frac12}\mathcal{L}_{x_j}\mathcal{G}(u)\rangle_{\mathcal{H}},
      \]
      where \(\beta>0\) is a constant, and \(Z_m\in(0,\infty)\) is the normalizing constant.

      Consider \(\mathcal{H}\), a finite or infinite-dimensional space. For the infinite-dimensional case, we introduce the Hilbert scale (Engl et al. 1996), central to our analysis. Since \(\mathcal{C}_1\) (Assumption 3.1) is injective and self-adjoint, \(\mathcal{H}=\overline{\mathcal{R}(\mathcal{C}_1)}\oplus\mathcal{R}(\mathcal{C}_1)^\perp=\overline{\mathcal{R}(\mathcal{C}_1)}\), making \(\mathcal{C}_1^{-1}:\mathcal{R}(\mathcal{C}_1)\to\mathcal{H}\) a densely defined, unbounded, symmetric, positive-definite linear operator. It extends to a self-adjoint operator with domain \(\mathcal{D}(\mathcal{C}_1^{-1}):=\{u\in\mathcal{H}\mid \mathcal{C}_1^{-1}u\in\mathcal{H}\}\). Thus, we define the Hilbert scale \((\mathcal{H}^t)_{t\in\mathbb{R}}\), where \(\mathcal{H}^t:=\mathcal{M}_1^{\|\cdot\|_{\mathcal{H}^t}}\), \(\mathcal{M}_1:=\bigcap_{\ell=0}^\infty\mathcal{D}(\mathcal{C}_1^{-\ell})\), with inner product and norm \(\langle u,v\rangle_{\mathcal{H}^t}=\langle\mathcal{C}_1^{-t/2}u,\mathcal{C}_1^{-t/2}v\rangle_{\mathcal{H}}\), \(\|u\|_{\mathcal{H}^t}=\|\mathcal{C}_1^{-t/2}u\|_{\mathcal{H}}\). Assumption 3.1 states \(\mathcal{C}_1\Gamma=\Gamma\mathcal{C}_1\) (infinite-dimensional case), a harmless assumption since \(\mathcal{C}_1\) only defines the function space. Analogously, define the Hilbert scale \((\mathcal{U}^t)_{t\in\mathbb{R}}\) for \(\mathcal{U}\) and prior covariance \(\mathcal{C}_0\): \(\mathcal{U}^t:=\mathcal{M}_2^{\|\cdot\|_{\mathcal{U}^t}}\), \(\mathcal{M}_2:=\bigcap_{\ell=0}^\infty\mathcal{D}(\mathcal{C}_0^{-\ell})\), with \(\langle u,v\rangle_{\mathcal{U}^t}=\langle\mathcal{C}_0^{-t/2}u,\mathcal{C}_0^{-t/2}v\rangle_{\mathcal{U}}\), \(\|u\|_{\mathcal{U}^t}=\|\mathcal{C}_0^{-t/2}u\|_{\mathcal{U}}\). The Hilbert scale motivates the following assumptions.

      <!-- formalization-clarifications:v1:7bb3a7564ded978a3050810580819fa072609d93577b57ee3d4f52b1b01d09db -->
      Formalization clarifications from source and proof:
      1. Constants and quantifier order. The theorem statement does not display a single fully explicit quantifier string. The literal reading is: first fix the spaces, operators, eigensystems, θ_min < θ_max, N_c, and the other objects satisfying Assumptions 2.7 and 3.1; then fix the Assumption 3.2 parameters s∈(s1,1], \tilde s∈(s0,1], α≥0 and the associated C1,C2,M1,M2; then, for fixed θ∈Θ and dataset S, impose the δ0 exponential-moment condition and the f_m bounds/continuity; finally conclude for that fixed θ and S. This order is inferred from the wording, not printed as a formal string. The source leaves several dependencies unspecified. Assumption 2.7 explicitly says N_c∈N^+ is predefined and θ_min,θ_max are fixed real numbers; it does not claim anything is uniform in N_c. Assumption 3.1 gives s0,s1 existentially for C0 and C1, respectively; they may depend on those operators and are not asserted universal. Assumption 3.2 says “Suppose constants s..., \tilde s..., and α≥0 such that” and then introduces C1,C2,M1,M2; the source does not explicitly say on which fixed data/operator/scale parameters these constants and functions depend, but it does not assert they are absolute or uniform across θ,S,m,N_c, or dimensions. M1 and M2 are functions, with M1 non-decreasing and M2 separately non-decreasing; the inequalities are “for any x∈X and u,…”, so M1,M2 are not allowed to depend on u or x within those inequalities. The M1 in Theorem 3.3 is the same Assumption 3.2 function. The theorem’s δ0 condition is stated as existence of δ0>0 with E_{u∼P^θ_S} exp(δ M1(||u||_{U^{1-\tilde s}})^2)<∞ for all δ∈[0,δ0); because P^θ_S depends on θ and S, the source does not state uniformity of δ0 in θ,S,m or across priors. The theorem’s M(r) is a non-decreasing function in the f_m bound; it appears after “For any fixed θ∈Θ”, so the source does not make M independent of θ, and it also does not spell out dependence on S or m. The source’s R_u in Subsection 2.3 is “a sufficiently large prespecified constant” for the ball B_{U^2}(R_u); it is not repeated in the Theorem 3.3 hypothesis list, and the source does not specify exactly how it is chosen or whether it may depend on S or θ. β is only described in the theorem as a positive constant; the proof and later algorithmic sections use particular choices, but those later choices should not be imported as Theorem 3.3 dependencies. Z_m is not an arbitrary constant: it is the positive finite normalizing constant of (6), depending on S, θ, m, β, P^θ_S, and the potential; Z_m′ is the analogous constant for S′ in the proof. No O/o, probability O_P/o_P, or uniform-in-m asymptotic is stated.

      2. Norms and mathematical objects. All norms in the theorem are the Hilbert-space norms defined by the source: ||·||_H on H, and the Hilbert-scale norms H^t and U^t defined through ||u||_{H^t}=||C1^{-t/2}u||_H and ||u||_{U^t}=||C0^{-t/2}u||_U, with the displayed inner products. In the finite-dimensional case H=R^{N_d}, Theorem 3.3 explicitly says to replace ||·||_{H^{α-s}} by ||·||_H, the standard Euclidean norm on R^{N_d}; Assumption 3.2 says C1 is omitted. The proof also uses the operator norm \tilde C:=||C1^{\tilde s/2}||_{B(H)}, which is explicitly an operator norm; this is not a general replacement for the Hilbert-scale norms. The prior is P^θ_S=N(f_m(S;θ1),C0(θ2)), with covariance exactly as in (4), using e^{θ_{2k}} on the first N_c coordinates and λ_k thereafter; P0=N(0,C0) occurs only in the proof. The mean f_m is restricted in Subsection 2.3 to B_{U^2}(R_u)={f: ||C0^{-1}f||_U≤R_u}; this is the source-defined U^2 ball, not a generic bounded set or a different Cameron-Martin-type ball. The potential is the displayed source object Φ(u;x_j,y_j)=1/2||Γ^{-1/2}L_{x_j}G(u)||_H^2−⟨Γ^{-1/2}y_j,Γ^{-1/2}L_{x_j}G(u)⟩_H; the finite-dimensional Remark 3.4 gives a nonnegative squared-residual alternative, but that should not silently replace the infinite-dimensional formula in the theorem. The source does not fully specify domains for Γ^{-1/2}, C1^{-t/2}, C0^{-t/2}, or the composite L_{x}G; Assumption 3.2’s inequalities are what make the displayed expressions finite. There is also a source-level type ambiguity: the early notation says G:U→\tilde H and L_{x_j}:H→H, but the formulas apply L_{x_j} to G(u) and use the result in H; the exact intended composite L_{x_j}G with codomain H is not reconciled in the selected block. The Hellinger metric is named but not defined in the theorem statement; the proof’s use of squared integrals of half-densities is proof-based evidence of its intended meaning, not a new source definition. The reference R3, Dashti and Stuart (2017), uses general Banach-space norms ||·||_X, ||·||_Y and Hellinger distance on its own spaces; those are not automatically the same as the target’s U^{1-\tilde s} and H^{α-s} norms except through the citing paper’s local substitutions.

      3. Asymptotics. Theorem 3.3 itself states no asymptotic in m or n; m is the fixed number of observations in the displayed sum, and the only limits are the claimed continuity statements as x_j→x_j′ in X and y_j→y_j′ in H^{α-s}, with the finite-dimensional replacement by the Euclidean H norm, for j=1,…,m. The Hellinger conclusion is d_Hell(Q(S,P^θ_S),Q(S′,P^θ_{S′}))→0 under these convergences. The statement does not specify uniformity in θ, m, S, or the radius of the y-neighborhood; the proof uses local boundedness and r-dependent quantities, so any stronger uniform reading must remain unresolved. The proof’s convergence I11→0, I12→0 and I1→0 is proof-based and invokes Reference R5, Lebesgue’s dominated convergence theorem; R5 in the supplied material has no bibliography or exact source statement and supports only the integral-limit step, with measurability, almost-everywhere convergence, and domination not fully verified in the excerpt. The proof’s use of N(r,||u||) and choice of small δ1,δ2 is intermediate proof machinery, not a theorem hypothesis. Reference R3, Dashti and Stuart (2017), gives general well-posedness and Hellinger-stability results: Theorem 4.3 requires μ0(X′)=1, positive μ0-mass of some bounded set, and exp(M1(r,||u||_X))∈L^1 for every fixed r; Theorem 4.5 additionally requires exp(M1)(1+M2^2) integrability and yields a local Hellinger bound C(r)||y−y′||_Y for y,y′ in a fixed ball, with C(r) allowed to depend on r. The supplied reference notes that the citing proof’s displayed continuity and lower-bound checks alone do not literally display the Theorem 4.5 data-Lipschitz M2 condition or the stronger integrability as verified; the exact local identification with the cited universal Banach-space theorems is therefore not fully established in the source material.

      4. Potentially omitted definitions and external-result qualifications. The dataset is S={z_j=(x_j,y_j)} with S∼D^m, z∼D∈P(Z), Z=X×Y, and the noise is i.i.d. D3=N(0,Γ); Theorem 3.3 fixes S and θ for the posterior formula, while the Hellinger part compares S with S′. Assumption 2.7 only gives θ2∈[θ_min,θ_max]^{N_c} almost surely under the hyper-prior; the theorem says “For any fixed θ∈Θ”, and the source does not explicitly restrict an arbitrary fixed θ to the support of P2, although the proof uses θ_min and λ_{N_c} in bounds. The proof’s statement u∈U^{1-\tilde s} P^θ_S-a.s. is proof-based: it cites Reference R2, Agapiou, Larsson and Stuart (2013), Lemma 3.3, but that lemma as supplied is stated for u∼μ0=N(0,C0), not for the learned prior, and gives u∈X^{1-s} a.s. for s>s0. Extending it to P^θ_S requires the proof’s equivalence P^θ_S∼P0, which uses the Cameron-Martin condition; this application is not part of the original Lemma 3.3. Reference R1, Prato and Zabczyk (2014), Theorem 2.23, is cited for dP^θ_S/dP0=exp(−\tildeΦ). The supplied reference evidence verifies the equal-covariance Feldman–Hájek/Radon–Nikodym framework, but the unequal-covariance density displayed in the current proof is not confirmed by the retrieved original theorem text; its exact hypotheses and numbering remain unverified, so it should not be treated as discharged source evidence. Reference R4, Prato (2006), Proposition 1.13, is used for exponential-square integrability of a Gaussian measure; the supplied material labels the exact statement as source-unconfirmed and standard Fernique-type content. It does not by itself imply the theorem’s small-δ moment under P^θ_S; that moment is an explicit additional assumption in Theorem 3.3, and the proof’s (73) is an application-side inference. The assertion that Z_m∈(0,∞) is tied in the proof to Reference R3, Dashti and Stuart (2017), Theorem 4.3-type conditions, but the target’s assumptions are not literally the same and the source does not display a complete verification of all R3 hypotheses; finite-dimensional Remark 3.4 explicitly says the δ0 condition is not required there. Intermediate proof objects such as N(r,||u||), δ1,δ2, and the constructed lower bound must not be promoted to source hypotheses or conclusions.
      <!-- /formalization-clarifications -->

      Suppose that Assumptions 2.7, 3.1, and 3.2 are satisfied. For the function \(M_1(\cdot)\) in Assumption 3.2, assume there exists a constant \(\delta_0>0\) such that for all \(\delta\in[0,\delta_0)\), the quantity \(\mathbb{E}_{u\sim\mathbb{P}^\theta_S}\exp\left(\delta M_1(\|u\|_{\mathcal{U}^{1-\tilde s}})^2\right)\) is finite. Let \(\mathcal{H}\) be a separable Hilbert space. For any fixed \(\theta\in\Theta\), suppose that \(\|f_m(S;\theta_1)\|_{\mathcal{U}^{1+\tilde s}}\le M(r)\) whenever \(\|y_j\|_{\mathcal{H}^{\alpha-s}}\le r\) for all \(j=1,\dots,m\), where \(M(\cdot)\) is a non-decreasing function. Additionally, assume that \(\|f_m(S;\theta_1)-f(S';\theta_1)\|_{\mathcal{U}^{1+\tilde s}}\to0\), as \(x_j\to x_j'\) in \(\mathcal{X}\) and \(y_j\to y_j'\) in \(\mathcal{H}^{\alpha-s}\), for \(j=1,\dots,m\), where \(S'=\{(x_j',y_j')\}_{j=1}^m\). Under these conditions, the generalized posterior measure \(\mathbb{Q}(S,\mathbb{P}^\theta_S)\) is absolutely continuous with respect to \(\mathbb{P}^\theta_S\), and
      \[
      \frac{d\mathbb{Q}(S,\mathbb{P}^\theta_S)}{d\mathbb{P}^\theta_S}(u)=\frac{1}{Z_m}\exp\left(-\frac{\beta}{m}\sum_{j=1}^m\Phi(u;x_j,y_j)\right),
      \tag{6}
      \]
      where \(\beta>0\) is a constant, \(\Phi(u;x_j,y_j):=\frac12\|\Gamma^{-\frac12}\mathcal{L}_{x_j}\mathcal{G}(u)\|_{\mathcal{H}}^2-\langle\Gamma^{-\frac12}y_j,\Gamma^{-\frac12}\mathcal{L}_{x_j}\mathcal{G}(u)\rangle_{\mathcal{H}}\), and \(Z_m\in(0,\infty)\) is the normalizing constant. Moreover, the mapping \(S\mapsto\mathbb{Q}(S,\mathbb{P}^\theta_S)\) is continuous with respect to the Hellinger metric: \(d_{\mathrm{Hell}}(\mathbb{Q}(S,\mathbb{P}^\theta_S),\mathbb{Q}(S',\mathbb{P}^\theta_{S'}))\to0\), as \(x_j\to x_j'\) in \(\mathcal{X}\) and \(y_j\to y_j'\) in \(\mathcal{H}^{\alpha-s}\). If \(\mathcal{H}=\mathbb{R}^{N_d}\) is finite-dimensional, then all of the above results remain valid upon replacing \(\|\cdot\|_{\mathcal{H}^{\alpha-s}}\) with \(\|\cdot\|_{\mathcal{H}}\), which corresponds to the standard Euclidean norm on \(\mathbb{R}^{N_d}\).
    assumptions:
      - |-
        Assumption 2.7. Consider the parameter space \(\Theta=\Theta_1\times\Theta_2\), with \(\Theta_1\) a separable Hilbert space and \(\Theta_2=\mathbb{R}^{N_c}\). Assume the hyper-prior measure \(\mathscr{P}=\mathscr{P}_1\otimes\mathscr{P}_2\), where \(\mathscr{P}_1\) is a probability measure on \(\Theta_1\), and \(\mathscr{P}_2\) is a probability measure on \(\mathbb{R}^{N_c}\) with compact support \([\theta_{\min},\theta_{\max}]^{N_c}\). Here, the parameters \(\theta_{\min},\theta_{\max}\in\mathbb{R}\) \((\theta_{\min}<\theta_{\max})\) are fixed real numbers. In particular, \(\theta_2\in[\theta_{\min},\theta_{\max}]^{N_c}\) almost surely.

        Assumption 3.1. Let us give some basic assumptions used in the rest of this section:

        1. Assume \(\mathcal{U}\) is an infinite-dimensional separable Hilbert space. The prior measure \(\mathbb{P}^\theta_S:=\mathcal{N}(f_m(S;\theta_1),\mathcal{C}_0(\theta_2))\) defined on \(\mathcal{U}\) as in Subsection 2.3, with the mean function \(f_m(S;\theta_1)\) lying in the Cameron-Martin space of \(\mathcal{C}_0\) (see Subsection 2.3) for all \(S\in\mathcal{Z}^m\) and \(\theta\in\Theta\). Without loss of generality, let \(\{\lambda_k,e_k\}_{k=1}^\infty\) be the eigensystem of \(\mathcal{C}_0\), where \(\{\lambda_k\}_{k=1}^\infty\) are non-increasing and \(\{e_k\}_{k=1}^\infty\) are normalized eigenfunctions. Assume there exists \(s_0\in[0,1)\) such that \(\mathcal{C}_0^s\) is trace class for all \(s>s_0\).

        2. Assume that the space \(\mathcal{H}\) introduced in Subsection 2.1 is either \(\mathbb{R}^{N_d}\), where \(N_d\) is a positive integer, or \(\mathcal{H}\) is an infinite-dimensional separable Hilbert space.

        3. Assume that the noise \(\eta\) is distributed according to a Gaussian distribution \(\mathbb{D}_3\) defined as \(\mathbb{D}_3:=\mathcal{N}(0,\Gamma)\), where \(\Gamma:\mathcal{H}\to\mathcal{H}\) is a self-adjoint, positive-definite linear operator, but not necessarily trace class. Similar settings can be found in (Agapiou et al. 2013).

        4. If \(\mathcal{H}\) is an infinite-dimensional Hilbert space, let us introduce \(\mathcal{C}_1:\mathcal{H}\to\mathcal{H}\), which is a self-adjoint, positive-definite, trace class, linear operator. Suppose \(\mathcal{C}_1\Gamma=\Gamma\mathcal{C}_1\) and there exists \(s_1\in[0,1)\) such that \(\mathcal{C}_1^s\) is trace class for all \(s>s_1\).

        Assumption 3.2. Suppose constants \(s\in(s_1,1]\), \(\tilde s\in(s_0,1]\), and \(\alpha\ge0\) such that

        1. If the space \(\mathcal{H}\) is a separable Hilbert space, for all \(w\in\mathcal{H}^{\alpha-s}\), \(s\in(s_1,1]\) and \(\rho\in[[\alpha-s_1-1],\alpha-s_1)\), we assume
        \[
        \|\mathcal{C}_1^{\frac{\tilde s}{2}}\Gamma^{-\frac12}w\|_{\mathcal{H}}\le C_1\|\mathcal{C}_1^{\frac{s-\alpha}{2}}w\|_{\mathcal{H}}
        \quad\text{and}\quad
        \|\mathcal{C}_1^{-\frac{\tilde s}{2}}\Gamma^{\frac12}w\|_{\mathcal{H}}\le C_2\|\mathcal{C}_1^{\frac{\alpha-\rho}{2}}w\|_{\mathcal{H}}.
        \]

        2. If the space \(\mathcal{H}\) is a separable Hilbert space, for any \(x\in\mathcal{X}\) and \(u,u_1,u_2\in\mathcal{U}^{1-\tilde s}\), we have
        \[
        \|\mathcal{C}_1^{-\frac{\tilde s}{2}}\Gamma^{-\frac12}\mathcal{L}_x\mathcal{G}(u)\|_{\mathcal{H}}\le M_1(\|u\|_{\mathcal{U}^{1-\tilde s}}),
        \]
        \[
        \|\mathcal{C}_1^{-\frac{\tilde s}{2}}\Gamma^{-\frac12}(\mathcal{L}_x\mathcal{G}(u_1)-\mathcal{L}_x\mathcal{G}(u_2))\|_{\mathcal{H}}\le M_2(\|u_1\|_{\mathcal{U}^{1-\tilde s}},\|u_2\|_{\mathcal{U}^{1-\tilde s}})\|u_1-u_2\|_{\mathcal{U}^{1-\tilde s}},
        \]
        \[
        \|\mathcal{C}_1^{-\frac{\tilde s}{2}}\Gamma^{-\frac12}(\mathcal{L}_x\mathcal{G}(u)-\mathcal{L}_{x'}\mathcal{G}(u))\|_{\mathcal{H}}\to0,\quad\text{as }x\to x'\text{ in }\mathcal{X},
        \]
        where \(M_1(\cdot)\) is a monotonic non-decreasing function and \(M_2(\cdot,\cdot)\) is a function monotonic non-decreasing separately in each argument. If \(\mathcal{H}\) is a finite-dimensional space, say \(\mathcal{H}=\mathbb{R}^{N_d}\), we can omit the operator \(\mathcal{C}_1\) from the aforementioned requirements.
    proof_body: |-
      ### Definitions and notation used in Proof
      For the potential used in the proof, as supplied in the main target,
      \[
      \Phi(u;x_j,y_j):=\frac12\|\Gamma^{-\frac12}\mathcal{L}_{x_j}\mathcal{G}(u)\|_{\mathcal{H}}^2-\langle\Gamma^{-\frac12}y_j,\Gamma^{-\frac12}\mathcal{L}_{x_j}\mathcal{G}(u)\rangle_{\mathcal{H}},
      \]
      where \(\beta>0\) is a constant, and \(Z_m\in(0,\infty)\) is the normalizing constant.

      Under Assumption 2.7, \(\Theta=\Theta_1\times\Theta_2\), with \(\Theta_1\) a separable Hilbert space and \(\Theta_2=\mathbb{R}^{N_c}\). The hyper-prior measure is \(\mathscr{P}=\mathscr{P}_1\otimes\mathscr{P}_2\), where \(\mathscr{P}_1\) is a probability measure on \(\Theta_1\), and \(\mathscr{P}_2\) is a probability measure on \(\mathbb{R}^{N_c}\) with compact support \([\theta_{\min},\theta_{\max}]^{N_c}\), where \(\theta_{\min},\theta_{\max}\in\mathbb{R}\) \((\theta_{\min}<\theta_{\max})\) are fixed real numbers. In particular, \(\theta_2\in[\theta_{\min},\theta_{\max}]^{N_c}\) almost surely.

      The data-dependent learned prior measure is
      \[
      \mathbb{P}^\theta_S:=\mathcal{N}(f_m(S;\theta_1),\mathcal{C}_0(\theta_2)),
      \]
      where the covariance operator
      \[
      \mathcal{C}_0(\theta_2)=\sum_{k=1}^{N_c}e^{\theta_{2k}}e_k\otimes e_k+\sum_{k=N_c+1}^{\infty}\lambda_k e_k\otimes e_k
      \tag{4}
      \]
      with \(N_c\in\mathbb{N}^+\) a predefined constant.

      Under Assumption 3.1, \(\mathcal{U}\) is an infinite-dimensional separable Hilbert space. The prior measure \(\mathbb{P}^\theta_S:=\mathcal{N}(f_m(S;\theta_1),\mathcal{C}_0(\theta_2))\) is defined on \(\mathcal{U}\) as in Subsection 2.3, with the mean function \(f_m(S;\theta_1)\) lying in the Cameron-Martin space of \(\mathcal{C}_0\) for all \(S\in\mathcal{Z}^m\) and \(\theta\in\Theta\). Let \(\{\lambda_k,e_k\}_{k=1}^\infty\) be the eigensystem of \(\mathcal{C}_0\), where \(\{\lambda_k\}_{k=1}^\infty\) are non-increasing and \(\{e_k\}_{k=1}^\infty\) are normalized eigenfunctions. Assume there exists \(s_0\in[0,1)\) such that \(\mathcal{C}_0^s\) is trace class for all \(s>s_0\).

      The space \(\mathcal{H}\) introduced in Subsection 2.1 is either \(\mathbb{R}^{N_d}\), where \(N_d\) is a positive integer, or \(\mathcal{H}\) is an infinite-dimensional separable Hilbert space.

      The noise \(\eta\) is distributed according to
      \[
      \mathbb{D}_3:=\mathcal{N}(0,\Gamma),
      \]
      where \(\Gamma:\mathcal{H}\to\mathcal{H}\) is a self-adjoint, positive-definite linear operator, but not necessarily trace class.

      If \(\mathcal{H}\) is an infinite-dimensional Hilbert space, \(\mathcal{C}_1:\mathcal{H}\to\mathcal{H}\) is a self-adjoint, positive-definite, trace class, linear operator. Suppose \(\mathcal{C}_1\Gamma=\Gamma\mathcal{C}_1\) and there exists \(s_1\in[0,1)\) such that \(\mathcal{C}_1^s\) is trace class for all \(s>s_1\).

      The Hilbert scale \((\mathcal{H}^t)_{t\in\mathbb{R}}\) is defined by
      \[
      \mathcal{H}^t:=\mathcal{M}_1^{\|\cdot\|_{\mathcal{H}^t}},
      \qquad
      \mathcal{M}_1:=\bigcap_{\ell=0}^\infty\mathcal{D}(\mathcal{C}_1^{-\ell}),
      \]
      with inner product and norm
      \[
      \langle u,v\rangle_{\mathcal{H}^t}
      =
      \langle \mathcal{C}_1^{-t/2}u,\mathcal{C}_1^{-t/2}v\rangle_{\mathcal{H}},
      \qquad
      \|u\|_{\mathcal{H}^t}
      =
      \|\mathcal{C}_1^{-t/2}u\|_{\mathcal{H}}.
      \]
      Analogously, the Hilbert scale \((\mathcal{U}^t)_{t\in\mathbb{R}}\) for \(\mathcal{U}\) and prior covariance \(\mathcal{C}_0\) is defined by
      \[
      \mathcal{U}^t:=\mathcal{M}_2^{\|\cdot\|_{\mathcal{U}^t}},
      \qquad
      \mathcal{M}_2:=\bigcap_{\ell=0}^\infty\mathcal{D}(\mathcal{C}_0^{-\ell}),
      \]
      with
      \[
      \langle u,v\rangle_{\mathcal{U}^t}
      =
      \langle \mathcal{C}_0^{-t/2}u,\mathcal{C}_0^{-t/2}v\rangle_{\mathcal{U}},
      \qquad
      \|u\|_{\mathcal{U}^t}
      =
      \|\mathcal{C}_0^{-t/2}u\|_{\mathcal{U}}.
      \]

      Assumption 3.2 is used with constants \(s\in(s_1,1]\), \(\tilde s\in(s_0,1]\), and \(\alpha\ge0\) such that:

      1. If the space \(\mathcal{H}\) is a separable Hilbert space, for all \(w\in\mathcal{H}^{\alpha-s}\), \(s\in(s_1,1]\) and \(\rho\in[[\alpha-s_1-1],\alpha-s_1)\),
      \[
      \|\mathcal{C}_1^{\frac{\tilde s}{2}}\Gamma^{-\frac12}w\|_{\mathcal{H}}\le C_1\|\mathcal{C}_1^{\frac{s-\alpha}{2}}w\|_{\mathcal{H}}
      \quad\text{and}\quad
      \|\mathcal{C}_1^{-\frac{\tilde s}{2}}\Gamma^{\frac12}w\|_{\mathcal{H}}\le C_2\|\mathcal{C}_1^{\frac{\alpha-\rho}{2}}w\|_{\mathcal{H}}.
      \]

      2. If the space \(\mathcal{H}\) is a separable Hilbert space, for any \(x\in\mathcal{X}\) and \(u,u_1,u_2\in\mathcal{U}^{1-\tilde s}\),
      \[
      \|\mathcal{C}_1^{-\frac{\tilde s}{2}}\Gamma^{-\frac12}\mathcal{L}_x\mathcal{G}(u)\|_{\mathcal{H}}\le M_1(\|u\|_{\mathcal{U}^{1-\tilde s}}),
      \]
      \[
      \|\mathcal{C}_1^{-\frac{\tilde s}{2}}\Gamma^{-\frac12}(\mathcal{L}_x\mathcal{G}(u_1)-\mathcal{L}_x\mathcal{G}(u_2))\|_{\mathcal{H}}
      \le M_2(\|u_1\|_{\mathcal{U}^{1-\tilde s}},\|u_2\|_{\mathcal{U}^{1-\tilde s}})\|u_1-u_2\|_{\mathcal{U}^{1-\tilde s}},
      \]
      \[
      \|\mathcal{C}_1^{-\frac{\tilde s}{2}}\Gamma^{-\frac12}(\mathcal{L}_x\mathcal{G}(u)-\mathcal{L}_{x'}\mathcal{G}(u))\|_{\mathcal{H}}\to0,
      \quad\text{as }x\to x'\text{ in }\mathcal{X},
      \]
      where \(M_1(\cdot)\) is a monotonic non-decreasing function and \(M_2(\cdot,\cdot)\) is a function monotonic non-decreasing separately in each argument. If \(\mathcal{H}\) is finite-dimensional, say \(\mathcal{H}=\mathbb{R}^{N_d}\), the operator \(\mathcal{C}_1\) is omitted from the aforementioned requirements.

      ### Proof
      In the following, we only present the proofs when \(\mathcal{H}\) is assumed to be an infinite-dimensional separable Hilbert space. When \(\mathcal{H}=\mathbb{R}^{N_d}\), the proof is similar.

      Step 1 (Well defined Bayes’ formula). Let us define
      \[
      \mathbb{P}_0:=\mathcal{N}(0,\mathcal{C}_0).
      \]
      Since \(f(S;\theta)\in\mathcal{C}_0^{\frac12}\mathcal{U}\), the measure \(\mathbb{P}^\theta_S\) is equivalent to the measure \(\mathbb{P}_0\). Then we transform the Bayes’ formulation as follows:
      \[
      \frac{d\mathbb{Q}(S,\mathbb{P}^\theta_S)}{d\mathbb{P}_0}
      =
      \frac{1}{Z_m}\exp\left(-\frac{\beta}{m}\sum_{j=1}^m\Phi(u;x_j,y_j)\right)\frac{d\mathbb{P}^\theta_S}{d\mathbb{P}_0}.
      \tag{62}
      \]
      If formula (62) is well defined, we know that the posterior density
      \[
      \frac{d\mathbb{Q}(S,\mathbb{P}^\theta_S)}{d\mathbb{P}^\theta_S}(u)
      =
      \frac{1}{Z_m}\exp\left(-\frac{\beta}{m}\sum_{j=1}^m\Phi(u;x_j,y_j)\right)
      \tag{6}
      \]
      is well defined. Let \(u_k:=\langle u,e_k\rangle\), where \(\{e_k\}_{k=1}^\infty\) denotes the complete orthonormal system of eigenfunctions associated with the covariance operator \(\mathcal{C}_0\). Based on [ref:R1], we find that
      \[
      \frac{d\mathbb{P}^\theta_S}{d\mathbb{P}_0}(u)=\exp\left(-\tilde{\Phi}(u;S)\right),
      \]
      where
      \[
      \begin{aligned}
      \tilde{\Phi}(u;S):=&-\left\langle\mathcal{C}_0(\theta_2)^{-\frac12}f_m(S;\theta_1),\mathcal{C}_0(\theta_2)^{-\frac12}(u-f_m(S;\theta_1))\right\rangle_{\mathcal{U}}
      +\frac12\left\|\mathcal{C}_0(\theta_2)^{-\frac12}f_m(S;\theta_1)\right\|_{\mathcal{U}}^2\\
      &+\frac12\sum_{k=1}^{N_c}(e^{-\theta_{2k}}-\lambda_k^{-1})u_k^2+\frac12\sum_{k=1}^{N_c}(\theta_{2k}-\ln\lambda_k).
      \end{aligned}
      \]
      Then, formula (62) can be written as
      \[
      \frac{d\mathbb{Q}(S,\mathbb{P}^\theta_S)}{d\mathbb{P}_0}
      =
      \frac{1}{Z_m}\exp\left(-\frac{\beta}{m}\sum_{j=1}^m\Phi(u;x_j,y_j)-\tilde{\Phi}(u;S)\right).
      \tag{63}
      \]
      Considering Assumption 3.1 of the main text and [ref:R2], we notice that \(u\in\mathcal{U}^{1-\tilde{s}}\) \(\mathbb{P}^\theta_S\)-a.s. when \(\tilde{s}\in(s_0,1]\). According to the theory presented in [ref:R3], we need to verify

      - (continuity condition) the potential function
      \[
      \frac{\beta}{m}\sum_{j=1}^m\Phi(u;x_j,y_j)+\tilde{\Phi}(u;S)\in C(\mathcal{U}^{1-\tilde{s}}\times(\mathcal{H}^{\alpha-s})^m;\mathbb{R}),
      \]

      - (lower bound condition) for all \(u\in\mathcal{U}^{1-\tilde{s}}\), \(y_j\in B_{\mathcal{H}^{\alpha-s}}(r):=\{y\in\mathcal{H}:\|y\|_{\mathcal{H}^{\alpha-s}}<r\}\)
      \[
      \frac{\beta}{m}\sum_{j=1}^m\Phi(u;x_j,y_j)+\tilde{\Phi}(u;S)\ge-N(r,\|u\|_{\mathcal{U}^{1-\tilde{s}}}),
      \]
      where \(N:\mathbb{R}^+\times\mathbb{R}^+\to\mathbb{R}^+\) is monotonic non-decreasing separately in each argument. In addition, \(\exp(N(r,\|u\|_{\mathcal{U}^{1-\tilde{s}}}))\in L_{\mathbb{P}_0}^1(\mathcal{U}^{1-\tilde{s}};\mathbb{R})\).

      Continuity of \(\frac{\beta}{m}\sum_{j=1}^m\Phi(u;x_j,y_j)\). For the summation \(\frac{\beta}{m}\sum_{j=1}^m\Phi(u;x_j,y_j)\), it is enough to consider one of its terms \(\Phi(u;x_j,y_j)\). For the continuity of \(u\), we have
      \[
      \begin{aligned}
      |\Phi(u_1;x_j,y_j)-\Phi(u_2;x_j,y_j)|
      &=\frac12\left|\|\Gamma^{-\frac12}\mathcal{L}_{x_j}\mathcal{G}(u_1)\|_{\mathcal{H}}^2-\|\Gamma^{-\frac12}\mathcal{L}_{x_j}\mathcal{G}(u_2)\|_{\mathcal{H}}^2\right|\\
      &\quad+\left|\left\langle\Gamma^{-\frac12}y_j,\Gamma^{-\frac12}\mathcal{L}_{x_j}\mathcal{G}(u_1)-\Gamma^{-\frac12}\mathcal{L}_{x_j}\mathcal{G}(u_2)\right\rangle_{\mathcal{H}}\right|
      \tag{64}\\
      &=\mathrm{I}_1+\mathrm{I}_2.
      \end{aligned}
      \]
      For the first term on the right-hand side of (64), we have
      \[
      \begin{aligned}
      \mathrm{I}_1
      &\le\frac{\tilde{C}^2}{2}(M_1(\|u_1\|_{\mathcal{U}^{1-\tilde{s}}})+M_1(\|u_2\|_{\mathcal{U}^{1-\tilde{s}}}))\|\mathcal{C}_1^{-\frac{\tilde{s}}{2}}\Gamma^{-\frac12}\mathcal{L}_{x_j}(\mathcal{G}(u_1)-\mathcal{G}(u_2))\|_{\mathcal{H}}\\
      &\le\frac{\tilde{C}^2}{2}(M_1(\|u_1\|_{\mathcal{U}^{1-\tilde{s}}})+M_1(\|u_2\|_{\mathcal{U}^{1-\tilde{s}}}))
      M_2(\|u_1\|_{\mathcal{U}^{1-\tilde{s}}},\|u_2\|_{\mathcal{U}^{1-\tilde{s}}})
      \|u_1-u_2\|_{\mathcal{U}^{1-\tilde{s}}},
      \tag{65}
      \end{aligned}
      \]
      where
      \[
      \tilde{C}:=\|\mathcal{C}_1^{\frac{\tilde{s}}{2}}\|_{\mathcal{B}(\mathcal{H})}
      \]
      is the operator norm of \(\mathcal{C}_1^{\frac{\tilde{s}}{2}}\). For the second term on the right-hand side of (64), we have
      \[
      \begin{aligned}
      \mathrm{I}_2
      &\le\|y_j\|_{\mathcal{H}^{\alpha-s}}\|\mathcal{C}_1^{-\frac{\tilde{s}}{2}}\Gamma^{-\frac12}(\mathcal{L}_{x_j}\mathcal{G}(u_1)-\mathcal{L}_{x_j}\mathcal{G}(u_2))\|_{\mathcal{H}}\\
      &\le\|y_j\|_{\mathcal{H}^{\alpha-s}}M_2(\|u_1\|_{\mathcal{U}^{1-\tilde{s}}},\|u_2\|_{\mathcal{U}^{1-\tilde{s}}})\|u_1-u_2\|_{\mathcal{U}^{1-\tilde{s}}}.
      \tag{66}
      \end{aligned}
      \]
      From estimates (64), (65), and (66), we obtain the continuity of \(\Phi\) for the parameter \(u\). For the variable \(y_j\), we have
      \[
      \begin{aligned}
      |\Phi(u;x_j,y_j)-\Phi(u;x_j,y_j')|
      &=\left|\left\langle\Gamma^{-\frac12}(y_j-y_j'),\Gamma^{-\frac12}\mathcal{L}_{x_j}\mathcal{G}(u)\right\rangle_{\mathcal{H}}\right|
      +\frac12\sum_{k=1}^{N_c}|e^{-\theta_{2k}}-\lambda_k^{-1}||u_{1k}^2-u_{2k}^2|\\
      &\le\|y_j-y_j'\|_{\mathcal{H}^{\alpha-s}}M_1(\|u\|_{\mathcal{U}^{1-\tilde{s}}})
      +\frac12N_c(e^{-\theta_{\min}}+\lambda_{N_c}^{-1})\max_{1\le k\le N_c}|u_{1k}^2-u_{2k}^2|,
      \end{aligned}
      \]
      which implies the continuity of \(\Phi\) for the variable \(y_j\). Hence, we proved
      \[
      \frac{\beta}{m}\sum_{j=1}^m\Phi(u;x_j,y_j)\in C(\mathcal{U}^{1-\tilde{s}}\times(\mathcal{H}^{\alpha-s})^m;\mathbb{R}).
      \tag{67}
      \]

      Continuity of \(\tilde{\Phi}(u;S)\). For the continuity of \(u\), we have
      \[
      \begin{aligned}
      |\tilde{\Phi}(u_1,S)-\tilde{\Phi}(u_2,S)|
      &\le\left|\left\langle\mathcal{C}_0(\theta_2)^{-\frac12}f_m(S;\theta_1),\mathcal{C}_0(\theta_2)^{-\frac12}(u_1-u_2)\right\rangle_{\mathcal{U}}\right|
      \tag{68}\\
      &\le\lambda_1e^{-\theta_{\min}}\|f_m(S;\theta_1)\|_{\mathcal{U}^{1+\tilde{s}}}\|u_1-u_2\|_{\mathcal{U}^{1-\tilde{s}}}.
      \end{aligned}
      \]
      Let \(S=\{(x_j,y_j)\}_{j=1}^m\) and \(S'=\{(x_j,y_j')\}_{j=1}^m\). We have
      \[
      \begin{aligned}
      |\tilde{\Phi}(u,S)-\tilde{\Phi}(u,S')|
      &=\left|\left\langle\mathcal{C}_0(\theta_2)^{-\frac12}(f_m(S;\theta_1)-f(S';\theta_1)),\mathcal{C}_0(\theta_2)^{-\frac12}u\right\rangle_{\mathcal{U}}\right|\\
      &\quad+\frac32\left|\|\mathcal{C}_0(\theta_2)^{-\frac12}f(S';\theta_1)\|_{\mathcal{U}}^2-\|\mathcal{C}_0(\theta_2)^{-\frac12}f_m(S;\theta_1)\|_{\mathcal{U}}^2\right|
      \tag{69}\\
      &\le\lambda_1e^{-\theta_{\min}}\|f_m(S;\theta_1)-f(S';\theta_1)\|_{\mathcal{U}^{1+\tilde{s}}}\|u\|_{\mathcal{U}^{1-\tilde{s}}}\\
      &\quad+\frac{3\lambda_1e^{-\theta_{\min}}}{2}\left(\|f_m(S;\theta_1)\|_{\mathcal{U}^1}+\|f(S';\theta_1)\|_{\mathcal{U}^1}\right)
      \|f_m(S;\theta_1)-f(S';\theta_1)\|_{\mathcal{U}^1}.
      \end{aligned}
      \]
      Combining estimates (68) and (69), and the assumptions
      \[
      \|f(S;\theta)-f(S';\theta)\|_{\mathcal{U}^{1+\tilde{s}}}\to0,
      \quad\text{as }x_j\to x_j'\text{ in }\mathcal{X}\text{ and }y_j\to y_j'\text{ in }\mathcal{H}^{\alpha-s},
      \tag{70}
      \]
      we obtain
      \[
      \tilde{\Phi}(u;S)\in C(\mathcal{U}^{1-\tilde{s}}\times(\mathcal{H}^{\alpha-s})^m;\mathbb{R}).
      \]

      To verify the lower bound condition, we have
      \[
      \begin{aligned}
      \frac{\beta}{m}\sum_{j=1}^m\Phi(u;x_j,y_j)
      &\ge-\frac{\beta}{m}\sum_{j=1}^m\|\mathcal{C}_1^{\frac{\tilde{s}}{2}}\Gamma^{-\frac12}y_j\|_{\mathcal{H}}\|\mathcal{C}_1^{-\frac{\tilde{s}}{2}}\Gamma^{-\frac12}\mathcal{L}_{x_j}\mathcal{G}(u)\|_{\mathcal{H}}\\
      &\ge-\frac{\beta}{m}\sum_{j=1}^m\|y_j\|_{\mathcal{H}^{\alpha-s}}M_1(\|u\|_{\mathcal{U}^{1-\tilde{s}}})\\
      &\ge-\frac{1}{4\delta_1}\left(\frac{\beta}{m}\sum_{j=1}^m\|y_j\|_{\mathcal{H}^{\alpha-s}}\right)^2-\delta_1M_1(\|u\|_{\mathcal{U}^{1-\tilde{s}}})^2,
      \tag{71}
      \end{aligned}
      \]
      and
      \[
      \begin{aligned}
      \tilde{\Phi}(u,S)
      &=-\left\langle\mathcal{C}_0(\theta_2)^{-\frac12}f_m(S;\theta_1),\mathcal{C}_0(\theta_2)^{-\frac12}u\right\rangle_{\mathcal{U}}+\frac32\|\mathcal{C}_0(\theta_2)^{-\frac12}f_m(S;\theta_1)\|_{\mathcal{U}}^2\\
      &\quad+\frac12\sum_{k=1}^{N_c}(e^{-\theta_{2k}}-\lambda_k^{-1})u_k^2+\frac12\sum_{k=1}^{N_c}(\theta_{2k}-\ln\lambda_k)\\
      &\ge-\lambda_1e^{-\theta_{\min}}\|f_m(S;\theta_1)\|_{\mathcal{U}^{1+\tilde{s}}}\|u\|_{\mathcal{U}^{1-\tilde{s}}}
      +\frac{3\lambda_1}{2e^{\theta_{\min}}}\|\mathcal{C}_0^{-\frac12}f_m(S;\theta_1)\|_{\mathcal{U}}^2\\
      &\quad+\frac12\sum_{k=1}^{N_c}(e^{-\theta_{2k}}-\lambda_k^{-1})u_k^2+\frac12\sum_{k=1}^{N_c}(\theta_{2k}-\ln\lambda_k)
      \tag{72}\\
      &\ge-\delta_2\|u\|_{\mathcal{U}^{1-\tilde{s}}}^2
      -\left(\frac{\lambda_1^2}{4\delta_2e^{2\theta_{\min}}}-\frac{3\lambda_1}{2e^{\theta_{\min}}}\right)\|f(S;\theta)\|_{\mathcal{U}^{1+\tilde{s}}}^2\\
      &\quad+\frac12\sum_{k=1}^{N_c}(e^{-\theta_{2k}}-\lambda_k^{-1})u_k^2+\frac12\sum_{k=1}^{N_c}(\theta_{2k}-\ln\lambda_k).
      \end{aligned}
      \]
      According to the assumptions on \(M_1(\cdot)\) and [ref:R4], we know that
      \[
      \mathbb{E}_{u\sim\mathbb{P}_0^\theta}\exp\left(\delta_1M_1(\|u\|_{\mathcal{U}^{1-\tilde{s}}})^2+\delta_2\|u\|_{\mathcal{U}^{1-\tilde{s}}}^2\right)<+\infty,
      \tag{73}
      \]
      when \(\delta_1\) and \(\delta_2\) are chosen to be small enough positive numbers. Considering inequality (73) and
      \[
      \|f(S;\theta)\|_{\mathcal{U}^{1+\tilde{s}}}\le M(r)
      \quad\text{if }\|y_j\|_{\mathcal{H}^{\beta-s}}\le r,\quad (j=1,\dots,m),
      \]
      we easily find that the lower bound condition is fulfilled.

      Step 2 (Stability with respect to datasets). From the definition of Hellinger distance, we have
      \[
      d_{\mathrm{Hell}}(\mathbb{Q}(S,\mathbb{P}^\theta_S),\mathbb{Q}(S',\mathbb{P}^\theta_{S'}))^2\le I_1+I_2,
      \]
      where
      \[
      \begin{aligned}
      I_1=&\frac{1}{Z_m}\int_{\mathcal{U}^{1-\tilde{s}}}\Bigg[\exp\left(-\frac{\beta}{2m}\sum_{j=1}^m\Phi(u;x_j,y_j)-\frac12\tilde{\Phi}(u;S)\right)\\
      &-\exp\left(-\frac{\beta}{2m}\sum_{j=1}^m\Phi(u;x_j',y_j')-\frac12\tilde{\Phi}(u;S')\right)\Bigg]^2\mathbb{P}_0(du),
      \end{aligned}
      \]
      and
      \[
      I_2=
      \left|Z_m^{-\frac12}-(Z_m')^{-\frac12}\right|^2
      \int_{\mathcal{U}^{1-\tilde{s}}}\exp\left(-\frac{\beta}{m}\sum_{j=1}^m\Phi(u;x_j',y_j')-\tilde{\Phi}(u;S')\right)\mathbb{P}_0(du),
      \]
      where \(Z_m'\) is the normalization constant concerned with the datasets \(S'\). For the term \(I_1\), we have
      \[
      I_1\le\frac{1}{2Z_m}\int_{\mathcal{U}^{1-\tilde{s}}}e^{N(r,\|u\|_{\mathcal{U}^{1-\tilde{s}}})}(I_{11}+I_{12})\mathbb{P}_0(du),
      \]
      where
      \[
      I_{11}=\left|\frac{\beta}{m}\sum_{j=1}^m\left[\Phi(u;x_j,y_j)-\Phi(u;x_j',y_j')\right]\right|^2,
      \]
      \[
      I_{12}=\left|\tilde{\Phi}(u;S)-\tilde{\Phi}(u;S')\right|^2.
      \]
      For the term \(I_{11}\), we firstly consider the following calculations:
      \[
      \begin{aligned}
      \Phi(u;x_j,y_j)-&\Phi(u;x_j',y_j')\\
      =&\frac12\|\Gamma^{-\frac12}\mathcal{L}_{x_j}\mathcal{G}(u)\|_{\mathcal{H}}^2-\frac12\|\Gamma^{-\frac12}\mathcal{L}_{x_j'}\mathcal{G}(u)\|_{\mathcal{H}}^2\\
      &+\left\langle\Gamma^{-\frac12}y_j',\Gamma^{-\frac12}\mathcal{L}_{x_j'}\mathcal{G}(u)\right\rangle_{\mathcal{H}}
      -\left\langle\Gamma^{-\frac12}y_j',\Gamma^{-\frac12}\mathcal{L}_{x_j}\mathcal{G}(u)\right\rangle_{\mathcal{H}}\\
      &+\left\langle\Gamma^{-\frac12}y_j',\Gamma^{-\frac12}\mathcal{L}_{x_j}\mathcal{G}(u)\right\rangle_{\mathcal{H}}
      -\left\langle\Gamma^{-\frac12}y_j,\Gamma^{-\frac12}\mathcal{L}_{x_j}\mathcal{G}(u)\right\rangle_{\mathcal{H}},
      \end{aligned}
      \]
      which implies that
      \[
      \begin{aligned}
      |\Phi(u;x_j,y_j)-\Phi(u;x_j',y_j')|
      &\le\tilde{C}^2M_1(\|u\|_{\mathcal{U}^{1-\tilde{s}}})\|\mathcal{C}_1^{-\frac{\tilde{s}}{2}}\Gamma^{-\frac12}(\mathcal{L}_{x_j}\mathcal{G}(u)-\mathcal{L}_{x_j'}\mathcal{G}(u))\|_{\mathcal{H}}\\
      &\quad+M_1(\|u\|_{\mathcal{U}^{1-\tilde{s}}})\|y_j-y_j'\|_{\mathcal{H}^{\alpha-s}}
      +\|y_j\|_{\mathcal{H}^{\alpha-s}}\|\mathcal{C}_1^{-\frac{\tilde{s}}{2}}\Gamma^{-\frac12}(\mathcal{L}_{x_j}\mathcal{G}(u)-\mathcal{L}_{x_j'}\mathcal{G}(u))\|_{\mathcal{H}}.
      \tag{74}
      \end{aligned}
      \]
      The above estimate (74) yields the following result:
      \[
      I_{11}\to0,
      \quad\text{as }x_j\to x_j'\text{ in }\mathcal{X}\text{ and }y_j\to y_j'\text{ in }\mathcal{H}^{\alpha-s}.
      \tag{75}
      \]
      Concerning the term \(I_{12}\), estimate (69) already implies
      \[
      I_{12}\to0,
      \quad\text{as }x_j\to x_j'\text{ in }\mathcal{X}\text{ and }y_j\to y_j'\text{ in }\mathcal{H}^{\alpha-s}.
      \tag{76}
      \]
      Combining the above statements (75) and (76), we finally obtain
      \[
      I_1\to0,
      \quad\text{as }x_j\to x_j'\text{ in }\mathcal{X}\text{ and }y_j\to y_j'\text{ in }\mathcal{H}^{\alpha-s}
      \tag{77}
      \]
      by applying [ref:R5]. For the term \(I_2\), we have
      \[
      I_2\le C\max\left(Z_m^{-3},(Z_m')^{-3}\right)|Z_m-Z_m'|^2.
      \]
      Similar to the derivation of (77), we can prove \(Z_m\to Z_m'\) as \(x_j\to x_j'\) in \(\mathcal{X}\) and \(y_j\to y_j'\) in \(\mathcal{H}^{\alpha-s}\). Hence, we easily obtain
      \[
      I_2\to0,
      \quad\text{as }x_j\to x_j'\text{ in }\mathcal{X}\text{ and }y_j\to y_j'\text{ in }\mathcal{H}^{\alpha-s}.
      \tag{78}
      \]
      \(\square\)

