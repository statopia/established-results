      ###### Statement
      Let \(X'\subseteq X\) and assume that \(\Phi\in C(X'\times Y;\mathbb R)\). Assume further that there are functions \(M_i:\mathbb R^+\times\mathbb R^+\to\mathbb R^+\), \(i=1,2\), monotonic non-decreasing separately in each argument, and with \(M_2\) strictly positive, such that for all \(u\in X'\) and \(y,y_1,y_2\in B_Y(0,r)\),
