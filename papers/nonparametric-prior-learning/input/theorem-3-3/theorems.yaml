      ##### Definitions and notation
      Let \((\Omega,\Sigma,\mu)\) be a measure space. Let \(f_n:\Omega\to\mathbb R\), \(n\ge1\), and \(f:\Omega\to\mathbb R\) be \(\Sigma\)-measurable functions. The statement \(f_n\to f\) \(\mu\)-almost everywhere means that there is a set \(N\in\Sigma\) with \(\mu(N)=0\) such that \(f_n(\omega)\to f(\omega)\) for every \(\omega\notin N\). The notation \(g\in L^1(\mu)\) means that \(g:\Omega\to[0,\infty]\) is \(\Sigma\)-measurable and \(\int_\Omega g\,d\mu<\infty\). Integrals are Lebesgue integrals with respect to \(\mu\). Real-valued functions are stated; for complex-valued functions one replaces \(|\cdot|\) by the complex modulus.

      ##### Assumptions
      - \((\Omega,\Sigma,\mu)\) is a measure space.
