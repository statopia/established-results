      \tilde{\Phi}(u;S):=&-\left\langle\mathcal{C}_0(\theta_2)^{-\frac12}f_m(S;\theta_1),\mathcal{C}_0(\theta_2)^{-\frac12}(u-f_m(S;\theta_1))\right\rangle_{\mathcal{U}}
      +\frac12\left\|\mathcal{C}_0(\theta_2)^{-\frac12}f_m(S;\theta_1)\right\|_{\mathcal{U}}^2\\
