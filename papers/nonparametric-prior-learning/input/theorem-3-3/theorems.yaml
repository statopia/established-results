      ##### Proposition 1.13 (Prato 2006, *An Introduction to Infinite-Dimensional Analysis*)
      ###### Definitions and notation
      Let \((\mathcal{B},\|\cdot\|_{\mathcal{B}})\) be a separable Banach space with Borel \(\sigma\)-algebra \(\mathcal{B}(\mathcal{B})\). A Borel probability measure \(\mu\) on \(\mathcal{B}\) is Gaussian if for every continuous linear functional \(\ell\in\mathcal{B}^*\), the law of \(\ell\) under \(\mu\) is a Gaussian probability measure on \(\mathbb{R}\). In the Hilbert-space setting used by the current proof, this is the usual Gaussian measure \(\mathcal{N}(m,\mathcal{C})\) on a separable Hilbert space; \(\|\cdot\|_{\mathcal{B}}\) is then the relevant Hilbert norm, for example a norm on \(\mathcal{U}\) or on a Hilbert scale \(\mathcal{U}^{t}\).

      ###### Assumptions
      \(\mu\) is a Gaussian Borel probability measure on a separable Banach space \(\mathcal{B}\). The exact hypotheses of the original Proposition 1.13 were not retrieved. If the book states the result for a separable Hilbert space instead of a general separable Banach space, replace \(\mathcal{B}\) by that Hilbert space; the precise source wording is unconfirmed.

      ###### Statement
      Source-unconfirmed standard Fernique-type content: There exists a constant \(\alpha>0\), depending on \(\mu\) and the norm \(\|\cdot\|_{\mathcal{B}}\), such that
      \[
      \int_{\mathcal{B}} \exp\!\left(\alpha\|x\|_{\mathcal{B}}^2\right)\,\mu(dx)<+\infty .
      \]
      No numerical value of \(\alpha\) is asserted. This is the exponential-square integrability of a Gaussian measure on a separable Banach space.

