      Formalization clarifications from source and proof:
      1. Constants and quantifier order. The selected result is the scalar Bernstein bound owned by the heading “Uniform concentration argument” and equation \eqref{eq:profiled_scalar_bernstein}; it cites no named external theorem. Its own wording is “For \(N\) independent centered variables \(U_l\) ... there is an absolute \(b>0\),” and the proof again says “for an absolute \(b>0\).” The intended order is: a universal absolute \(b>0\) can be chosen once, independent of \(N\), \(V\), \(t\), the index \(l\), the laws of the \(U_l\), and the random outcomes; then for every positive integer \(N\), every mutually independent centered real family \(U_1,\dots,U_N\), every \(V>0\) satisfying the moment bound for all \(l\) and all integers \(r\ge2\), and every \(t>0\), the displayed inequality holds. The source leaves the numerical value of \(b\) unspecified. \(V\) is a parameter of the hypothesis, not an absolute constant; the same \(V\) is used for all \(l\) and all \(r\). Different laws are explicitly allowed only under “the same moment bound” and same \(V\). The quantitative constant conventions in the main and supplementary sources (“depend only on fixed regularity parameters ... not silently on sample sizes or dimensions”) do not authorize dependence of this absolute \(b\) on \(N,V,t,U_l\) or their laws. There is no dimension \(p\) or \(q\), no event set, and no distributional parameter \(L\) in the scalar theorem itself; do not add implicit Lean parameters that would change uniformity. The downstream phrase “for any fixed confidence exponent \(c>0\), constants \(C,N_0>0\) can be chosen ...” and the constants in Lemma \ref{lem:error_sample_covariance2} belong to those applications, not to the scalar theorem; they may have the dependencies stated there, but they do not change the scalar bound’s absolute \(b\). The source does not explicitly say \(N\ge1\) in the short statement, but the average \(\frac1N\sum_{l=1}^N\) requires a positive integer \(N\).

      2. Norms and mathematical objects. The theorem is entirely scalar: the only norm-like operation is the real absolute value in \(\mathbb P(|N^{-1}\sum_l U_l|>t)\) and in \(\mathbb E|U_l|^r\). Here \(U_l\) are real centered variables, \(t>0\), \(V>0\), \(r\in\mathbb Z_{\ge2}\), and \(r!\) is factorial. Do not replace these by Euclidean \(\ell_2\), sup, operator, Frobenius, or \(\|B\|_{2,\infty}\) norms. The later language “Take a union bound over the \(2pq\) entries” and “The maximum row norm is at most \(\sqrt q\) times the maximum absolute entry” belongs to Lemma \ref{lem:error_sample_covariance2} and the “Uniform concentration argument” application, not to the scalar Bernstein statement. That downstream application concerns \(f(H)^\top H/N\) and \(E^\top H/N\), not \(f(H)^\top f(H)\), but this is not part of the selected scalar theorem.

      3. Asymptotics. The selected inequality is finite-sample and has no \(O\), \(o\), \(O_p\), \(o_p\), limit filter, or “for sufficiently large \(N\)” clause. For each admissible \(N\), \(V\), independent centered family, and every \(t>0\), the bound holds exactly with the factor \(2\exp[-bN\min(t^2/V^2,t/V)]\). The event uses strict \(>t\), not \(\ge t\). The downstream “Consequently, for any fixed confidence exponent \(c>0\), constants \(C,N_0>0\) can be chosen so that ... whenever \(N\ge N_0\log p\)” is a separate finite-sample application owned by “Uniform concentration argument” and Lemma \ref{lem:error_sample_covariance2}; there \(c\) is fixed before the constants, and the lemma’s displayed failure probability is \(p^{-c}/20\), not automatically \(p^{-c}\). No asymptotic relation such as \(n_s\gg n_t\) is part of the scalar theorem.

      4. Omitted definitions and side conditions. “Centered” means \(\mathbb E U_l=0\). “Independent” means mutual independence across \(l\); the statement and proof explicitly say “the same proof applies to independent variables with different laws,” so identical distribution must not be added. The moment assumption is \(\mathbb E|U_l|^r\le r!V^r\) for all integers \(r\ge2\), not all real \(r\), and not uncentered moments. The proof uses \(\log\mathbb E e^{\theta U_l}\le2V^2\theta^2\) for \(|\theta|V\le1/2\), then independence, exponential Markov, and an optimization over \(\theta\); these are proof details, not additional theorem hypotheses. The source does not specify the exact numerical absolute \(b\), nor the base of the logarithm in the proof (natural \(\log\) is the conventional reading, but it is not spelled out here). No measurability, probability-space, or \(N=0\) convention is stated; the average requires \(N\ge1\). The broader Assumption 1.a, sub-Gaussian \(L\), \(E,H,f\), and \(\mathbb E[EH^\top]=0\) are used to obtain \(V\) and apply the scalar bound coordinatewise in Lemma \ref{lem:error_sample_covariance2}; they are not extra assumptions of the selected scalar Bernstein bound.
      <!-- /formalization-clarifications -->

      For \(N\) independent centered variables \(U_l\) with \(\mathbb E|U_l|^r\le r!V^r\) for all integers \(r\ge2\) (with some \(V>0\); the same proof applies to independent variables with different laws and the same moment bound), there is an absolute \(b>0\) such that for all \(t>0\),
      \[
      \mathbb P\left(\left|\frac{1}{N}\sum_{l=1}^N U_l\right|>t\right)
      \le 2\exp[-bN\min(t^2/V^2,t/V)].
      \]
    assumptions: []
    proof_body: |-
      In the supplement’s “Uniform concentration argument,” for \(N\) independent centered variables \(U_l\) with
      \[
      \mathbb E|U_l|^r\le r!V^r
      \]
      for all integers \(r\ge2\), expanding the exponential series gives
      \[
      \log\mathbb E e^{\theta U_l}\le 2V^2\theta^2
      \qquad (|\theta|V\le1/2).
      \]
      Independence, exponential Markov, and optimization with
      \[
      \theta=\min\left(\frac{t}{4V^2},\frac{1}{2V}\right)
      \]
      yield
      \[
      \mathbb P\left(\left|\frac{1}{N}\sum_{l=1}^N U_l\right|>t\right)
      \le 2\exp\left[-bN\min\left(\frac{t^2}{V^2},\frac{t}{V}\right)\right]
      \]
      for an absolute \(b>0\). The same proof applies to independent variables with different laws and the same moment bound.
