      ##### Content basis
      The retrieved source is the supplement file `supp.tex` for “Deconfounding via Profiled Transfer Learning” (main article attributed to Ziyuan Chen, Yifan Jiang, Jingyuan Liu, and Fang Yao; supplement authors not supplied), located in section “Detailed Proofs and Technique Lemmas”, subsection “Lemmas for Theorem 1”, paragraph “Uniform concentration argument”. This paragraph is not presented as a separately numbered theorem or lemma; it supplies the common scalar moment bound and scalar Bernstein concentration argument used in the five concentration bounds below, including weighted ones. It argues the moment bound from the sub-Gaussian tail bound by giving coordinate \(L^r\) moments at most \(B\sqrt r\), applying Cauchy--Schwarz to a product, and then centering, after possibly enlarging the constant \(V\). In the current target proof, this paragraph supports the weighted-sum concentration step by allowing the summands, after the normalization using \(\|d_k\|_1\le \sqrt q B_\phi\), to be treated by scalar Bernstein over all source rows and a union over the relevant coordinates. That \(T_\phi\)-specific application is a local use in the current proof, not an additional source-labeled result in this paragraph.

      ##### Definitions and notation
      For \(r\ge2\), \(L^r\)-moment means \(\mathbb E|\cdot|^r\). The source considers centered products of two coordinates among \(E,H,f(H),X,\varepsilon\), under the uniform sub-Gaussian bounds from the surrounding context. Let \(V>0\) be a fixed constant depending only on those uniform sub-Gaussian bounds. For deterministic \(u\), let \(D\) be a nonnegative bound with \(\|u\|_1\le D\). For the scalar Bernstein step, let \(U_l\) be independent centered scalar variables, \(N\) their number, \(t>0\) a deviation level, and \(\theta\in\mathbb R\). Let \(p\) denote the dimension parameter used in the union bound, \(q\) the fixed parameter entering the \(pq\) coordinate count, \(c>0\) the confidence exponent, and \(C,N_0,b>0\) positive constants.

      ##### Assumptions
      The source’s quantitative constant convention applies: constants and probability-decay exponents in quantitative bounds are strictly positive unless explicitly assigned another range, and they do not silently depend on sample sizes or dimensions. The coordinate variables among \(E,H,f(H),X,\varepsilon\) satisfy the uniform sub-Gaussian bounds of the surrounding source context. The products used in the moment bound are centered. For the linear-combination moment bound, \(u\) is deterministic with \(\|u\|_1\le D\). For the scalar Bernstein inequality, the \(U_l\) are independent and centered with \(\mathbb E|U_l|^r\le r!V^r\) for all integers \(r\ge2\); the same moment bound is allowed for variables with different laws.

      ##### Statement
      There is a fixed \(V>0\), depending only on the uniform sub-Gaussian bounds, such that any centered product of two coordinates among \(E,H,f(H),X,\varepsilon\) has moments bounded by
      \[
       \mathbb E|\text{centered product}|^r \le r!V^r
      \]
      for all integers \(r\ge2\), after enlarging \(V\) if necessary. For deterministic \(u\) with \(\|u\|_1\le D\), the same bound for a linear combination of such centered products is \(r!(VD)^r\), by the triangle inequality in \(L^r\). This moment argument requires no independence between the two factors in a single product.

      For \(N\) independent centered variables \(U_l\) with \(\mathbb E|U_l|^r\le r!V^r\), expanding the exponential series gives
      \[
       \log \mathbb E e^{\theta U_l}\le 2V^2\theta^2
       \qquad\text{for } |\theta|V\le \frac12.
      \]
      Independence, exponential Markov, and optimization with
      \[
       \theta=\min\left(\frac{t}{4V^2},\frac{1}{2V}\right)
      \]
      yield
      \[
       \mathbb P\left(\left|\frac1N\sum_{l=1}^N U_l\right|>t\right)
       \le 2\exp\left[-bN\min\left(\frac{t^2}{V^2},\frac{t}{V}\right)\right]
      \]
      for an absolute \(b>0\). The same proof applies to independent variables with different laws and the same moment bound.

      Consequently, for any fixed confidence exponent \(c>0\), constants \(C,N_0>0\) can be chosen so that, over a family of at most \(p^2\) or \(pq\) coordinates, the simultaneous deviation bound \(C\sqrt{\log p/N}\) fails with probability at most \(p^{-c}/20\), whenever \(N\ge N_0\log p\). Since \(q\) is fixed, its factor in the union bound is absorbed by the choice of \(C,N_0\), not by changing \(c\) silently. For a normalization \(D=0\), the corresponding random variable is identically zero and its deviation bound is deterministic.
