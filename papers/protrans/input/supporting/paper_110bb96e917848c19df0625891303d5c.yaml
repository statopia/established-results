      ##### Scalar Bernstein inequality (eq:profiled_scalar_bernstein)
      ###### Definitions and notation
      Let \(N\) be the sample size and let \(U_1,\ldots,U_N\) be real-valued random variables. Let \(V>0\) be a fixed constant, and let \(r\) denote the moment order in
      \[
      \mathbb E|U_l|^r\le r!V^r .
      \]
      In the preceding “Uniform concentration argument” paragraph, this moment bound is stated for all integers \(r\ge 2\). Let \(\theta\) be a real parameter with \(|\theta|V\le 1/2\), and let \(t>0\) denote the deviation level. The absolute constant \(b>0\) in the displayed probability bound is independent of the parameters.

      ###### Assumptions
      The variables \(U_1,\ldots,U_N\) are independent and centered:
      \[
      \mathbb E U_l=0,\qquad l=1,\ldots,N.
      \]
      There is a fixed \(V>0\) such that, for the relevant moment orders,
      \[
      \mathbb E|U_l|^r\le r!V^r .
      \]
      In the source’s common moment-bound paragraph this is stated for all integers \(r\ge2\). The log-moment-generating-function bound below is stated under the additional restriction
      \[
      |\theta|V\le \frac12.
      \]
      The same scalar argument is explicitly stated to apply also when the independent variables have different laws, provided they share the same moment bound.

      ###### Statement
      For \(N\) independent centered variables \(U_l\) satisfying
      \[
      \mathbb E|U_l|^r\le r!V^r,
      \]
      expanding the exponential series gives
      \[
      \log \mathbb E e^{\theta U_l}\le 2V^2\theta^2
      \qquad\text{for }|\theta|V\le \frac12 .
      \]
      Independence, exponential Markov, and optimization with
      \[
      \theta=\min\!\left(\frac{t}{4V^2},\frac{1}{2V}\right)
      \]
      yield
      \[
      \mathbb P\left(\left|\frac1N\sum_{l=1}^N U_l\right|>t\right)
       \le 2\exp\!\left[-bN\min\!\left(\frac{t^2}{V^2},\frac{t}{V}\right)\right]
      \]
      for an absolute \(b>0\). The same proof applies to independent variables with different laws and the same moment bound.

      ##### Coordinate-wise union-bound consequence (unnamed “Consequently” statement)
      ###### Definitions and notation
      Let \(p,q\) be the dimension parameters appearing in the union bound, with \(q\) fixed. Let \(c>0\) be the confidence exponent, and let \(C,N_0>0\) be constants. The statement concerns deviations in at most \(p^2\) or \(pq\) coordinates.

      ###### Assumptions
      The scalar Bernstein inequality above is available for the \(N\) independent centered variables with the same moment bound. The confidence exponent \(c>0\) is fixed. The factor \(q\) is fixed, so that its contribution to the union bound is absorbed by the choice of constants rather than by changing \(c\). The sample size satisfies
      \[
      N\ge N_0\log p.
      \]

      ###### Statement
      Consequently, for any fixed confidence exponent \(c>0\), constants \(C,N_0>0\) can be chosen so that deviations
      \[
      C\sqrt{\frac{\log p}{N}}
      \]
      in at most \(p^2\) or \(pq\) coordinates fail with probability at most
      \[
      p^{-c}/20,
      \]
      whenever
      \[
      N\ge N_0\log p.
      \]
      Since \(q\) is fixed, its factor in the union bound is absorbed by the choice of \(C,N_0\), not by changing \(c\) silently. For a normalization \(D=0\) the corresponding random variable is identically zero and its deviation bound is deterministic.

      #### Reference R2
      Target: Uniform concentration argument (common moment bound for centered products)

      Citation: “We give the common scalar argument used in all five concentration bounds below, including the weighted ones. There is a fixed \(V>0\), depending only on the uniform sub-Gaussian bounds, such that any centered product of two coordinates among \(E,H,f(H),X,\varepsilon\) has moments bounded by \(r!V^r\) for all integers \(r\ge2\) (enlarge \(V\) if necessary). Indeed, the sub-Gaussian tail bound gives coordinate moments at most \(B\sqrt r\) in \(L^r\); applying Cauchy--Schwarz to a product and then centering gives a bound \((B' r)^r\le r!V^r\) after changing the constant. For deterministic \(u\) with \(\|u\|_1\le D\), the same bound for a linear combination of such centered products is \(r!(VD)^r\), by the triangle inequality in \(L^r\). This argument requires no independence between the two factors in a single product.” Used in the proof as: “Since \(\|d_k\|_1\le\sqrt q B_\phi\), the common moment argument applies after division by \(\sqrt q B_\phi\).”

