      ##### Lemma \ref{lem:error_sample_covariance_sparse}
      ###### Definitions and notation
      Let \(p\ge 2\), \(K\ge1\), and let \(n_s^{(1)},\dots,n_s^{(K)}\) be positive integers with
      \[
      n_s=\sum_{k=1}^K n_s^{(k)}.
      \]
      For each \(k=1,\dots,K\), let \(X_s^{(k)}\in\mathbb R^{n_s^{(k)}\times p}\) denote the \(k\)-th source covariate matrix, whose rows are the source covariate vectors \(X_{si}^{(k)}\). Let
      \[
      \Sigma_X=\mathbb E[XX^\top],\qquad a_s=\sqrt{\frac{\log p}{n_s}}.
      \]
      The vectors \(\delta_k\in\mathbb R^p\) are deterministic. For vectors, \(\|\cdot\|_1\) denotes the usual \(\ell_1\)-norm and \(\|\cdot\|_\infty\) the maximum norm. For a matrix, \(\|\cdot\|_\infty\) denotes the largest absolute entry.

