      ##### Lemma \(\ref{lem:error_noise}\)

      ###### Definitions and notation
      Let \(p\) be the covariate dimension and let \(N\) be a positive integer sample size. Consider \(N\) independent rows with covariate matrix \(X\) and noise vector \(\varepsilon\), so that \(X^\top\varepsilon/N\in\mathbb R^p\). For vectors, \(\|\cdot\|_\infty\) denotes the usual maximum norm; equivalently, for this vector, \(\|X^\top\varepsilon/N\|_\infty\) is the largest absolute coordinate of \(X^\top\varepsilon/N\). For matrices, the source convention is that \(\|\cdot\|_\infty\) denotes the largest absolute entry.

      In the target/pooled-source interpretation, \(X\) and \(\varepsilon\) are respectively \((X_t,\varepsilon_t)\) with \(N=n_t\), or the row-stacked source design and noise vectors with total sample size \(N=n_s=\sum_{k=1}^K n_s^{(k)}\).

      The source constant convention applies: all constants in the quantitative upper bound are strictly positive unless otherwise stated, and the requested confidence exponent \(c>0\) is fixed before choosing the constants. The noise variance is denoted \(\sigma^2\).

      ###### Assumptions
      Assumption 1 (\(\ref{assum:distribution_E_H_f}\)) parts a–b, as cited by the lemma:

      1. **Assumption 1.a.** All target and source rows are mutually independent. The pairs \((E,H)\) have the same joint distribution in every domain, and the same function \(f\) is used in \(X=f(H)+E\). The coordinates of \(E\), \(H\), and \(f(H)\) are centered and have sub-Gaussian norms at most a fixed \(L\). Moreover, \(\mathbb E[EH^\top]=0\). Independence of \(E\) and \(H\) is not required.

      2. **Assumption 1.b.** The centered noise terms are independent of their corresponding \((E,H)\), have common variance \(\sigma^2\ge 0\), and have sub-Gaussian norm at most a fixed \(L_\varepsilon\). The coefficients in the model are deterministic.

      The lemma is stated for \(N\ge N_\varepsilon\log p\) independent rows, with the independent-row structure supplied by Assumption 1.a.

      ###### Statement
      Under Assumptions 1.a–b, for every \(c>0\) there are \(C_\varepsilon,N_\varepsilon>0\) such that for \(N\ge N_\varepsilon\log p\) independent rows,
      \[
       \mathbb P\left(\|X^\top\varepsilon/N\|_\infty
             \le C_\varepsilon\sqrt{\log p/N}\right)\ge1-p^{-c}/20.
      \]
      These constants work for both target and pooled source rows, including zero noise variance.
