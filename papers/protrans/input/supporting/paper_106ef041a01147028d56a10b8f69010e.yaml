      ##### Lemma \ref{lem:error_sample_covariance1}
      ###### Definitions and notation
      The lemma is stated in the notation of the supplement’s proof of Theorem 1. In
      \[
       \|X^\top X/N-\Sigma_X\|_\infty,
      \]
      \(X\) denotes an \(N\times p\) sample matrix whose rows are independent and have the common covariate law; \(\Sigma_X=\mathbb E[XX^\top]\) for a generic row. In the surrounding setup, \(p\ge2\) is the covariate dimension, \(q\ge1\) is fixed, and \(N\) is a positive sample size.

      For a matrix, \(\|\cdot\|_\infty\) denotes the largest absolute entry, not an operator norm or a maximum row-sum norm. The covariates satisfy the decomposition \(X=f(H)+E\), with the same \(f\) in all domains. The rows have a common covariate law because the pairs \((E,H)\) have the same joint distribution in every domain under Assumption 1.a.

      The target design is \(X_t\in\mathbb R^{n_t\times p}\). The source designs are \(X_s^{(k)}\in\mathbb R^{n_s^{(k)}\times p}\), \(1\le k\le K\), with
      \[
       n_s=\sum_{k=1}^K n_s^{(k)}.
      \]
      The target and pooled source Gram matrices are
      \[
       G_t=\frac{X_t^\top X_t}{n_t},\qquad
       G_s=\frac{\sum_{k=1}^K X_s^{(k)\top}X_s^{(k)}}{n_s}.
      \]
      The quantities \(a_t,a_s\) appearing in the target application are
      \[
       a_t=\sqrt{\frac{\log p}{n_t}},\qquad
       a_s=\sqrt{\frac{\log p}{n_s}}.
      \]

      ###### Assumptions
      The lemma assumes Assumption 1.a. In the supplied reading context this says: all target and source rows are mutually independent; the pairs \((E,H)\) have the same joint distribution in every domain; the same \(f\) is used in \(X=f(H)+E\); the coordinates of \(E,H,f(H)\) are centered with sub-Gaussian norms at most a fixed \(L\); and \(\mathbb E[EH^\top]=0\). Independence of \(E\) and \(H\) is not required.

      The supplement’s quantitative constant convention applies: all constants in quantitative upper bounds and probability-decay exponents are strictly positive unless explicitly assigned another range; they depend only on the fixed regularity parameters specified in the relevant statement and are not silently dependent on sample sizes or dimensions. The confidence exponent \(c>0\) is fixed before choosing \(C_x,N_x\). The lemma itself invokes only Assumption 1.a, not the remaining numbered parts of Assumption 1.

      ###### Statement
      Under Assumption 1.a, for every \(c>0\) there are \(C_x,N_x>0\) such that for \(N\ge N_x\log p\) independent rows with the common covariate law,
      \[
       \mathbb P\left(\|X^\top X/N-\Sigma_X\|_\infty
                       \le C_x\sqrt{\log p/N}\right)\ge1-p^{-c}/20.
      \]
      The same constants work for the target rows and for all pooled source rows.

