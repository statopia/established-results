      \[
      a_s=\sqrt{\log p\over n_s},\qquad
      \Sigma_X=\mathbb E[XX^\top],\qquad
      M=\mathbb E[XH^\top].
      \]
      Under Assumption 1.a, \(\mathbb E[EH^\top]=0\), so also \(M=\mathbb E[f(H)H^\top]\).

      For a matrix, \(\|\cdot\|_\infty\) denotes the largest absolute entry. For a vector, \(\|\cdot\|_2\) is the Euclidean norm and \(\|\cdot\|_\infty\) is the usual maximum norm. The vectors \(d_k\) lie in \(\mathbb R^q\).

