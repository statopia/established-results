      ##### Lemma \ref{lem:error_sample_covariance2}
      ###### Definitions and notation
      Let \(p\ge 2\) and \(q\ge 1\) be fixed, and let \(N\) be a positive integer. Let \(E_i\in\mathbb R^p\), \(H_i\in\mathbb R^q\), and let \(f:\mathbb R^q\to\mathbb R^p\). The \(N\) rows are independent and have the common joint law of \((E,H)\) specified by Assumption 1.a. Write
      \[
      H=\begin{pmatrix}H_1^\top\\ \vdots\\ H_N^\top\end{pmatrix}\in\mathbb R^{N\times q},
      \qquad
      E=\begin{pmatrix}E_1^\top\\ \vdots\\ E_N^\top\end{pmatrix}\in\mathbb R^{N\times p},
      \]
      and let \(f(H)\in\mathbb R^{N\times p}\) have rows \(f(H_i)^\top\). Thus
      \[
      f(H)^\top H=\sum_{i=1}^N f(H_i)H_i^\top\in\mathbb R^{p\times q},
      \qquad
      E^\top H=\sum_{i=1}^N E_iH_i^\top\in\mathbb R^{p\times q}.
      \]
      The population matrix in the statement is
      \[
      M_f=\mathbb E[f(H)H^\top]\in\mathbb R^{p\times q}.
      \]

      For a matrix, \(\|\cdot\|_\infty\) denotes the largest absolute entry; for a vector it is the usual maximum norm. For a matrix \(B\),
      \[
      \|B\|_{2,\infty}=\max_j\|B_{j,:}\|_2,
      \]
      the maximum Euclidean row norm.

      By the supplement’s quantitative constant convention, all constants in quantitative upper bounds and probability-decay exponents are strictly positive unless explicitly assigned another range; they depend only on the fixed regularity parameters specified in the relevant statement, not silently on sample sizes or dimensions. In particular, \(C_H,N_H\) may be chosen after \(c>0\) and may depend on the fixed distributional bound \(L\) and the fixed \(q\), but not on \(N\) or \(p\). The source does not specify the base of \(\log p\); it is absorbed into the constants.

      ###### Assumptions
      Assumption 1.a (the part of Assumption \ref{assum:distribution_E_H_f} invoked by the lemma): all target and source rows are mutually independent; the pairs \((E,H)\) have the same joint distribution in every domain; the same function \(f\) is used in the relation \(X=f(H)+E\); the coordinates of \(E\), \(H\), and \(f(H)\) are centered with sub-Gaussian norms at most a fixed \(L>0\); and
      \[
      \mathbb E[EH^\top]=0.
      \]
      Independence of \(E\) and \(H\) is not required. For the lemma, these conditions are applied to the \(N\) independent rows with the common law of \((E,H)\).

      ###### Statement
      Under Assumption 1.a, put \(M_f=\mathbb E[f(H)H^\top]\). For every \(c>0\) there exist \(C_H,N_H>0\) such that, for every \(N\ge N_H\log p\) and every collection of \(N\) independent rows with the common law, simultaneously
      \[
      \|f(H)^\top H/N-M_f\|_{2,\infty}
      \le C_H\sqrt{q\log p/N},
      \qquad
      \|E^\top H/N\|_{2,\infty}\le C_H\sqrt{q\log p/N},
      \]
      with probability at least \(1-p^{-c}/20\).

