      ##### Lemma \ref{lem:weighted_confounding_transfer}

      ###### Definitions and notation
      Let \(p\) be the covariate dimension and \(q\) the dimension of the hidden-confounder vectors; \(q\) is fixed and appears explicitly in the lemma’s bound. For source groups \(k=1,\ldots,K\), let \(n_s^{(k)}\ge1\) be the source sample sizes and let
