      ##### Uniform concentration argument (uniform product-moment bound)
      ###### Definitions and notation
      Let \(r\ge2\) be an integer. The source considers coordinates among \(E,H,f(H),X,\varepsilon\). A centered product of two coordinates means the product minus its expectation. \(V>0\) is a fixed constant depending only on the uniform sub-Gaussian bounds; it may be enlarged. \(D\) is a deterministic bound appearing in \(\|u\|_1\le D\) for a deterministic coefficient vector \(u\) of a linear combination of such centered products. The \(L^r\)-norm is the usual \((\mathbb E|\cdot|^r)^{1/r}\). The supplied passage does not restate the precise sub-Gaussian norm convention.

      ###### Assumptions
      The coordinates among \(E,H,f(H),X,\varepsilon\) have the uniform sub-Gaussian bounds used in the supplement. \(r\ge2\) is an integer. For the linear-combination assertion, \(u\) is deterministic and satisfies \(\|u\|_1\le D\). No independence between the two factors in a single product is required. Constants are positive under the supplement’s quantitative constant convention.

      ###### Statement
      There is a fixed \(V>0\), depending only on the uniform sub-Gaussian bounds, such that any centered product \(Z\) of two coordinates among \(E,H,f(H),X,\varepsilon\) has moments bounded by
      \[
      \mathbb E|Z|^r\le r!V^r
      \]
      for all integers \(r\ge2\) (enlarge \(V\) if necessary). For deterministic \(u\) with \(\|u\|_1\le D\), the same bound for a linear combination of such centered products is
      \[
      \mathbb E\left|\sum_j u_j Z_j\right|^r\le r!(VD)^r
      \]
      for all integers \(r\ge2\), by the triangle inequality in \(L^r\). This argument requires no independence between the two factors in a single product.

      ##### Scalar Bernstein bound (eq:profiled_scalar_bernstein)
      ###### Definitions and notation
      Let \(N\) be a positive integer. Let \(U_1,\dots,U_N\) be independent centered random variables. Let \(V>0\) be a common fixed moment-bound parameter, and let \(b>0\) be an absolute constant. The intermediate exponential-series estimate is stated for \(\theta\) under the condition \(|\theta|V\le1/2\). The displayed probability inequality uses a parameter \(t\); no separate range for \(t\) is stated. The base of logarithms is not specified.

      ###### Assumptions
      \(N\) is a positive integer. \(U_1,\dots,U_N\) are independent and centered. There is a common fixed \(V>0\) such that
      \[
      \mathbb E|U_l|^r\le r!V^r
      \]
      for all integers \(r\ge2\) and all \(l=1,\dots,N\). The variables need not have the same law; the source explicitly says that the same proof applies to independent variables with different laws and the same moment bound. The quantitative constant convention of the supplement applies, and \(b>0\) is absolute.

      ###### Statement
      In the above setting, expanding the exponential series gives, for \(|\theta|V\le1/2\),
      \[
      \log\mathbb E e^{\theta U_l}\le2V^2\theta^2
      \]
      for each \(l\). Independence, exponential Markov, and optimization with
      \[
      \theta=\min\left(\frac{t}{4V^2},\frac{1}{2V}\right)
      \]
      yield the scalar Bernstein bound
      \[
      \mathbb P\left(\left|\frac1N\sum_{l=1}^N U_l\right|>t\right)
      \le2\exp\left[-bN\min\left(\frac{t^2}{V^2},\frac{t}{V}\right)\right],
      \tag{eq:profiled_scalar_bernstein}
      \]
      for an absolute \(b>0\). The same proof applies to independent variables with different laws and the same moment bound.

