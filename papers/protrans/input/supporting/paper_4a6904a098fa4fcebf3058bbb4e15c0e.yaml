      Source extraction from D1, supplement `supp.tex`, subsection “Lemmas for Theorem 1”, paragraph “Uniform concentration argument” (immediately preceding Lemma `lem:error_sample_covariance1`). The supplement is the Supplementary Material for the main article “Deconfounding via Profiled Transfer Learning” by Ziyuan Chen, Yifan Jiang, Jingyuan Liu, and Fang Yao; supplement authors are not supplied.

      The paragraph contains three directly relevant source statements:

      - the uniform product-moment bound for centered coordinate products;
      - the scalar Bernstein inequality labeled `eq:profiled_scalar_bernstein`;
      - the union-bound consequence over at most \(p^2\) or \(pq\) coordinates.

      These respectively support the moment verification for centered coordinate products, the scalar concentration step, and the union over \(p^2\) entries with constants \(C_x,N_x\) in the current target. The source gives a derivation sketch for the scalar inequality; that proof is not reproduced here. No external article theorem number, page, or separate bibliography entry for this scalar inequality is supplied.

      ##### Equation eq:profiled_scalar_bernstein (scalar Bernstein inequality)

      ###### Definitions and notation
      \(N\) is a positive integer. \(U_1,\dots,U_N\) are real-valued random variables, \(\mathbb E\) denotes expectation, and \(V>0\) is the constant appearing in the moment bound. The integer \(r\) ranges over \(r\ge2\). The parameters satisfy \(\theta,t\in\mathbb R\), and \(b>0\) is an absolute constant. The inequality is labeled
      \[
      \eqref{eq:profiled_scalar_bernstein}.
      \]

      ###### Assumptions
      The variables \(U_1,\dots,U_N\) are independent and centered. There is a fixed \(V>0\) such that
      \[
      \mathbb E|U_l|^r\le r!V^r
      \]
      for every integer \(r\ge2\) and every \(l=1,\dots,N\). The variables need not have the same law: the source states that the same proof applies to independent variables with different laws and the same moment bound.

      ###### Statement
      For \(N\) independent centered variables \(U_l\) with
      \[
      \mathbb E|U_l|^r\le r!V^r
      \qquad (r\ge2),
      \]
      expanding the exponential series gives
      \[
      \log\mathbb E e^{\theta U_l}\le 2V^2\theta^2
      \qquad\text{for }|\theta|V\le \frac12.
      \]
      Independence, exponential Markov, and optimization with
      \[
      \theta=\min\left(\frac{t}{4V^2},\frac{1}{2V}\right)
      \]
      yield
      \[
      \mathbb P\left(\left|\frac1N\sum_{l=1}^N U_l\right|>t\right)
      \le 2\exp\!\left[-bN\min\left(\frac{t^2}{V^2},\frac{t}{V}\right)\right]
      \]
      for an absolute \(b>0\). The same proof applies to independent variables with different laws and the same moment bound.

      ##### Uniform product-moment bound

      ###### Definitions and notation
      The statement concerns centered products of two coordinates among the random quantities \(E,H,f(H),X,\varepsilon\) appearing in the source’s uniform sub-Gaussian setup. A centered product of coordinates \(A,B\) means
      \[
      AB-\mathbb E[AB].
      \]
      The symbol \(L^r\) denotes the usual \(L^r\)-norm. The constant \(V>0\) is fixed and depends only on the uniform sub-Gaussian bounds. The integer \(r\) satisfies \(r\ge2\). For a deterministic vector \(u\), \(D\ge0\) is such that \(\|u\|_1\le D\), where \(\|\cdot\|_1\) is the \(\ell_1\)-norm.

      ###### Assumptions
      The coordinates among \(E,H,f(H),X,\varepsilon\) satisfy the uniform sub-Gaussian bounds from the source’s Assumption 1 setup. No independence between the two factors in a single product is required.

      ###### Statement
      There is a fixed \(V>0\), depending only on the uniform sub-Gaussian bounds, such that for every integer \(r\ge2\), any centered product of two coordinates among \(E,H,f(H),X,\varepsilon\) has \(r\)-th moment bounded by
      \[
      r!V^r
      \]
      (enlarging \(V\) if necessary). For deterministic \(u\) with \(\|u\|_1\le D\), the same bound for a linear combination of such centered products is
      \[
      r!(VD)^r.
      \]
      The argument requires no independence between the two factors in a single product.

      ##### Union-bound consequence over at most \(p^2\) or \(pq\) coordinates

      ###### Definitions and notation
      \(p,q\) are positive integers, and \(q\) is fixed. \(c>0\) is a fixed confidence exponent. \(N\) is the sample size, and \(C,N_0>0\) are constants. The statement concerns simultaneous deviation bounds in at most \(p^2\) or \(pq\) scalar coordinates. The base of \(\log p\) is not specified in the source and is absorbed into constants.

      ###### Assumptions
      Each coordinate is a scalar average of the form
      \[
      \frac1N\sum_{l=1}^N U_l
      \]
      of independent centered variables satisfying the moment bound of the scalar Bernstein result, with the same moment bound allowed for variables having different laws. The exponent \(c>0\) is fixed before choosing \(C,N_0\). The factor \(q\) corresponds to a fixed quantity and is absorbed into the choice of constants.

      ###### Statement
      For any fixed confidence exponent \(c>0\), constants \(C,N_0>0\) can be chosen so that deviations
      \[
      C\sqrt{\frac{\log p}{N}}
      \]
      in at most \(p^2\) or \(pq\) coordinates fail with probability at most
      \[
      \frac{p^{-c}}{20},
      \]
      whenever
      \[
      N\ge N_0\log p.
      \]
      Since \(q\) is fixed, its factor in the union bound is absorbed by the choice of \(C,N_0\), not by changing \(c\) silently.
