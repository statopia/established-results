      \]
      For each \(k=1,\ldots,K\), let \(X_s^{(k)}\in\mathbb R^{n_s^{(k)}\times p}\) denote the \(k\)-th source design matrix, whose rows are the source covariate vectors. Write
      \[
       \Sigma_X=\mathbb E[XX^\top].
      \]
      For a matrix, \(\|\cdot\|_\infty\) denotes the largest absolute entry; for a vector it denotes the usual maximum norm. Also \(\|\delta_k\|_1\) is the usual \(\ell_1\)-norm on \(\mathbb R^p\). The quantity \(s_\delta\) is a nonnegative deterministic bound on the \(\ell_1\)-norms of the deterministic vectors \(\delta_k\), and \(c>0\) is an arbitrary positive confidence exponent.

      ###### Assumptions
      The lemma is stated under Assumption 1.a of the main paper, where Assumption 1 is \(\ref{assum:distribution_E_H_f}\). The applicable setup and condition are:

      Let \(p\ge2\), let \(q\ge1\) be fixed, let \(K\ge1\), and let
      \(n_t,n_s^{(1)},\ldots,n_s^{(K)}\) be positive integers, with
      \[
       n_s=\sum_{k=1}^K n_s^{(k)}\ge n_t.
      \]
