      ##### Lemma \(\ref{lem:error_sample_covariance_sparse}\)

      ###### Definitions and notation
      Let \(p\ge2\), let \(q\ge1\) be fixed, let \(K\ge1\), and let \(n_t,n_s^{(1)},\ldots,n_s^{(K)}\) be positive integers, with
      \[
