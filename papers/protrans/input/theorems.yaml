      - All target and source sample rows are mutually independent.
      - The pairs \((E,H)\) have the same joint distribution in every domain, and the same function \(f\) is used in \(X=f(H)+E\).
      - Coordinates of \(E,H,f(H)\) are centered and have sub-Gaussian norms at most a fixed \(L>0\), uniformly over all coordinates and domains.
