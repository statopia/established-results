  - id: entry:selected:8a487260-0147-4613-8d36-1bd4c76966af
    title: Theorem 1 (thm:upper_bound_of_eta; corrected model-shift Lasso bounds with explicit positive constants and weighted confounding transfer)
    kind: theorem
    latex_statement: |-
      Consider the confounded model with data \((X_{ti}, Y_{ti})\) drawn from our target population:
      \begin{align}
      \label{eq:target_model}
          Y_{ti} = \beta_t^\top X_{ti} + \phi_t^\top H_{ti} + \varepsilon_{ti},\quad X_{ti} = f(H_{ti}) +E_{ti}, \ i = 1, \dots, n_t,
      \end{align}
      where \(n_t\) is the target sample size, which is typically small. The coefficient vector \(\beta_t\in \mathbb{R}^p\), which links the response variable \(Y_{ti} \in \mathbb{R}\) to the observed covariates \(X_{ti} \in \mathbb{R}^p\), is often of primary interest. Let \(H_{ti}\in \mathbb{R}^q\), where \(q\) is fixed, denote the hidden confounders, and \(\phi_t^\top H_{ti}\), where \(\phi_t\in \mathbb{R}^q\), represents the confounding effect in the target model. The function \(f: \mathbb{R}^{q}\to\mathbb{R}^p\) is an unknown mapping that describes the confounding structure in \(X_{ti}\) and the error term \(E_{ti}\in \mathbb{R}^p\) is assumed to be uncorrelated with \(H_{ti}\). The pure noise term \(\varepsilon_{ti}\in \mathbb{R}\) is assumed to be independent of \(X_{ti}, \ H_{ti}\) and \(E_{ti}\). For identification, we further assume that \(X_{ti},Y_{ti},H_{ti},E_{ti}\) and \(\varepsilon_{ti}\) all have zero mean. 

      Model \eqref{eq:target_model} is a structural equation model, which is widely used to describe the general causal relationships among covariates, response, and hidden confounders \citep{fox2002structural,pearl2012causal}. The presence of hidden confounders \(H_{ti}\) inevitably introduces bias when estimating \(\beta_t\). Denote the design matrix for the covariates by \(X_t=(X_{t1},\ldots,X_{tn_t})^\top\in\mathbb{R}^{n_t\times p}\), and analogously denote \(Y_t\in \mathbb{R}^{n_t}, H_t\in \mathbb{R}^{n_t\times q},E_t\in \mathbb{R}^{n_t\times p}\) and \(\varepsilon_t\in \mathbb{R}^{n_t}\).

      Assume \(K\) source datasets are available. For each \(k, \ k=1,\ldots,K\), we observe i.i.d. source data \((X^{(k)}_{s},Y^{(k)}_{s})\) from the \(k\)-th source model 
      \begin{align}
      \label{eq:source_model}
          Y^{(k)}_{si} = \beta_s^{(k)\top} X^{(k)}_{si} + \phi_s^{(k)\top} H^{(k)}_{si} + \varepsilon^{(k)}_{si},\quad X^{(k)}_{si} = f(H^{(k)}_{si}) +E^{(k)}_{si}, \ i=1,\cdots,n_s^{(k)},
      \end{align}
      where the notations are parallel to those in the target model \eqref{eq:target_model}.  
      Denote the total sample size of all sources as \(n_s = \sum_{k=1}^K n_s^{(k)}\), and assume \(n_s\gg n_t\).  
      In order to utilize the extensive source information to improve the estimation of target parameters, transfer learning frameworks typically decompose the parameter of interest \(\beta_t\) in the target model \eqref{eq:target_model} into two components: the average source effect \(\beta_s = \sum_{k=1}^K n_s^{(k)}\beta_s^{(k)}/n_s\) and the model shift \(\eta_0 = \beta_t-\beta_s\) from sources to target. 

      We first focus on the model shift \(\eta_0\), and propose a profiled transfer technique that leverages the shared confounding structure between the source models \eqref{eq:source_model} and the target model \eqref{eq:target_model} to mitigate the estimation bias of \(\eta_0\). Let \(\hat{\beta}_{\text{init}}\) be some initial estimator for \(\beta_s\). Note that \(\hat{\beta}_{\text{init}}\) requires only mild conditions (to be stated in Theorem \ref{thm:upper_bound_of_eta}), and need not be deconfounded in advance. Then we define the profiled source residual \(\hat{Z}_s^{(k)} = Y^{(k)}_s - X^{(k)}_s\hat{\beta}_{\text{init}}\in \mathbb{R}^{n_s^{(k)}}\). Intuitively, the residual \(\hat{Z}_s^{(k)}\) encodes information about hidden confounders in the \(k\)-th source model, specifically,
      \begin{align*}
          \hat{Z}_s^{(k)} = X_s^{(k)}\left(\beta_s^{(k)} - \hat{\beta}_{\text{init}}\right) + H_s^{(k)} \phi_s^{(k)} + \varepsilon_s^{(k)}.
      \end{align*}

      A confounding-free LASSO estimator for the model shift \(\eta_0 = \beta_t - \beta_s\) can be obtained as
      \begin{align}
      \label{eq:estimator_of_eta}
          \hat{\eta} = \argmin_{\eta \in \mathbb{R}^p }\left\{\frac{1}{n_t}\left\|Y_t - X_t \hat{\beta}_{\text{init}} - \hat{Z}_t - X_t \eta \right\|_2^2 +  \lambda_t \|\eta\|_1\right\},
      \end{align}
      under the high-dimensional setting with a sparse \(\eta_0\). 

      To construct a reasonable profiled target residual \(\hat{Z}_t\), the profiled target residual \(\hat{Z}_t\) is constructed through the profiled residual transfer:
      \begin{align}
      \label{eq:bias_correction_term}
          \hat{Z}_t = \argmin_{Z_t \in \mathbb{R}^{n_t}}\left\{\left\|\frac{1}{n_t}X_t^\top Z_t - \frac{1}{n_s}\sum_{k=1}^K X_s^{(k)\top}\hat{Z}_s^{(k)}\right\|_{\infty}\right\}.
      \end{align}
      The effectiveness of transferring the confounding effects from sources to the target by \eqref{eq:bias_correction_term} requires only mild assumptions about the confounding structure \(f(\cdot)\).

      First, we define the parameter space for the source parameters \(\beta_s^{(k)}\) and the target parameter \(\beta_t\) as 
      \begin{align*}
          \Theta(s_\delta,s_\eta) = \left\{\beta_s^{(k)},\beta_t\ \big|\ \|\beta_s^{(k)} - \beta_s\|_1 \le s_\delta, \|\eta_0\|_0\le s_\eta, k=1,2,\cdots,K\right\}. 
      \end{align*}
      In this section, we consider the case where \(s_\delta\) is a constant and \(s_\eta = o(n_t^{1/2})\). This parameter space requires that the difference between each source parameter \(\beta_s^{(k)}\) and the average \(\beta_s\) is bounded, and that the model shift \(\eta_0\) is sparse. This condition is common in high-dimensional regression when transferring parameters from source to target. We denote the support set of \(\eta_0\) as \(S_\eta\) and its complement as \(S_\eta^c\).

      <!-- formalization-clarifications:v1:0a242fab0bb212786a1b18a2c69cc616894bf968bd5c491aac0d3b9422904498 -->
      Formalization clarifications from source and proof:
      1. Constants and quantifiers. The displayed theorem fixes c>0 and states that there exist positive N0,C1,C2 “depending only on L,L_epsilon,q,C_phi,B_phi,C_s,s_delta,c” before imposing “n_t >= N0 log p” and “lambda_t >= 4(C1 sqrt(q)||phi_t||_2 + C2) sqrt(log p/n_t) > 0” (Theorem thm:upper_bound_of_eta). Thus the intended order is: fix the Assumption 1 parameters, the deterministic coefficient bounds s_eta, |S_eta|<=s_eta, s_delta, the initial-error bound C_s, and the confidence exponent c; choose N0,C1,C2; then the conclusion is uniform over admissible p, K, sample sizes with n_s>=n_t and n_t>=N0 log p, admissible distributions satisfying the fixed L,L_epsilon bounds, coefficients satisfying the stated B_phi and s_delta constraints, supports S_eta of size <=s_eta, all profiling minimizers, all Lasso minimizers, and all initial estimators satisfying event I. The explicit dependency list does not include p, n_t, n_s, K, phi_t, beta_t or beta_s^(k), the random rows, S_eta, s_eta, C_r, or lambda_t; C_r and s_eta occur in the conclusion and in lambda_t’s lower bound, but not in the listed dependencies of N0,C1,C2. By contrast, q is fixed and explicitly allowed, and c is allowed. The proof is consistent: it sets C1=8C_H and C2=2B0+C_epsilon, with B0 depending on C_x,C_s,C_delta,s_delta,C_d,B_phi,L_M,C_phi,C_epsilon (“C1=8C_H and C2=2B0+C_epsilon. All dependencies are as stated in the theorem”). Do not let constants depend on hidden random vectors or on p merely because Lean has them as implicit parameters; an implicit parameter does not by itself make a constant uniform. The source’s convention says constants are “chosen before the sample sizes and dimensions” and may depend on fixed distributional bounds, fixed q, and c. The section text also says s_delta is constant and s_eta=o(n_t^{1/2}), but this o-condition is not in the displayed theorem; the proof says “No asymptotic o(a_t) term or unspecified relation n_s >> n_t is used,” and the formal hypothesis used is n_s>=n_t.

      2. Norms and objects. For vectors, ||·||_1 is the usual l1 norm on R^p, ||·||_2 the Euclidean norm, and ||·||_infty the maximum norm. For matrices, “||·||_infty denotes the largest absolute entry,” not an operator or sup-row-sum norm; and “||B||_{2,infty}=max_j ||B_{j,:}||_2” is the maximum Euclidean row norm, not a Frobenius or operator norm (Notation and constant ranges; Reference R1). The target/source designs are X_t in R^{n_t x p}, X_s^(k) in R^{n_s^(k) x p}, with G_t=X_t^T X_t/n_t and G_s=sum_k X_s^(k)^T X_s^(k)/n_s; Sigma_X=E[XX^T] and M=E[XH^T]=E[f(H)H^T] because E[EH^T]=0. The objects T_beta and T_phi must be kept as defined: T_beta=(1/n_s)sum_k (X_s^(k)^T X_s^(k)-n_s^(k)Sigma_X) delta_k and T_phi=(1/n_s)sum_k (X_s^(k)^T H_s^(k)-n_s^(k)M)d_k, with delta_k=beta_s^(k)-beta_s, d_k=phi_s^(k)-phi_t, and beta_s=sum_k(n_s^(k)/n_s)beta_s^(k); the source explicitly warns that one “cannot replace the weighted centered sum by a pooled matrix multiplied by an averaged coefficient vector.” Likewise A_s is the exact weighted sum sum_k X_s^(k)^T H_s^(k) phi_s^(k)/n_s, not the pooled matrix times bar-phi_s. The profiled target residual is defined by minimizing the max norm of X_t^T Z_t/n_t minus b over Z_t in R^{n_t}, with b=sum_k X_s^(k)^T \hat Z_s^(k)/n_s; it is generally nonunique, and the theorem speaks of “any minimizer \hat Z_t” and “every minimizer \hat eta.” The Lasso objective uses the unnormalized squared Euclidean norm on R^{n_t} divided by n_t plus lambda_t||eta||_1. The final prediction norm is the sample Euclidean norm ||X_t(\hat eta-eta_0)||_2/sqrt(n_t). The restricted-eigenvalue event uses n_t^{-1}||X_t u||_2^2 >= C_r||u||_2^2 on the cone ||u_{S_eta^c}||_1<=3||u_{S_eta}||_1; eta_0=beta_t-beta_s, S_eta=supp(eta_0), and s_eta=0 is included. The source does not specify a tie-breaking rule for nonunique \hat Z_t or \hat eta; for probability statements it requires measurable selections.

      3. Asymptotics and probability. The displayed theorem is nonasymptotic: it gives event probability at least 1-p^{-c}, with c>0 fixed, and deterministic error bounds on G intersect R intersect I; the final probability statement is “at least 1-p^{-c}-P(R^c)-P(I^c)” (Theorem thm:upper_bound_of_eta). Here R is the restricted-eigenvalue event from Assumption 1.c and I={||\hat beta_init-beta_s||_1<=C_s}; both are separate from G. The proof defines G as the intersection of ten concentration events G_1,...,G_9,G_10^phi (Proof of Theorem 1; Reference R1 Lemma lem:high_probability_set). The theorem does not use O_P or o_P, and the proof explicitly avoids an unspecified n_s >> n_t comparison. The main-text phrases “s_eta=o(n_t^{1/2})” and “n_s >> n_t” are contextual/asymptotic discussion; they are not among the displayed theorem’s hypotheses. If formalizing an asymptotic regime, record such assumptions separately rather than silently strengthening or weakening the nonasymptotic theorem. lambda_t is any positive scalar satisfying the displayed lower bound; the source does not specify in the theorem whether lambda_t is data-dependent, independent of the sample, or chosen by cross-validation. The simulation section mentions cross-validation, but that is not part of Theorem 1. The no-independence statement is explicit: “No independence of the initial estimator and the samples is needed: the proof is uniform over initial estimators on I.”

      4. Omitted definitions and owners of cited facts. Assumption 1.a says all target and source rows are mutually independent; the pairs (E,H) have the same joint distribution in every domain; the same f is used in X=f(H)+E; coordinates of E,H,f(H) are centered with sub-Gaussian norms at most fixed L, uniformly over coordinates and domains; E[EH^T]=0; independence of E and H is not required. Assumption 1.b says centered noise is independent of its corresponding (E,H), has common variance sigma^2>=0, and sub-Gaussian norm at most fixed L_epsilon; coefficients are deterministic. The source average beta_s is sample-size weighted with w_k=n_s^(k)/n_s, and n_s=sum_k n_s^(k)>=n_t. Event R is a separate restricted-eigenvalue event; event I controls only ||\hat beta_init-beta_s||_1, not each source coefficient separately. Reference R1, Lemma lem:high_probability_set, owns the simultaneous event G, its ten displayed components, and the Gram-matrix bounds; Lemma lem:error_sample_covariance1 independently owns the single-sample Gram concentration and states the same constants work for target and pooled source rows. Reference R2, Lemma lem:error_sample_covariance_sparse, owns the T_beta bound under deterministic ||delta_k||_1<=s_delta; beta_s’s definition gives sum_k w_k delta_k=0, but the quoted sparse lemma as supplied does not require that zero-average condition, so do not add it as a lemma hypothesis. Reference R3, Lemma lem:weighted_confounding_transfer, owns the T_phi bound under deterministic ||d_k||_2<=B_phi; the inequality for ||A_t-A_s||_infty is a proof-derived consequence, not a separately labeled universal lemma. References R4 and R5, Lemmas lem:error_sample_covariance2 and lem:error_noise, own, respectively, the bounds for f(H)^T H/N-M_f and E^T H/N, and for X^T epsilon/N; the displayed factor 2C_H and the four-way simultaneous D_t,D_s,e_t,e_s bound are proof applications, not assumptions of those lemmas. These cited lemmas are universal under their stated independent-row assumptions; their use on target rows or pooled source rows does not restrict them to those applications. The source leaves unspecified the logarithm base, the exact construction/selection of lambda_t, the tie-breaking of nonunique minimizers, and the precise formal role of the prose asymptotic s_eta=o(n_t^{1/2}); none of those should be invented.
      <!-- /formalization-clarifications -->

      Under Assumption \ref{assum:distribution_E_H_f}, suppose
      \(s_\eta\in\{0,\ldots,p\}\), \(|S_\eta|\le s_\eta\) and \(\max_k\|\beta_s^{(k)}-\beta_s\|_1\le s_\delta\).
      Fix a desired confidence exponent \(c>0\). There exist strictly positive
      constants \(N_0,C_1,C_2\), depending only on
      \(L,L_\varepsilon,q,C_\phi,B_\phi,C_s,s_\delta,c\), such that for
      \(n_t\ge N_0\log p\) and any
      \[
       \lambda_t\ge4(C_1\sqrt q\|\phi_t\|_2+C_2)\sqrt{\log p/n_t}>0,
      \]
      there is an event \(\mathcal G\) with \(\mathbb P(\mathcal G)\ge1-p^{-c}\) on
      which every minimizer \(\hat\eta\) of the estimator displayed with label \texttt{eq:estimator_of_eta} in Definitions and notation, using any
      minimizer \(\hat Z_t\) of the profiled residual transfer displayed with label \texttt{eq:bias_correction_term} in Definitions and notation, satisfies, whenever
      \(\mathcal R\) and \(\mathcal I=\{\|\hat\beta_{\mathrm{init}}-\beta_s\|_1\le C_s\}\) hold,
      \begin{align*}
       \|\hat\eta-\eta_0\|_1&\le {6\over C_r}s_\eta\lambda_t, &
       \|\hat\eta-\eta_0\|_2&\le {3\over2C_r}\sqrt{s_\eta}\lambda_t, &
       {\|X_t(\hat\eta-\eta_0)\|_2\over\sqrt{n_t}}
       &\le {3\over2\sqrt{C_r}}\sqrt{s_\eta}\lambda_t.
      \end{align*}
      The statement is unconditional with confidence \(1-p^{-c}\) when the RE and
      initial-estimator bounds are imposed almost surely. More generally the
      probability of all three conclusions is at least
      \(1-p^{-c}-\mathbb P(\mathcal R^c)-\mathbb P(\mathcal I^c)\).
      For probability statements, estimators are understood to be measurable
      selections; the deterministic bounds hold for every profiling and Lasso
      minimizer. No independence of the initial estimator and the samples is
      needed: the proof is uniform over initial estimators on \(\mathcal I\).
    assumptions:
      - |-
        Convention for quantitative constants. All constants used as upper-bound multipliers, sample-size thresholds or probability-decay exponents in the theorem and lemma statements below are strictly positive, unless a different range is explicitly specified. They are chosen before the sample sizes and dimensions to which a bound is applied. They may depend on the explicitly fixed distributional bounds, fixed confounder dimension and requested confidence exponent. This convention does not impose a sign on model coefficients, entries of matrices or other algebraically defined quantities.

        \begin{assump}
        \label{assum:distribution_E_H_f}
        Let \(p\ge2\), let \(q\ge1\) be fixed, let \(K\ge1\), and let
        \(n_t,n_s^{(1)},\ldots,n_s^{(K)}\) be positive integers, with
        \(n_s=\sum_k n_s^{(k)}\ge n_t\). Put \(w_k=n_s^{(k)}/n_s\) and
        \(a_t=\sqrt{\log p/n_t}\), \(a_s=\sqrt{\log p/n_s}\).
        \begin{enumerate}
        \item[a.] All target and source sample rows are mutually independent. The
        pairs \((E,H)\) have the same joint distribution in every domain, and the same
        function \(f\) is used in \(X=f(H)+E\). Coordinates of \(E,H,f(H)\) are centered
        and have sub-Gaussian norms at most a fixed \(L>0\), uniformly over all
        coordinates and domains. Moreover \(\mathbb E[EH^\top]=0\). Independence
        between \(E\) and \(H\) is not required.
        \item[b.] The centered noise terms are independent of their corresponding
        \((E,H)\), have a common variance \(\sigma^2\ge0\), and have sub-Gaussian norm
        at most a fixed \(L_\varepsilon>0\). The model coefficients are deterministic.
        \item[c.] On the restricted-eigenvalue event \(\mathcal R\), for every
        \(u\in\mathcal A_{s_\eta}
        =\{u: \|u_{S_\eta^c}\|_1\le3\|u_{S_\eta}\|_1\}\),
        \(n_t^{-1}\|X_tu\|_2^2\ge C_r\|u\|_2^2\), where \(C_r>0\) is fixed.
        \item[d.] With \(\bar\phi_s=\sum_k w_k\phi_s^{(k)}\), there are fixed
        \(C_\phi,B_\phi>0\) such that
        \[
         \|\bar\phi_s-\phi_t\|_2\le C_\phi a_t,
         \qquad \max_{1\le k\le K}\|\phi_s^{(k)}-\phi_t\|_2\le B_\phi.
        \]
        The first condition is the original weighted-average similarity condition.
        The second is a uniform bound on source heterogeneity; it does not require
        each source's discrepancy to tend to zero. The constants \(L,L_\varepsilon,
        C_r,C_\phi,B_\phi\), the initial-error bound \(C_s>0\) and the source-coefficient
        spread bound \(s_\delta\ge0\) are independent of \(p,n_t,n_s,K\).
        \end{enumerate}
        \end{assump}
    proof_body: |-
      ### Definitions and notation used in Proof
      \paragraph{Notation and constant ranges.}
      In this subsection, Assumption 1 means Assumption
      \ref{assum:distribution_E_H_f} of the main paper, including its uniform
      sub-Gaussian and bounded-heterogeneity conditions. All concentration
      constants and confidence exponents are strictly positive. Fix the requested
      exponent \(c>0\) before choosing the constants. Put
      \[
       w_k=n_s^{(k)}/n_s,\quad a_t=\sqrt{\log p/n_t},\quad
       a_s=\sqrt{\log p/n_s},\quad
       \Sigma_X=\mathbb E[XX^\top],\quad M=\mathbb E[XH^\top].
      \]
      For a matrix, \(\|\cdot\|_\infty\) denotes the largest absolute entry; for a
      vector it is the usual maximum norm. We use
      \(\|B\|_{2,\infty}=\max_j\|B_{j,:}\|_2\).
      The moments exist by the uniform sub-Gaussian assumptions. In particular,
      \(M=\mathbb E[f(H)H^\top]\) because \(\mathbb E[EH^\top]=0\), and there is a
      fixed \(L_M>0\), depending only on \(L\), with \(\|M\|_{2,\infty}\le L_M\sqrt q\).
      This follows coordinatewise from Cauchy--Schwarz and the second-moment
      bounds. We work with \(n_s\ge n_t\ge N_0\log p\) and choose \(N_0\ge1\) large
      enough for the concentration lemmas below; consequently \(a_s\le a_t\le1\).

      ### Proof
      For later cross-references, the concentration events are
          \begin{align}
             & \left\{\left\|\frac{1}{n_t} X_t^\top X_t - \Sigma_X\right\|_{\infty} \le C_x\sqrt{\frac{\log p}{n_t}}\right\},\label{set:g_1}\tag{\(\mathcal{G}_1\)}\\
              &\left\{\left\|\frac{1}{n_s}\sum_{k=1}^K X_s^{(k)\top}X_s^{(k)} - \Sigma_X\right\|_{\infty} \le C_x\sqrt{\frac{\log p}{n_s}}\right\},\label{set:g_2}\tag{\(\mathcal{G}_2\)} \\
              & \left\{ \left\|\frac{1}{n_s}\sum_{k=1}^K n_s^{(k)}\left(\frac{1}{n_s^{(k)}}X_s^{(k)\top}X_s^{(k)} - \Sigma_X \right)\left(\beta_s^{(k)} - \frac{1}{n_s}\sum_{k=1}^Kn_s^{(k)}\beta_s^{(k)} \right) \right\|_{\infty}\le  C_{\delta} s_\delta\sqrt{\frac{\log p}{n_s}} \right\},
                \label{set:g_3}\tag{\(\mathcal{G}_3\)}\\&
                \left\{\left\|\frac{1}{n_t}f(H_t)^\top H_t - M\right\|_{2,\infty} \le 
              C_{H} \sqrt{\frac{q \log p}{n_t}}\right\},\label{set:g_4}\tag{\(\mathcal{G}_4\)}\\&
              \left\{\left\|\frac{1}{n_s}\sum_{k=1}^K f(H_s^{(k)})^\top H_s^{(k)} - M \right\|_{2,\infty} \le
              C_{H} \sqrt{\frac{q \log p}{n_s}}\right\},\label{set:g_5}\tag{\(\mathcal{G}_5\)}\\& 
              \left\{\left\| \frac{1}{n_t} E_t^\top H_t\right\|_{2,\infty} \le C_H\sqrt{\frac{q\log p}{n_t}}\right\}, \label{set:g_6}\tag{\(\mathcal{G}_6\)}\\&
              \left\{\left\| \frac{1}{n_s} \sum_{k=1}^K E_s^{(k)\top} H_s^{(k)}\right\|_{2,\infty} \le C_H\sqrt{\frac{q\log p}{n_s}}\right\}, \label{set:g_7}\tag{\(\mathcal{G}_7\)}\\&
              \left\{\left\|\frac{1}{n_t}X_t^\top \varepsilon_t\right\|_{\infty} \le C_\varepsilon \sqrt{\frac{\log p}{n_t}}\right\}, \label{set:g_8}\tag{\(\mathcal{G}_8\)}\\&
              \left\{\left\|\frac{1}{n_s}\sum_{k=1}^K X_s^{(k)\top} \varepsilon_s^{(k)}\right\|_{\infty} \le C_\varepsilon \sqrt{\frac{\log p}{n_s}}\right\}, \label{set:g_9}\tag{\(\mathcal{G}_9\)}
          \end{align}
      \begin{equation}
       \left\{\|T_\phi\|_\infty\le C_dB_\phi\sqrt q\,a_s\right\}.
       \label{set:g_10_weighted}\tag{\(\mathcal G_{10}^{\phi}\)}
      \end{equation}
      Here \(T_\phi\) has the explicit definition below. The simultaneous event
      \(\mathcal G\) is the intersection of these ten events. The original labels
      \(\mathcal G_1,\ldots,\mathcal G_9\) are retained for later cross-references.

      Let \(\mathcal G\) be the simultaneous event described in [ref:R1]. On this event the target and pooled source
      Gram matrices \(G_t=X_t^\top X_t/n_t\) and
      \(G_s=\sum_kX_s^{(k)\top}X_s^{(k)}/n_s\) satisfy
      \[
       \|G_t-\Sigma_X\|_\infty\le C_xa_t,\qquad
       \|G_s-\Sigma_X\|_\infty\le C_xa_s.
      \]
      Set \(\delta_k=\beta_s^{(k)}-\beta_s\), \(d_k=\phi_s^{(k)}-\phi_t\),
      \(\bar d=\sum_kw_kd_k\), and
      \[
       T_\beta={1\over n_s}\sum_k
       (X_s^{(k)\top}X_s^{(k)}-n_s^{(k)}\Sigma_X)\delta_k,\qquad
       T_\phi={1\over n_s}\sum_k
       (X_s^{(k)\top}H_s^{(k)}-n_s^{(k)}M)d_k.
      \]
      The source coefficient definition gives \(\sum_kw_k\delta_k=0\).
      [ref:R2] and [ref:R3] give
      \[
       \|T_\beta\|_\infty\le C_\delta s_\delta a_s,\qquad
       \|T_\phi\|_\infty\le C_d B_\phi\sqrt q\,a_s.
      \]
      Also put \(D_t=X_t^\top H_t/n_t-M\),
      \(D_s=\sum_kX_s^{(k)\top}H_s^{(k)}/n_s-M\),
      \(e_t=X_t^\top\varepsilon_t/n_t\) and
      \(e_s=\sum_kX_s^{(k)\top}\varepsilon_s^{(k)}/n_s\).
      On \(\mathcal G\), [ref:R4] and [ref:R5] imply
      \[
       \|D_t\|_{2,\infty}\le2C_H\sqrt q\,a_t,\quad
       \|D_s\|_{2,\infty}\le2C_H\sqrt q\,a_s,\quad
       \|e_t\|_\infty\le C_\varepsilon a_t,\quad
       \|e_s\|_\infty\le C_\varepsilon a_s.
      \]
      Crucially, the exact confounding decomposition is
      \begin{align}
       A_t-A_s&=(D_t-D_s)\phi_t-M\bar d-T_\phi,
       \label{eq:correct_weighted_confounding_decomposition}\\
       A_t&=X_t^\top H_t\phi_t/n_t,\qquad
       A_s=\sum_kX_s^{(k)\top}H_s^{(k)}\phi_s^{(k)}/n_s.\notag
      \end{align}
      Thus average similarity controls the population term, while the independent
      weighted-sum lemma controls its separate centered fluctuation:
      \[
       \|A_t-A_s\|_\infty\le
       [4C_H\sqrt q\|\phi_t\|_2+C_dB_\phi\sqrt q+
       L_MC_\phi\sqrt q]a_t.
      \]
      One cannot replace the weighted centered sum by a pooled matrix multiplied
      by an averaged coefficient vector.

      Write \(d=\beta_s-\hat\beta_{\mathrm{init}}\) and
      \(b=\sum_kX_s^{(k)\top}\hat Z_s^{(k)}/n_s\).
      The source model yields the exact identity
      \[
       b=G_sd+T_\beta+A_s+e_s.
      \]
      The four nonnegative error magnitudes may equivalently be named
      \begin{align}
       B_1&=\|(G_t-G_s)d\|_\infty,\label{term:B_1}\tag{\(B_1\)}\\
       B_2&=\|T_\beta\|_\infty,\label{term:B_2}\tag{\(B_2\)}\\
       B_3&=\|A_t-A_s\|_\infty,\label{term:B_3}\tag{\(B_3\)}\\
       B_4&=\|e_s\|_\infty.\label{term:B_4}\tag{\(B_4\)}
      \end{align}
      These labels identify the corresponding covariance, source-spread,
      confounding-transfer and source-noise estimates for subsequent proofs.
      Use the feasible target profiling comparison point
      \(Z_0=X_td+H_t\phi_t\). Its target score is \(G_td+A_t\), hence
      \begin{align}
       \Delta &:={X_t^\top Z_0\over n_t}-b
             =(G_t-G_s)d-T_\beta+(A_t-A_s)-e_s,
       \label{eq:profiled_score_decomposition}\\
       \|\Delta\|_\infty&\le
       [4C_H\sqrt q\|\phi_t\|_2+B_0]a_t,\notag\\
       B_0&=2C_xC_s+C_\delta s_\delta+C_dB_\phi\sqrt q
             +L_MC_\phi\sqrt q+C_\varepsilon>0,\notag
      \end{align}
      where the inequality uses \(\|d\|_1\le C_s\) on \(\mathcal I\).
      By the definition of the profiling minimizer,
      \(\|X_t^\top\hat Z_t/n_t-b\|_\infty\le\|\Delta\|_\infty\).
      Therefore the full Lasso noise score obeys
      \begin{align}
       Q&=\left\|{X_t^\top\over n_t}
             (X_td+H_t\phi_t-\hat Z_t+\varepsilon_t)\right\|_\infty
             \le2\|\Delta\|_\infty+\|e_t\|_\infty\notag\\
        &\le(C_1\sqrt q\|\phi_t\|_2+C_2)a_t,
       \label{eq:corrected_profiled_score_bound}
      \end{align}
      with the strictly positive choices \(C_1=8C_H\) and
      \(C_2=2B_0+C_\varepsilon\). All dependencies are as stated in the theorem.
      No asymptotic \(o(a_t)\) term or unspecified relation \(n_s\gg n_t\) is used.

      For completeness the two minimizers exist in finite dimensions. The image
      \(\{X_t^\top Z/n_t:Z\in\mathbb R^{n_t}\}\) is a closed linear subspace;
      minimizing its distance to \(b\) in the maximum norm attains a minimum
      by restricting to a bounded sublevel set in that image. Any preimage
      supplies \(\hat Z_t\). The Lasso objective is continuous and coercive because
      \(\lambda_t>0\), so it also attains a minimum.

      Let \(h=\hat\eta-\eta_0\). Lasso optimality and \(Q\le\lambda_t/4\) give
      \begin{align}
       {\|X_th\|_2^2\over n_t}
       &\le\lambda_t(\|\eta_0\|_1-\|\eta_0+h\|_1)
                        +{\lambda_t\over2}\|h\|_1\notag\\
       &\le{3\lambda_t\over2}\|h_{S_\eta}\|_1
                        -{\lambda_t\over2}\|h_{S_\eta^c}\|_1.
       \label{eq:sup:oracle_inequality}
      \end{align}
      Nonnegativity of the left side gives
      \(\|h_{S_\eta^c}\|_1\le3\|h_{S_\eta}\|_1\).
      On \(\mathcal R\), the RE bound therefore applies. If \(h=0\) all conclusions
      hold. Otherwise, by \(\|h_{S_\eta}\|_1\le\sqrt{s_\eta}\|h\|_2\),
      \[
       C_r\|h\|_2^2\le {3\lambda_t\over2}\sqrt{s_\eta}\|h\|_2,
       \qquad \|h\|_2\le{3\lambda_t\over2C_r}\sqrt{s_\eta}.
      \]
      The cone gives \(\|h\|_1\le4\sqrt{s_\eta}\|h\|_2\), giving \(6/C_r\).
      Substituting the \(\ell_2\) bound into
      \(\|X_th\|_2^2/n_t\le3\lambda_t\sqrt{s_\eta}\|h\|_2/2\)
      gives the prediction constant \(3/(2\sqrt{C_r})\).
      The case \(s_\eta=0\) is included: the cone then forces \(h=0\).
      Finally, \(\mathbb P(\mathcal G)\ge1-p^{-c}\); intersecting with
      \(\mathcal R\) and \(\mathcal I\) gives exactly the probability statement in
      the main theorem, without assuming these random events occur automatically.

