      ##### Lemma \(\ref{lem:high_probability_set}\)

      ###### Definitions and notation
      Let \(p\ge2\), let \(q\ge1\) be fixed, let \(K\ge1\), and let \(n_t,n_s^{(1)},\ldots,n_s^{(K)}\) be positive integers with
      \[
       n_s=\sum_{k=1}^K n_s^{(k)}\ge n_t.
      \]
      Put
      \[
       w_k=\frac{n_s^{(k)}}{n_s},\qquad
       a_t=\sqrt{\frac{\log p}{n_t}},\qquad
       a_s=\sqrt{\frac{\log p}{n_s}},\qquad
       \Sigma_X=\mathbb E[XX^\top],\qquad
       M=\mathbb E[XH^\top].
      \]
      The target model is
      \[
       Y_{ti}=\beta_t^\top X_{ti}+\phi_t^\top H_{ti}+\varepsilon_{ti},
       \qquad
       X_{ti}=f(H_{ti})+E_{ti},\quad i=1,\ldots,n_t,
      \]
      and, for \(k=1,\ldots,K\), the \(k\)-th source model is
      \[
       Y_{si}^{(k)}=\beta_s^{(k)\top}X_{si}^{(k)}+\phi_s^{(k)\top}H_{si}^{(k)}+\varepsilon_{si}^{(k)},
       \qquad
       X_{si}^{(k)}=f(H_{si}^{(k)})+E_{si}^{(k)},\quad i=1,\ldots,n_s^{(k)}.
      \]
      Let
      \[
       X_t=(X_{t1},\ldots,X_{tn_t})^\top\in\mathbb R^{n_t\times p},
       \qquad
       X_s^{(k)}=(X_{s1}^{(k)},\ldots,X_{s n_s^{(k)}}^{(k)})^\top\in\mathbb R^{n_s^{(k)}\times p},
      \]
      and analogously define \(H_t,E_t,\varepsilon_t\) and \(H_s^{(k)},E_s^{(k)},\varepsilon_s^{(k)}\). The source average coefficient is
      \[
       \beta_s=\sum_{k=1}^K w_k\beta_s^{(k)}
       =\frac{1}{n_s}\sum_{k=1}^K n_s^{(k)}\beta_s^{(k)},
      \]
      and the model shift is \(\eta_0=\beta_t-\beta_s\). Let \(S_\eta\) denote the support of \(\eta_0\).

      The target and pooled-source Gram matrices are
      \[
       G_t=\frac{X_t^\top X_t}{n_t},
       \qquad
       G_s=\frac{\sum_{k=1}^K X_s^{(k)\top}X_s^{(k)}}{n_s}.
      \]
      For a matrix, \(\|\cdot\|_\infty\) denotes the largest absolute entry; for a vector it is the usual maximum norm. We write
      \[
       \|B\|_{2,\infty}=\max_j\|B_{j,:}\|_2.
      \]

      The event \(\mathcal G\) in Lemma \(\ref{lem:high_probability_set}\) is defined in the proof of Theorem 1 in D1 as the intersection of the following ten events, with the original labels retained:
      \[
      \begin{aligned}
      \mathcal G_1&=\left\{\left\|\frac{1}{n_t}X_t^\top X_t-\Sigma_X\right\|_\infty
      \le C_x\sqrt{\frac{\log p}{n_t}}\right\},\\
      \mathcal G_2&=\left\{\left\|\frac{1}{n_s}\sum_{k=1}^K X_s^{(k)\top}X_s^{(k)}-\Sigma_X\right\|_\infty
      \le C_x\sqrt{\frac{\log p}{n_s}}\right\},\\
      \mathcal G_3&=\left\{\left\|\frac{1}{n_s}\sum_{k=1}^K n_s^{(k)}
      \left(\frac{1}{n_s^{(k)}}X_s^{(k)\top}X_s^{(k)}-\Sigma_X\right)
      \left(\beta_s^{(k)}-\frac{1}{n_s}\sum_{j=1}^K n_s^{(j)}\beta_s^{(j)}\right)
      \right\|_\infty
      \le C_\delta s_\delta\sqrt{\frac{\log p}{n_s}}\right\},\\
      \mathcal G_4&=\left\{\left\|\frac{1}{n_t}f(H_t)^\top H_t-M\right\|_{2,\infty}
      \le C_H\sqrt{\frac{q\log p}{n_t}}\right\},\\
      \mathcal G_5&=\left\{\left\|\frac{1}{n_s}\sum_{k=1}^K f(H_s^{(k)})^\top H_s^{(k)}-M\right\|_{2,\infty}
      \le C_H\sqrt{\frac{q\log p}{n_s}}\right\},\\
      \mathcal G_6&=\left\{\left\|\frac{1}{n_t}E_t^\top H_t\right\|_{2,\infty}
      \le C_H\sqrt{\frac{q\log p}{n_t}}\right\},\\
      \mathcal G_7&=\left\{\left\|\frac{1}{n_s}\sum_{k=1}^K E_s^{(k)\top}H_s^{(k)}\right\|_{2,\infty}
      \le C_H\sqrt{\frac{q\log p}{n_s}}\right\},\\
      \mathcal G_8&=\left\{\left\|\frac{1}{n_t}X_t^\top\varepsilon_t\right\|_\infty
      \le C_\varepsilon\sqrt{\frac{\log p}{n_t}}\right\},\\
      \mathcal G_9&=\left\{\left\|\frac{1}{n_s}\sum_{k=1}^K X_s^{(k)\top}\varepsilon_s^{(k)}\right\|_\infty
      \le C_\varepsilon\sqrt{\frac{\log p}{n_s}}\right\},\\
      \mathcal G_{10}^{\phi}&=\left\{\|T_\phi\|_\infty\le C_dB_\phi\sqrt q\,a_s\right\},
      \end{aligned}
      \]
      where
      \[
       d_k=\phi_s^{(k)}-\phi_t,
       \qquad
       T_\phi=\frac{1}{n_s}\sum_{k=1}^K
       \left(X_s^{(k)\top}H_s^{(k)}-n_s^{(k)}M\right)d_k.
      \]
      Thus
      \[
       \mathcal G=\bigcap_{j=1}^9\mathcal G_j\cap\mathcal G_{10}^{\phi}.
      \]
      In particular, on \(\mathcal G_1\) and \(\mathcal G_2\),
      \[
       \|G_t-\Sigma_X\|_\infty\le C_xa_t,
       \qquad
       \|G_s-\Sigma_X\|_\infty\le C_xa_s.
      \]

      The restricted-eigenvalue event \(\mathcal R\), which the source proof keeps separate from \(\mathcal G\), is the event from Assumption \(\ref{assum:distribution_E_H_f}\).c: for
      \[
       \mathcal A_{s_\eta}
       =\left\{u:\|u_{S_\eta^c}\|_1\le3\|u_{S_\eta}\|_1\right\},
      \]
      one has
      \[
       \frac1{n_t}\|X_tu\|_2^2\ge C_r\|u\|_2^2
       \qquad\text{for every }u\in\mathcal A_{s_\eta},
      \]
      with fixed \(C_r>0\). The initial-estimator event, also kept separate, is
      \[
       \mathcal I=\left\{\|\hat\beta_{\mathrm{init}}-\beta_s\|_1\le C_s\right\},
      \]
      where \(\hat\beta_{\mathrm{init}}\) is an initial estimator for \(\beta_s\) and \(C_s>0\) is the fixed initial-error bound from the main theorem.

      ###### Assumptions
      Assumption \(\ref{assum:distribution_E_H_f}\).a: Let \(p\ge2\), let \(q\ge1\) be fixed, let \(K\ge1\), and let \(n_t,n_s^{(1)},\ldots,n_s^{(K)}\) be positive integers, with \(n_s=\sum_k n_s^{(k)}\ge n_t\). Put \(w_k=n_s^{(k)}/n_s\) and \(a_t=\sqrt{\log p/n_t}\), \(a_s=\sqrt{\log p/n_s}\). All target and source sample rows are mutually independent. The pairs \((E,H)\) have the same joint distribution in every domain, and the same function \(f\) is used in \(X=f(H)+E\). Coordinates of \(E,H,f(H)\) are centered and have sub-Gaussian norms at most a fixed \(L>0\), uniformly over all coordinates and domains. Moreover \(\mathbb E[EH^\top]=0\). Independence between \(E\) and \(H\) is not required.

      Assumption \(\ref{assum:distribution_E_H_f}\).b: The centered noise terms are independent of their corresponding \((E,H)\), have a common variance \(\sigma^2\ge0\), and have sub-Gaussian norm at most a fixed \(L_\varepsilon>0\). The model coefficients are deterministic.

      Deterministic coefficient bounds in the main theorem: \(s_\eta\in\{0,\ldots,p\}\), \(|S_\eta|\le s_\eta\), and
      \[
      \max_{1\le k\le K}\|\beta_s^{(k)}-\beta_s\|_1\le s_\delta,
      \]
      where \(s_\delta\ge0\) is the fixed source-coefficient spread bound.

      Assumption \(\ref{assum:distribution_E_H_f}\).d: With
      \[
       \bar\phi_s=\sum_{k=1}^K w_k\phi_s^{(k)},
      \]
      there are fixed \(C_\phi,B_\phi>0\) such that
      \[
       \|\bar\phi_s-\phi_t\|_2\le C_\phi a_t,
       \qquad
       \max_{1\le k\le K}\|\phi_s^{(k)}-\phi_t\|_2\le B_\phi.
      \]
      The first condition is the weighted-average similarity condition. The second is a uniform bound on source heterogeneity; it does not require each source’s discrepancy to tend to zero. The constants \(L,L_\varepsilon,C_r,C_\phi,B_\phi\), the initial-error bound \(C_s>0\), and the source-coefficient spread bound \(s_\delta\ge0\) are independent of \(p,n_t,n_s,K\).

      The statement is for \(n_s\ge n_t\ge N_0\log p\), with \(N_0\ge1\) chosen sufficiently large; consequently \(a_s\le a_t\le1\).

      ###### Statement
      Under Assumptions \(\ref{assum:distribution_E_H_f}\).a--b and the deterministic coefficient bounds in the main theorem and Assumption \(\ref{assum:distribution_E_H_f}\).d, for every \(c>0\) there exist strictly positive
      \[
       C_x,C_\delta,C_H,C_d,C_\varepsilon,N_0
      \]
      such that, whenever \(n_s\ge n_t\ge N_0\log p\), all the bounds used in the proof of Theorem 1 hold simultaneously on an event \(\mathcal G\) with
      \[
       \mathbb P(\mathcal G)\ge1-p^{-c}.
      \]
      Here \(\mathcal G\) is the simultaneous event specified in Definitions and notation as \(\bigcap_{j=1}^9\mathcal G_j\cap\mathcal G_{10}^{\phi}\). The source proof keeps the restricted-eigenvalue event \(\mathcal R\) and the initial-estimator event \(\mathcal I\) separate from \(\mathcal G\).

      ##### Lemma \(\ref{lem:error_sample_covariance1}\)

      ###### Definitions and notation
      Let \(p\ge2\). Let \(X\) be an \(N\times p\) sample matrix whose \(N\) rows are independent and have the common covariate law \(X=f(H)+E\) from Assumption \(\ref{assum:distribution_E_H_f}\).a. Define
      \[
       \Sigma_X=\mathbb E[XX^\top].
      \]
      For a matrix, \(\|\cdot\|_\infty\) denotes the largest absolute entry. The constants \(C_x,N_x>0\) are strictly positive and may depend on the fixed distributional parameters and on \(c\).

      ###### Assumptions
      Assumption \(\ref{assum:distribution_E_H_f}\).a: Let \(p\ge2\), let \(q\ge1\) be fixed, let \(K\ge1\), and let \(n_t,n_s^{(1)},\ldots,n_s^{(K)}\) be positive integers, with \(n_s=\sum_{k=1}^K n_s^{(k)}\ge n_t\). Put \(w_k=n_s^{(k)}/n_s\) and \(a_t=\sqrt{\log p/n_t}\), \(a_s=\sqrt{\log p/n_s}\). All target and source sample rows are mutually independent. The pairs \((E,H)\) have the same joint distribution in every domain, and the same function \(f\) is used in \(X=f(H)+E\). Coordinates of \(E,H,f(H)\) are centered and have sub-Gaussian norms at most a fixed \(L>0\), uniformly over all coordinates and domains. Moreover \(\mathbb E[EH^\top]=0\). Independence between \(E\) and \(H\) is not required.

      For this lemma, \(N\) denotes the number of independent rows with the common covariate law, and \(N\ge N_x\log p\).

      ###### Statement
      Under Assumption \(\ref{assum:distribution_E_H_f}\).a, for every \(c>0\) there are \(C_x,N_x>0\) such that for \(N\ge N_x\log p\) independent rows with the common covariate law,
      \[
       \mathbb P\left(
       \left\|\frac{X^\top X}{N}-\Sigma_X\right\|_\infty
       \le C_x\sqrt{\frac{\log p}{N}}
       \right)
       \ge1-\frac{p^{-c}}{20}.
      \]
      The same constants work for the target rows and for all pooled source rows.

